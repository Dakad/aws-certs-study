questions:
  - id: aif-ml1
    domain: ai-ml-fundamentals
    question: A retailer wants a model that predicts next month's sales figure for each store from historical sales data. Which type of machine learning problem is this?
    answer_type: single
    options:
      - id: a
        text: Regression
      - id: b
        text: Binary classification
      - id: c
        text: Clustering
      - id: d
        text: Anomaly detection
      - id: e
        text: Multi-class classification
      - id: f
        text: Dimensionality reduction
      - id: g
        text: Time-series forecasting
      - id: h
        text: Reinforcement learning
    accepted_correct_option_ids:
      - a
      - g
    author_notes:
      explanation: Predicting a continuous value such as next month's sales is a regression problem, and because it projects a series of past values forward in time, it is also time-series forecasting.
      option_rationales:
        a: Regression predicts a continuous number, which is exactly a sales figure.
        b: Binary classification predicts one of two labels, not a numeric amount.
        c: Clustering groups similar records without a target value; it is unsupervised.
        d: Anomaly detection flags unusual records rather than forecasting a number.
        e: Multi-class classification picks one label from several, not a continuous value.
        f: Dimensionality reduction compresses features; it does not produce a prediction.
        g: Predicting future values such as next month's sales from a sequence of past values over time is time-series forecasting.
        h: Reinforcement learning trains an agent through rewards and penalties, not by predicting a numeric value from historical records.
  - id: aif-ml2
    domain: ai-ml-fundamentals
    question: Which TWO statements describe supervised learning?
    answer_type: multi
    options:
      - id: a
        text: The training data includes labeled target values.
      - id: b
        text: The model learns from rewards and penalties while interacting with an environment.
      - id: c
        text: Classification and regression are common supervised tasks.
      - id: d
        text: The algorithm discovers hidden groupings without any labels.
      - id: e
        text: It requires a foundation model as the starting point.
      - id: f
        text: It can only be used with image data.
      - id: g
        text: Predicting house prices from past sales records is a typical example.
      - id: h
        text: Model accuracy can be measured against known answers in test data.
      - id: i
        text: A human reviews every prediction the model makes before it is used.
      - id: j
        text: It generates new content, such as text or images, from a prompt.
    accepted_correct_option_ids:
      - a
      - c
      - g
      - h
    author_notes:
      explanation: Supervised learning trains on examples that already carry the correct answer (labels), so its predictions can be scored against known answers, and it covers classification and regression tasks such as house-price prediction.
      option_rationales:
        a: Labels are the defining feature of supervised learning.
        b: Learning from rewards describes reinforcement learning.
        c: Both classification and regression need labeled examples and are the two main supervised task types.
        d: Discovering groupings without labels is unsupervised learning (clustering).
        e: Supervised learning predates foundation models and does not require one.
        f: Supervised learning works with tabular, text, image, audio, and other data types.
        g: Past sales records carry the known price for each house, so learning to predict price from them is a textbook supervised regression task.
        h: Because the data is labeled, held-out test examples have known answers to score predictions against.
        i: The 'supervision' comes from labeled training data, not from a person checking each prediction, which is a separate human-in-the-loop step such as Amazon A2I.
        j: Generating new content from a prompt describes generative AI; supervised learning is defined by training on labeled examples.
  - id: aif-ml3
    domain: ai-ml-fundamentals
    question: An engineering team describes a system that stacks many layers of artificial neurons and learns useful features directly from raw images, with no manual feature extraction step. Which term best describes this approach?
    answer_type: single
    options:
      - id: a
        text: Deep learning
      - id: b
        text: Rule-based expert system
      - id: c
        text: Generative AI
      - id: d
        text: Reinforcement learning
      - id: e
        text: Robotic process automation
      - id: f
        text: Business intelligence reporting
      - id: g
        text: Extract, transform, and load (ETL)
      - id: h
        text: Convolutional neural networks
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Deep learning, which includes convolutional neural networks for images, is the subset of machine learning that uses multi-layer neural networks to learn feature representations directly from raw data such as images, audio, or text.
      option_rationales:
        a: "Deep learning is precisely this: many-layered neural networks that learn their own features from raw data."
        b: A rule-based expert system encodes if-then rules written by humans and learns nothing from data.
        c: Generative AI describes models that produce new content; it is an application area built on deep learning, not the layered-network technique itself.
        d: Reinforcement learning is defined by learning from rewards during interaction with an environment, not by network depth.
        e: Robotic process automation scripts repetitive user-interface steps and involves no learning from data.
        f: Business intelligence reporting summarizes historical data for humans; it makes no predictions.
        g: ETL moves and reshapes data between systems; it is a data pipeline step, not a learning method.
        h: Convolutional neural networks are many-layered networks that learn visual features directly from raw pixels, which is exactly the approach described.
  - id: aif-ml4
    domain: ai-ml-fundamentals
    question: A marketing department wants a system that drafts new product descriptions and summarizes inbound customer emails. Which statement best distinguishes generative AI from traditional predictive machine learning?
    answer_type: single
    options:
      - id: a
        text: Generative AI produces new content such as text, images, or code, while traditional predictive models output a label or a numeric value.
      - id: b
        text: Generative AI needs a labeled example for every possible output, while predictive models do not.
      - id: c
        text: Generative AI removes the need to evaluate output quality.
      - id: d
        text: Generative AI models are always smaller and cheaper to run than predictive models.
      - id: e
        text: Generative AI works only with images, never with text.
      - id: f
        text: Generative AI guarantees that every response is factually correct.
      - id: g
        text: Traditional predictive models cannot be trained on tabular data.
      - id: h
        text: Generative AI creates new samples from learned patterns, while predictive models map inputs to a target.
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Generative models create new content in response to a prompt, whereas classic predictive models return a class label or a number for a given input.
      option_rationales:
        a: "This is the core difference: generative models synthesize new content, predictive models emit a label or a number."
        b: Foundation models are pretrained on large unlabeled corpora, so they do not need a label for every possible output.
        c: Generative output still has to be evaluated for relevance, accuracy, toxicity, and bias.
        d: Foundation models are typically far larger and more expensive to run than a tabular classifier.
        e: Generative models cover text, images, audio, video, and code.
        f: Generative models can hallucinate, so factual correctness is never guaranteed.
        g: Tabular data is the most common input for traditional predictive models.
        h: Generative models learn the patterns of their training data well enough to produce new samples, whereas predictive models learn a mapping from an input to a label or value.
  - id: aif-ml5
    domain: ai-ml-fundamentals
    question: An insurer wants software that reads free-text claim notes and pulls out the sentiment, the key phrases, and the names of people and places mentioned. Which field of AI does this work belong to?
    answer_type: single
    options:
      - id: a
        text: Natural language processing
      - id: b
        text: Computer vision
      - id: c
        text: Speech synthesis
      - id: d
        text: Reinforcement learning
      - id: e
        text: Time series forecasting
      - id: f
        text: Optical character recognition
      - id: g
        text: Robotics
      - id: h
        text: Natural language understanding
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Natural language processing (NLP), including its natural language understanding (NLU) branch, covers machine understanding of human language such as sentiment analysis, key phrase extraction, and named entity recognition; Amazon Comprehend is the AWS managed service for these tasks.
      option_rationales:
        a: Sentiment, key phrases, and named entities are classic NLP tasks performed on text.
        b: Computer vision interprets images and video, not written language.
        c: Speech synthesis turns text into spoken audio, which is the opposite direction of this task.
        d: Reinforcement learning trains an agent through rewards and has no bearing on reading text.
        e: Time series forecasting predicts future numeric values from historical sequences.
        f: Optical character recognition converts text in images into machine-readable characters; here the claim notes are already digital text.
        g: Robotics concerns controlling physical machines.
        h: Natural language understanding is the branch of NLP concerned with extracting meaning, such as sentiment and named entities, from written text.
  - id: aif-ml6
    domain: ai-ml-fundamentals
    question: A marketing team holds 4 million customer records with no labels and wants to discover natural groupings of similar customers so campaigns can be targeted. Which technique fits, and which built-in Amazon SageMaker AI algorithm is designed for it?
    answer_type: single
    options:
      - id: a
        text: Clustering, using the built-in K-Means algorithm
      - id: b
        text: Binary classification, using the built-in XGBoost algorithm
      - id: c
        text: Regression, using the built-in Linear Learner algorithm
      - id: d
        text: Reinforcement learning, using a hand-designed reward function
      - id: e
        text: Time series forecasting, using the built-in DeepAR algorithm
      - id: f
        text: Object detection, using a built-in computer vision algorithm
      - id: g
        text: Text summarization, using a foundation model
      - id: h
        text: Unsupervised learning, using the built-in K-Means algorithm
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: With no labels and a goal of finding natural groups, this is unsupervised clustering, and K-Means is the built-in SageMaker AI algorithm for clustering.
      option_rationales:
        a: Clustering finds groups in unlabeled data, and K-Means is the SageMaker AI built-in algorithm for exactly that.
        b: Binary classification needs labeled examples of two classes, which this dataset does not have.
        c: Regression predicts a continuous target and also requires labels.
        d: Reinforcement learning needs an environment and reward signal, neither of which exists here.
        e: DeepAR forecasts future values of time series; the team wants customer groups, not a forecast.
        f: Object detection locates items in images, which is unrelated to customer records.
        g: Summarization condenses text and does not group records by similarity.
        h: The records carry no labels, which makes this unsupervised learning, and K-Means is the SageMaker AI built-in algorithm that groups similar records.
  - id: aif-ml7
    domain: ai-ml-fundamentals
    question: A warehouse robotics team trains an agent in simulation. The agent tries an action, receives a positive reward when a package lands in the correct bin and a penalty when it hits a shelf, and gradually improves its policy. Which type of machine learning is this?
    answer_type: single
    options:
      - id: a
        text: Reinforcement learning
      - id: b
        text: Supervised learning
      - id: c
        text: Unsupervised learning
      - id: d
        text: Semi-supervised learning
      - id: e
        text: Transfer learning
      - id: f
        text: Batch inference
      - id: g
        text: Feature engineering
      - id: h
        text: Trial-and-error learning
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Reinforcement learning, often described as trial-and-error learning, trains an agent that takes actions in an environment and improves its policy from the rewards and penalties it receives.
      option_rationales:
        a: An agent, an environment, actions, and a reward signal are the defining elements of reinforcement learning.
        b: Supervised learning needs a dataset of inputs paired with correct answers, not a reward signal.
        c: Unsupervised learning finds structure in unlabeled data and involves no actions or rewards.
        d: Semi-supervised learning mixes a small labeled set with a large unlabeled set; there are no labels here at all.
        e: Transfer learning reuses a pretrained model for a new task and describes how training starts, not how the agent learns from rewards.
        f: Batch inference is a way of running predictions on a stored dataset, not a learning type.
        g: Feature engineering prepares input variables before training and is not a learning paradigm.
        h: Trial-and-error learning guided by rewards and penalties is the standard plain-language description of reinforcement learning, which is what this agent is doing.
  - id: aif-ml8
    domain: ai-ml-fundamentals
    question: "A data engineer inventories three sources: rows in an Amazon RDS for PostgreSQL table, JSON clickstream files whose optional fields vary from record to record, and scanned PDF contracts. How are these three best classified?"
    answer_type: single
    options:
      - id: a
        text: Structured, semi-structured, and unstructured, in that order
      - id: b
        text: Structured, structured, and semi-structured, in that order
      - id: c
        text: Semi-structured, structured, and unstructured, in that order
      - id: d
        text: Unstructured, semi-structured, and structured, in that order
      - id: e
        text: All three are structured because each is stored in an AWS service
      - id: f
        text: All three are unstructured because each contains text
      - id: g
        text: Labeled, unlabeled, and semi-labeled, in that order
      - id: h
        text: Tabular, semi-structured, and unstructured, in that order
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Rows in a relational table follow a fixed schema and are structured, tabular data, JSON with varying optional fields is semi-structured, and scanned documents have no predefined schema and are unstructured.
      option_rationales:
        a: Relational rows are structured, flexible-schema JSON is semi-structured, and scanned PDFs are unstructured.
        b: JSON with varying fields is semi-structured rather than structured, and a scanned PDF is unstructured rather than semi-structured.
        c: Relational table rows are structured, not semi-structured, so the order is wrong.
        d: This reverses the classification entirely.
        e: Where data is stored does not determine its structure; an S3 object can hold any of the three kinds.
        f: Containing text does not make data unstructured; structure is about having a predefined, consistent schema.
        g: Labeled and unlabeled describe whether a target value is present for training, which is a different distinction from data structure.
        h: Relational rows are tabular, which is structured data, flexible-schema JSON is semi-structured, and scanned PDFs are unstructured.
  - id: aif-ml9
    domain: ai-ml-fundamentals
    question: Since 2024, a retail company's ML team has used the same AWS capability to draw bounding boxes around products in 200,000 photographs, manage the human workforce doing the work, and produce a training-ready manifest of labels. Which AWS capability is the team using?
    answer_type: single
    options:
      - id: a
        text: Amazon SageMaker Ground Truth
      - id: b
        text: Amazon SageMaker Model Monitor
      - id: c
        text: Amazon SageMaker Feature Store
      - id: d
        text: Amazon SageMaker Clarify
      - id: e
        text: The Amazon Rekognition DetectLabels API
      - id: f
        text: AWS Glue crawlers
      - id: g
        text: Amazon SageMaker automatic model tuning
      - id: h
        text: The Amazon SageMaker AI CreateLabelingJob API
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: SageMaker Ground Truth, whose labeling jobs are started with the CreateLabelingJob API, builds labeled training datasets with a private, vendor, or Amazon Mechanical Turk workforce and writes the results to an output manifest. Ground Truth has not been open to new customers since July 30, 2026, but existing customers such as this team can keep using it.
      option_rationales:
        a: Ground Truth is the AWS data labeling service, including bounding-box tasks and managed human workforces.
        b: Model Monitor watches an already deployed endpoint for drift; it does not create labels.
        c: Feature Store stores and serves engineered features; it does not annotate images.
        d: Clarify measures bias and explains predictions; it does not produce labels.
        e: DetectLabels returns labels a pretrained model already recognizes and cannot create human-verified bounding boxes for the company's own product categories.
        f: Glue crawlers infer schemas for a data catalog and have nothing to do with image annotation.
        g: Automatic model tuning searches hyperparameter ranges after a labeled dataset already exists.
        h: CreateLabelingJob is the Ground Truth API that runs a bounding-box labeling job with an assigned human workforce and writes the labels to an output manifest.
  - id: aif-ml10
    domain: ai-ml-fundamentals
    question: A team splits its dataset into training, validation, and test sets. What is the role of the validation set, as distinct from the test set?
    answer_type: single
    options:
      - id: a
        text: It is used to tune hyperparameters and choose between candidate models during development, while the test set is held back for a final unbiased performance estimate.
      - id: b
        text: It is used to update the model weights, while the test set tunes hyperparameters.
      - id: c
        text: It holds the labels while the training set holds only the features.
      - id: d
        text: It is required only for unsupervised learning.
      - id: e
        text: It removes the need for a test set when the dataset is very large.
      - id: f
        text: It is the live production traffic sent to the endpoint after deployment.
      - id: g
        text: It is a backup copy of the training data kept for disaster recovery.
      - id: h
        text: It guides early stopping and model selection, while the test set is kept for one final evaluation.
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: The validation set guides decisions made during development, such as hyperparameter values, when to stop training, and which model to keep, so the test set can stay untouched and give an honest estimate of performance on unseen data.
      option_rationales:
        a: "This is the standard division of labor: validation for tuning and selection, test for a single final unbiased estimate."
        b: Weights are learned from the training set, not the validation set.
        c: All three splits contain both features and labels in supervised learning.
        d: Unsupervised learning has no labeled target to validate against; splits like this belong to supervised workflows.
        e: Once the validation set has influenced model choices, it is no longer unbiased, so a separate test set is still needed.
        f: Production traffic arrives after deployment and is not part of the dataset split.
        g: A validation set exists to measure generalization, not to protect against data loss.
        h: Deciding when to stop training and which candidate to keep are validation-set jobs, which leaves the test set untouched for a single final measurement.
  - id: aif-ml11
    domain: ai-ml-fundamentals
    question: A model scores 99% accuracy on its training data but only 62% on held-out test data. Which TWO statements about this result are correct?
    answer_type: multi
    options:
      - id: a
        text: The model is overfitting the training data.
      - id: b
        text: Adding regularization, simplifying the model, or gathering more diverse training data can narrow the gap.
      - id: c
        text: The model is underfitting and needs a more complex algorithm.
      - id: d
        text: The gap proves that the test set labels are wrong.
      - id: e
        text: Training for many more epochs on the same data is the recommended fix.
      - id: f
        text: Overfitting can occur only with deep learning models.
      - id: g
        text: A model that scores far higher on training data than on test data will still generalize well in production.
      - id: h
        text: Early stopping based on validation performance can help prevent this.
      - id: i
        text: Cross-validation can help detect this problem before deployment.
      - id: j
        text: Training on a smaller subset of the data will narrow the gap.
    accepted_correct_option_ids:
      - a
      - b
      - h
      - i
    author_notes:
      explanation: A large gap between training and test performance is the classic signature of overfitting; cross-validation helps detect it, and reducing model complexity, adding regularization, stopping training early, or training on more representative data helps prevent it.
      option_rationales:
        a: Near-perfect training accuracy with much weaker test accuracy is the definition of overfitting.
        b: Regularization, a simpler model, and more varied training data all reduce memorization of the training set.
        c: Underfitting shows up as poor performance on both training and test data, which is not the case here.
        d: A training-to-test gap points to the model memorizing the training set, not to mislabeled test data.
        e: More epochs on the same data usually deepens memorization and makes overfitting worse.
        f: Any model family can overfit, including decision trees and linear models with too many features.
        g: Test performance is the better predictor of production behavior, so poor generalization should be expected.
        h: Stopping training once validation performance stops improving keeps the model from going on to memorize noise in the training set.
        i: K-fold cross-validation scores the model on data held out from each training round, which exposes a gap between training and validation performance.
        j: Less training data makes it easier for the model to memorize examples, which usually widens the gap rather than narrowing it.
  - id: aif-ml12
    domain: ai-ml-fundamentals
    question: A lender scores its entire portfolio of 8 million loan applications once each night and writes the predictions to Amazon S3. No interactive response is required, and the team wants to avoid paying for idle infrastructure between runs. Which Amazon SageMaker AI inference option fits best?
    answer_type: single
    options:
      - id: a
        text: Batch transform
      - id: b
        text: A real-time inference endpoint left running 24 hours a day
      - id: c
        text: Asynchronous inference
      - id: d
        text: Serverless inference
      - id: e
        text: A multi-model real-time endpoint
      - id: f
        text: Self-managed model containers on Amazon EC2 behind an Application Load Balancer
      - id: g
        text: The Amazon SageMaker Feature Store online store
      - id: h
        text: Offline batch inference
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Batch transform, the SageMaker AI option for offline batch inference, provisions compute, scores a whole dataset read from Amazon S3, writes the results back to S3, and then releases the resources, which suits scheduled offline scoring.
      option_rationales:
        a: Batch transform is designed for scoring a large stored dataset on a schedule, with no persistent endpoint to pay for.
        b: An always-on endpoint bills continuously for capacity the workload only needs once a night.
        c: Asynchronous inference handles individual long-running or large-payload requests arriving over time, not one scheduled pass over an entire dataset.
        d: Serverless inference targets intermittent request-response traffic; it is not the tool for scoring millions of records from S3 in one job.
        e: A multi-model endpoint saves cost when hosting many models behind one endpoint, but it is still an always-on real-time endpoint.
        f: Running your own containers reintroduces the undifferentiated heavy lifting that batch transform already manages.
        g: The Feature Store online store serves feature values with low latency; it does not run inference.
        h: Offline batch inference, which SageMaker AI runs as a batch transform job, scores the whole stored dataset in one pass with no persistent endpoint to pay for.
  - id: aif-ml13
    domain: ai-ml-fundamentals
    question: A media company needs inference on video files where a single request carries a payload of several hundred megabytes and can take up to ten minutes to process. Requests arrive sporadically, and the caller is content to be notified when each result is ready. Which Amazon SageMaker AI inference option fits best?
    answer_type: single
    options:
      - id: a
        text: Asynchronous inference
      - id: b
        text: A real-time inference endpoint
      - id: c
        text: Serverless inference
      - id: d
        text: Batch transform on a fixed nightly schedule
      - id: e
        text: Amazon SageMaker Inference Recommender
      - id: f
        text: A shadow variant on an existing endpoint
      - id: g
        text: Amazon SageMaker Canvas
      - id: h
        text: Queue-based inference that can scale to zero
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Asynchronous inference queues incoming requests, supports large payloads and long processing times, notifies the caller through Amazon SNS when a result is ready, and can scale instances down to zero when the queue is empty.
      option_rationales:
        a: Queuing, large payload support, long processing times, and scale-to-zero between requests are exactly what asynchronous inference provides.
        b: Real-time endpoints cap request payload size and duration at roughly 6 MB and 60 seconds, so these requests would fail.
        c: Serverless inference has a smaller maximum payload and the same short request timeout, and it offers no queue for long-running work.
        d: Batch transform processes a whole dataset on a schedule; here individual requests arrive sporadically and each needs its own result.
        e: Inference Recommender benchmarks instance types and endpoint configurations; it does not serve production traffic.
        f: A shadow variant mirrors traffic to a candidate model for comparison and does not change payload or timeout limits.
        g: Canvas is a no-code interface for business users, not a programmatic inference option.
        h: This describes SageMaker AI Asynchronous Inference, which queues each large, long-running request, writes the result to Amazon S3, and can scale instances to zero between requests.
  - id: aif-ml14
    domain: ai-ml-fundamentals
    question: A hospital builds a classifier that screens patients for a rare but serious condition. Missing a patient who truly has the condition is far more damaging than sending a healthy patient for one extra test. Which evaluation metric should the team prioritize?
    answer_type: single
    options:
      - id: a
        text: Recall, also called sensitivity or the true positive rate
      - id: b
        text: Precision
      - id: c
        text: Accuracy
      - id: d
        text: Specificity
      - id: e
        text: Root mean squared error
      - id: f
        text: R-squared
      - id: g
        text: Inference latency at the 99th percentile
      - id: h
        text: False negative rate
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Recall is the share of truly positive cases the model catches and the false negative rate is the share it misses, so these are the metrics to optimize when false negatives, such as a missed diagnosis, are the expensive error.
      option_rationales:
        a: Recall directly measures how many sick patients the model finds, which is what the hospital cannot afford to miss.
        b: Precision measures how many flagged patients really have the condition, which controls false alarms rather than missed cases.
        c: With a rare condition, a model that predicts negative for everyone can still post very high accuracy while catching nobody.
        d: Specificity measures how well true negatives are identified and says nothing about missed positive cases.
        e: Root mean squared error applies to regression, where the target is a continuous number.
        f: R-squared measures explained variance in a regression model, not classification quality.
        g: Latency is an operational service level, not a measure of predictive quality.
        h: The false negative rate is the share of truly sick patients the model misses; it equals one minus recall, so driving it down is the same priority.
  - id: aif-ml15
    domain: ai-ml-fundamentals
    question: A spam filter marks a legitimate customer email as spam. In the confusion matrix for this classifier, where spam is the positive class, how is that outcome counted, and which metric does it degrade?
    answer_type: single
    options:
      - id: a
        text: It is a false positive, and it lowers precision.
      - id: b
        text: It is a false negative, and it lowers recall.
      - id: c
        text: It is a true positive, and it raises precision.
      - id: d
        text: It is a true negative, and it raises specificity.
      - id: e
        text: It is a false positive, and it lowers recall.
      - id: f
        text: It is excluded from the confusion matrix because the label is ambiguous.
      - id: g
        text: It only affects the area under the ROC curve, not precision or recall.
      - id: h
        text: It is a Type I error, and it lowers precision.
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: The email is actually negative but was predicted positive, which is a false positive, also called a Type I error, and false positives are the term in the denominator of precision.
      option_rationales:
        a: Predicting positive for an actually negative record is a false positive, and more false positives means lower precision.
        b: "A false negative is the opposite mistake: real spam that the filter lets through."
        c: A true positive is real spam correctly caught, which is not what happened here.
        d: A true negative is a legitimate email correctly delivered, which is also not what happened.
        e: The classification is right but the metric is wrong; recall is reduced by false negatives, not false positives.
        f: Every prediction falls into one of the four confusion matrix cells; none are excluded.
        g: A false positive lowers precision directly, and the ROC curve is built from the same counts, so the effect is not confined to AUC.
        h: A Type I error is another name for a false positive, and every false positive lowers precision.
