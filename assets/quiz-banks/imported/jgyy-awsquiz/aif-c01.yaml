      - i
    author_notes:
      explanation: "AWS Artifact is where AWS publishes its third-party audit artefacts: SOC 1, SOC 2, and SOC 3 reports, ISO certificates, PCI documents, and agreements such as the AWS GDPR data processing addendum. The reports cover AWS's side of the shared responsibility model, so they evidence the infrastructure, while the customer still has to evidence their own configuration and processes separately."
      option_rationales:
        a: Artifact is the on-demand download portal for AWS audit reports and certifications.
        b: Audit Manager assesses the customer's workloads and produces the customer's evidence, not AWS's certificates.
        c: Config records configuration history for the customer's resources and issues no compliance reports about AWS.
        d: Security Hub aggregates findings about the customer's environment, not AWS's audit documents.
        e: Trusted Advisor reports best-practice checks on the account and has no audit reports.
        f: Inspector reports vulnerabilities in the customer's workloads.
        g: CloudTrail records the account's API activity; it holds no AWS certifications.
        h: Macie reports on sensitive data in the customer's buckets.
        i: AWS Artifact Reports is where account holders download AWS's SOC reports and ISO certificates on demand.
  - id: aif-sec15
    domain: ai-security-governance
    question: An ML platform team must show an external auditor that the AWS resources in every account of its organization meet the technical controls of PCI DSS. They want to deploy the framework's rules as a single package from a prebuilt template, track a compliance score over time, and export configuration evidence for the auditor. Which service is built for that?
    answer_type: single
    options:
      - id: a
        text: AWS Config conformance packs, deployed across the organization from a prebuilt framework template
      - id: b
        text: AWS Artifact, which supplies AWS's own audit reports rather than evidence about the customer's workloads
      - id: c
        text: Amazon Inspector, which scans workloads for software vulnerabilities
      - id: d
        text: Amazon CloudWatch, which collects metrics and log events from workloads
      - id: e
        text: AWS CloudTrail, which records the API calls made in the account
      - id: f
        text: AWS Trusted Advisor, which checks the account against best practices in six categories
      - id: g
        text: Amazon GuardDuty, which detects threats from account and network telemetry
      - id: h
        text: AWS Organizations service control policies, which cap the permissions available to member accounts
      - id: i
        text: An AWS Config conformance pack built from the Operational Best Practices for PCI DSS template
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: AWS Audit Manager closed to new customers on April 30, 2026, and AWS now points compliance teams to conformance packs in AWS Config. A conformance pack deploys a framework's technical controls as Config rules, from sample templates for standards such as PCI DSS, NIST 800-53, and HIPAA, to one account or across an organization; its dashboard shows a compliance score, a compliance timeline, and the configuration items behind each result, which can be exported with advanced queries as evidence. Conformance packs cover only controls that Config rules can evaluate, so documented policies and procedures still need evidence from elsewhere.
      option_rationales:
        a: A conformance pack deploys a framework's Config rules as one unit to every account in an organization, with a compliance score, per-resource history, and configuration items that can be exported as evidence.
        b: Artifact provides AWS's audits of AWS, which is the other half of the shared responsibility model.
        c: Inspector reports vulnerabilities in the customer's workloads; it does not evaluate resources against a compliance framework's controls.
        d: CloudWatch collects operational telemetry, which may become evidence but is not an audit workflow.
        e: CloudTrail records who did what in the account, which can support an audit, but it does not evaluate resources against a framework's rules.
        f: Trusted Advisor's checks are best-practice advice, not a framework-mapped assessment.
        g: GuardDuty detects threats and does not manage audits.
        h: Service control policies are preventive guardrails; they do not evaluate or report on whether resources comply with a framework.
        i: The sample PCI DSS conformance pack template maps the standard's technical controls to Config rules, and its dashboard shows compliance for each rule and resource.
  - id: aif-sec16
    domain: ai-security-governance
    question: A governance lead wants ongoing automated checking of the AWS account itself, for example that the buckets holding training data are not publicly accessible and that the account follows AWS best practices, instead of a manual review once a quarter. Which TWO services provide that continuous checking?
    answer_type: multi
    options:
      - id: a
        text: AWS Config rules, which continuously evaluate resource configurations and flag non-compliant resources
      - id: b
        text: AWS Trusted Advisor, which continuously inspects the account against best-practice checks for cost optimization, performance, security, fault tolerance, service limits, and operational excellence
      - id: c
        text: AWS Artifact, which is a download portal for AWS audit reports
      - id: d
        text: Amazon SageMaker Model Monitor, which checks a deployed endpoint's data for drift
      - id: e
        text: AWS KMS, which creates and controls encryption keys
      - id: f
        text: Amazon CloudFront, which caches content at edge locations
      - id: g
        text: AWS Cost Explorer, which analyses spending trends over time
      - id: h
        text: Amazon EventBridge, which routes events between AWS services
      - id: i
        text: AWS Security Hub CSPM, which evaluates the account against security standards
      - id: j
        text: IAM Access Analyzer, which flags buckets shared publicly or outside the account
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "Continuous compliance needs something that watches configuration as it changes: AWS Config evaluates each change against rules such as the check for S3 public read access, Trusted Advisor and Security Hub CSPM run ongoing best-practice and standards checks, and IAM Access Analyzer flags buckets exposed publicly or outside the account. All of them run continuously, which is what separates them from a point-in-time review."
      option_rationales:
        a: Config rules evaluate resources as they change and report compliant and non-compliant resources over time.
        b: Trusted Advisor continuously checks the account against AWS best practices, including security checks such as public access.
        c: Artifact hands over AWS's audit documents; it evaluates nothing in the customer's account.
        d: Model Monitor watches the data an endpoint receives, which is model quality rather than account compliance.
        e: KMS manages keys. It enforces key policies but performs no compliance evaluation.
        f: CloudFront is a content delivery network with no compliance role.
        g: Cost Explorer analyses spend and cannot tell you whether a bucket is public.
        h: EventBridge routes events, including compliance events from Config, but it does not evaluate anything itself.
        i: Security Hub CSPM continuously evaluates resources against standards such as AWS Foundational Security Best Practices, including controls for public S3 buckets.
        j: IAM Access Analyzer continuously monitors resource policies and reports buckets that grant public or cross-account access.
  - id: aif-sec17
    domain: ai-security-governance
    question: Six weeks after an incident, the security team must establish which IAM principal invoked a particular foundation model, at what time, and from which source IP address. Which service holds that record?
    answer_type: single
    options:
      - id: a
        text: AWS CloudTrail, which records the API calls made in the account, including Amazon Bedrock InvokeModel events
      - id: b
        text: Amazon CloudWatch metrics, which aggregate numeric measures such as invocation count and latency but do not identify the caller
      - id: c
        text: AWS Config, which records configuration changes to resources rather than individual API invocations
      - id: d
        text: AWS Artifact, which distributes AWS compliance reports
      - id: e
        text: Amazon Macie, which finds sensitive data in Amazon S3
      - id: f
        text: AWS Trusted Advisor, which reports best-practice checks for the account
      - id: g
        text: Amazon Inspector, which reports software vulnerabilities in workloads
      - id: h
        text: AWS Secrets Manager, which stores credentials and their rotation history
      - id: i
        text: AWS CloudTrail event history, which keeps the last 90 days of management events
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: CloudTrail answers "who did what, when, and from where". Each event records the principal, the event time, the source IP address, and the request parameters, and Amazon Bedrock is integrated with CloudTrail so that calls such as InvokeModel appear there. Event history covers the last 90 days in the console; a trail delivering to Amazon S3 keeps events for as long as the retention policy says.
      option_rationales:
        a: Attributing an API call to a principal, a time, and a source IP address is exactly what a CloudTrail event provides.
        b: CloudWatch metrics are aggregated numbers; no metric identifies which principal made a call.
        c: Config captures the configuration state of resources over time, and a model invocation is not a configuration change.
        d: Artifact holds AWS's audit documents and no record of the account's activity.
        e: Macie reports on sensitive data at rest, not on who called an API.
        f: Trusted Advisor offers best-practice checks, not an activity log.
        g: Inspector reports vulnerabilities in workloads and logs no API calls.
        h: Secrets Manager tracks its own secrets and rotations, not Bedrock invocations.
        i: Bedrock logs InvokeModel as a management event, so CloudTrail event history still shows the principal, time, and source IP address six weeks later.
  - id: aif-sec18
    domain: ai-security-governance
    question: Compliance asks the team to retain the full text of the prompts and completions exchanged with Amazon Bedrock so that a reviewer can sample real conversations later. Which capability produces that record?
    answer_type: single
    options:
      - id: a
        text: Model invocation logging, which delivers the full request and response data to Amazon CloudWatch Logs, an Amazon S3 bucket, or both
      - id: b
        text: AWS CloudTrail events, which record that InvokeModel was called but not the prompt and completion text
      - id: c
        text: Amazon CloudWatch metrics such as Invocations and InvocationLatency, which are numeric only
      - id: d
        text: Amazon Bedrock Guardrails, which filter content at inference time but do not archive the conversation
      - id: e
        text: AWS Config, which records configuration changes to AWS resources
      - id: f
        text: Amazon Macie, which classifies sensitive data already stored in Amazon S3
      - id: g
        text: AWS X-Ray, which traces a request through the components of an application
      - id: h
        text: Amazon S3 server access logging, which records the requests made to a bucket
      - id: i
        text: Invocation logging in the Amazon Bedrock settings, with text data included in the logs
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Model invocation logging is the Bedrock setting that captures invocation data, including the prompt and the model's response, and delivers it to CloudWatch Logs or Amazon S3. It is off by default and is enabled deliberately, because the logged data will contain whatever the prompts contain, so the destination needs its own encryption, access control, and retention policy.
      option_rationales:
        a: Delivering full invocation input and output to CloudWatch Logs or S3 is exactly what model invocation logging does.
        b: CloudTrail records the API call and its metadata for audit, not the prompt body or the completion.
        c: Metrics are aggregated numbers and hold no text.
        d: Guardrails block or mask content as it passes; retaining the conversation is a separate concern.
        e: Config records the configuration of resources, not the content of model calls.
        f: Macie scans data already stored somewhere; it does not create the record in the first place.
        g: X-Ray traces latency and call paths through an application, without capturing model payloads.
        h: S3 server access logging records bucket requests, which is unrelated to Bedrock invocations.
        i: Turning on model invocation logging with text data included records each prompt and completion in CloudWatch Logs or Amazon S3 for later review.
  - id: aif-sec19
    domain: ai-security-governance
    question: An EU retailer must keep the customer personal data used by its generative AI application inside the European Union to satisfy its GDPR commitments. Which approach meets that requirement?
    answer_type: single
    options:
      - id: a
        text: Deploy the workload in an EU AWS Region and keep the data stores and services it uses within that Region, since the customer chooses the Region and AWS does not move the content elsewhere without instruction
      - id: b
        text: Deploy in any Region and tag the resources "EU only", since tags are evaluated before data is stored
      - id: c
        text: Enable cross-Region replication from the EU bucket to a US Region so that a durable second copy exists
      - id: d
        text: Rely on AWS to place the data automatically in whichever Region is closest to each user
      - id: e
        text: Encrypt the data with AWS KMS, which removes any residency obligation for the encrypted copies
      - id: f
        text: Store the data in a global Amazon S3 bucket that belongs to no particular Region
      - id: g
        text: Enable Amazon CloudFront so the content is cached at edge locations worldwide
      - id: h
        text: Download AWS's SOC 2 report from AWS Artifact, which certifies the residency of the workload
      - id: i
        text: Deploy only in EU Regions and use a service control policy to deny requests to other Regions
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Data residency on AWS is achieved by choosing the Region and keeping the architecture inside it. The customer selects where content is stored, and AWS does not move it to another Region unless the customer configures something that does so. Controls such as IAM and service control policy conditions on aws:RequestedRegion, or AWS Control Tower data residency controls, can enforce that choice rather than leave it to convention.
      option_rationales:
        a: Selecting an EU Region and confining the workload's services and storage to it is the mechanism that delivers residency.
        b: A tag is metadata. It does not constrain where a service stores data.
        c: Cross-Region replication to the United States deliberately copies the data out of the EU, breaking the requirement.
        d: AWS does not relocate customer content by proximity; the Region is the customer's choice, and automatic movement is not how the platform works.
        e: Encryption protects confidentiality wherever the data sits; it does not change where the data is.
        f: Every S3 bucket is created in a specific Region; there is no global, Region-less bucket.
        g: Caching at worldwide edge locations distributes copies of content more widely, which works against the requirement.
        h: An audit report describes AWS's controls; it cannot certify where a particular workload placed its data.
        i: Running in EU Regions with a service control policy on aws:RequestedRegion keeps the workload's data in the EU and blocks resources from being created elsewhere.
  - id: aif-sec20
    domain: ai-security-governance
    question: A data governance policy states that raw prompt logs held in Amazon S3 may be kept for 90 days and must then be deleted automatically, with no manual step. Which mechanism implements that?
    answer_type: single
    options:
      - id: a
        text: An S3 Lifecycle configuration with an expiration rule that deletes objects 90 days after creation
      - id: b
        text: S3 Versioning, which retains previous versions of objects rather than removing them
      - id: c
        text: S3 Object Lock in compliance mode, which prevents objects from being deleted for a fixed retention period
      - id: d
        text: An IAM policy that denies s3:GetObject on objects older than 90 days
      - id: e
        text: AWS Backup, which copies data into a backup vault on a schedule
      - id: f
        text: Amazon Macie, which reports which objects contain sensitive data
      - id: g
        text: AWS Config, which records configuration changes to the bucket
      - id: h
        text: S3 Transfer Acceleration, which speeds up long-distance uploads
      - id: i
        text: An S3 Lifecycle expiration action filtered to the log objects by prefix or tag
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Retention limits are part of data governance, and on Amazon S3 they are implemented with an S3 Lifecycle configuration. An expiration rule, optionally scoped by prefix or tag, deletes objects a set number of days after creation, so the policy is enforced by the platform rather than by someone remembering to run a clean-up script.
      option_rationales:
        a: A lifecycle expiration rule is the built-in, automatic deletion mechanism, and it can be scoped to the prompt log prefix.
        b: Versioning keeps more copies rather than fewer, which works against a deletion requirement.
        c: Object Lock in compliance mode forbids deletion for the retention period, the opposite of what the policy asks for.
        d: IAM policies control who may call an API; they cannot express object age, and denying reads does not delete anything.
        e: AWS Backup creates and retains backup copies; it does not expire objects in the source bucket.
        f: Macie classifies data and reports findings; it deletes nothing.
        g: Config records the bucket's configuration history and performs no data management action.
        h: Transfer Acceleration affects upload speed and nothing else.
        i: An expiration action in a lifecycle rule, scoped by prefix or tag, makes S3 delete matching objects automatically once they reach the set age.
  - id: aif-sec21
    domain: ai-security-governance
    question: A team takes an existing third-party foundation model and fine-tunes it on the company's own labelled data, then serves the tuned model to internal users. Using the AWS Generative AI Security Scoping Matrix, which scope describes this workload?
    answer_type: single
    options:
      - id: a
        text: "Scope 4, fine-tuned models: an existing foundation model tuned with the organisation's own data"
      - id: b
        text: "Scope 1, consumer application: staff use a public, third-party generative AI service"
      - id: c
        text: "Scope 2, enterprise application: a business application with generative AI features, used under an enterprise agreement"
      - id: d
        text: "Scope 3, pre-trained models: an application built on an existing model whose weights are not changed"
      - id: e
        text: "Scope 5, self-trained models: a model trained from scratch on the organisation's own data"
      - id: f
        text: "Scope 6, agentic applications: any workload in which the model can call tools"
      - id: g
        text: The matrix has a single scope for all generative AI workloads, so no classification is needed
      - id: h
        text: "Scope 4, fine-tuned models: the organization's data changes the weights of a model it did not pre-train"
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "The Generative AI Security Scoping Matrix has five scopes, ordered by how much of the model and data the organisation owns: Scope 1 consumer application, Scope 2 enterprise application, Scope 3 pre-trained models, Scope 4 fine-tuned models, and Scope 5 self-trained models. Tuning someone else's foundation model on your own data is Scope 4, which brings training data governance and the protection of the tuned weights into the security picture alongside the usual application controls."
      option_rationales:
        a: Fine-tuning an existing model with the organisation's data is the definition of Scope 4.
        b: Scope 1 covers staff using a public consumer service, where the organisation controls neither the model nor the data handling.
        c: Scope 2 covers a vendor's business application with generative AI features, not a model the customer tunes.
        d: Scope 3 covers building on a pre-trained model without changing its weights, which is what fine-tuning does change.
        e: Scope 5 is training a model from scratch on your own data, which is a much larger undertaking than tuning an existing one.
        f: There is no Scope 6; the matrix stops at five scopes, and tool use does not create a new one.
        g: The whole point of the matrix is that different scopes carry different security responsibilities.
        h: Adjusting the weights of a model someone else pre-trained, using the organization's own data, is what places a workload in Scope 4.
  - id: aif-sec22
    domain: ai-security-governance
