  - id: aif-sec26
    domain: ai-security-governance
    question: A health-tech company builds its AI features on Amazon Bedrock and is preparing for ISO/IEC 42001 certification. Its compliance lead points out that AWS already holds an ISO/IEC 42001 certification of its own. Which TWO statements about the company's position are accurate?
    answer_type: multi
    options:
      - id: a
        text: The company inherits AWS's certification automatically, because it builds only on AWS services that are in the certificate's scope
      - id: b
        text: The company is not certified by association and must have its own AI management system audited
      - id: c
        text: ISO/IEC 42001 is an information security standard, so the company's existing ISO/IEC 27001 certificate already satisfies it
      - id: d
        text: Enabling Amazon Bedrock Guardrails on every model makes the company's AI systems ISO/IEC 42001 certified
      - id: e
        text: The standard applies to the company even though it consumes models through Amazon Bedrock rather than developing them
      - id: f
        text: AWS acts as the company's certification body and issues its ISO/IEC 42001 certificate on request
      - id: g
        text: Under the shared responsibility model, AWS is accountable for how the company's own AI applications are governed and used
      - id: h
        text: AWS's ISO/IEC 42001 certificate, available in AWS Artifact, can be offered as supporting evidence about the AWS services the company uses
      - id: i
        text: An AWS Config conformance pack that reports full compliance serves as the company's ISO/IEC 42001 certificate
      - id: j
        text: AWS's certification may make it easier for the company to achieve its own certification
    accepted_correct_option_ids:
      - b
      - e
      - h
      - j
    author_notes:
      explanation: "ISO/IEC 42001 specifies requirements for establishing, implementing, maintaining, and continually improving an Artificial Intelligence Management System (AIMS), and it is meant for organizations that provide or use AI-based products and services. AWS's certification, verified by an accredited third-party certification body and downloadable from AWS Artifact, covers AWS's own AI management for the services listed in its certificate. Certification is not inherited: as with other compliance programs under the shared responsibility model, the company must run its own AIMS and pass its own audit, although building on certified AWS services can make that easier."
      option_rationales:
        a: AWS states that customers are not certified by association; its certificate covers AWS's own AI management, not the customer's.
        b: Certification belongs to the organization whose AI management system was audited, so the company needs its own audit whatever AWS holds.
        c: ISO/IEC 42001 is the AI management system standard, which is separate from the information security management standard ISO/IEC 27001.
        d: Guardrails are a technical control inside an application; certification requires an accredited body to audit the whole management system.
        e: The standard is designed for organizations that provide or use AI-based products and services, so consuming models through a managed service does not take the company out of scope.
        f: AWS was itself certified by an accredited third-party certification body; it does not certify its customers.
        g: Customers remain responsible for how they design, govern, and use their own AI applications; AWS is responsible for the services it operates.
        h: Account holders can download AWS's ISO/IEC 42001 certificate from AWS Artifact and present it as evidence about the AWS side of the workload.
        i: A conformance pack checks resource configurations against rules; it is not an audit of an AI management system and certifies nothing.
        j: AWS notes that its certification may make it easier for a customer pursuing ISO/IEC 42001 to certify, although the customer's own audit is still required.
  - id: aif-sec27
    domain: ai-security-governance
    question: A health insurer keeps a claims table in its Amazon S3 data lake, cataloged in the AWS Glue Data Catalog. A data science team will query the table through Amazon Athena to prepare training data for a fraud detection model. The team may see claim amounts, procedure codes, and dates, but must never see the policyholder name or national ID columns, and the security team does not want a separate de-identified copy of the table to maintain. What should they use?
    answer_type: single
    options:
      - id: a
        text: An Amazon S3 bucket policy that denies the team's role access to the table's prefix
      - id: b
        text: AWS Lake Formation permissions that grant the team's role SELECT on the permitted columns only
      - id: c
        text: Amazon Macie, which reports which objects in the data lake contain personal data
      - id: d
        text: An AWS KMS customer managed key on the bucket, with decrypt permission granted to the team's role
      - id: e
        text: Amazon Bedrock Guardrails sensitive information filters that mask names and ID numbers
      - id: f
        text: An AWS Glue crawler that records the table's columns and data types in the Data Catalog
      - id: g
        text: IAM Access Analyzer, which reports resources that are shared outside the account
      - id: h
        text: A Lake Formation data filter that excludes the name and national ID columns, granted to the team's role
      - id: i
        text: S3 Object Lock in compliance mode on the objects that hold the table
    accepted_correct_option_ids:
      - b
      - h
    author_notes:
      explanation: AWS Lake Formation adds fine-grained permissions to tables in the AWS Glue Data Catalog, enforced when integrated engines such as Amazon Athena, Amazon EMR, and Amazon Redshift Spectrum read the data. Granting SELECT on specific columns, or through a data filter, gives column-level security; a row filter expression gives row-level security, and combining the two gives cell-level security. The data scientists can therefore build training data from the table while the sensitive columns never appear in their results, with no duplicate dataset to keep in sync.
      option_rationales:
        a: A bucket policy works on whole objects and prefixes, so it can block the entire table but cannot hide two columns while exposing the rest.
        b: Lake Formation column-level permissions let the role query only the named columns through integrated engines such as Athena, without copying the data.
        c: Macie finds and reports personal data in S3 objects, which shows where the sensitive columns are but does not restrict who can read them.
        d: A KMS key allows or denies decryption of whole objects, so a role that can decrypt the table sees every column in it.
        e: Guardrails filter the prompts and responses of generative AI applications; they do not govern what an Athena query returns from a table.
        f: A crawler infers the schema and populates the Data Catalog; it grants and restricts nothing.
        g: Access Analyzer highlights resources shared outside the zone of trust; it does not limit which columns an internal team can query.
        h: A data filter whose column specification excludes the sensitive columns gives column-level security, and the same mechanism can add a row filter for row- or cell-level security.
        i: Object Lock stops objects from being deleted or overwritten, which protects integrity but not confidentiality.
