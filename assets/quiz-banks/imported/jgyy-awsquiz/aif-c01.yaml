    question: An executive sponsor asks for a framework that helps the organisation prepare for AI adoption across business, people, governance, platform, security, and operations perspectives, including capabilities such as AI strategy, skills, and responsible AI oversight. Which AWS resource is that?
    answer_type: single
    options:
      - id: a
        text: The AWS Cloud Adoption Framework for Artificial Intelligence, Machine Learning, and Generative AI (CAF-AI)
      - id: b
        text: The AWS Well-Architected Machine Learning Lens, which gives technical design guidance for ML workloads
      - id: c
        text: The Generative AI Security Scoping Matrix, which classifies a workload by how much of the model and data the organisation owns
      - id: d
        text: AWS Artifact, which distributes AWS's audit reports and agreements
      - id: e
        text: The AWS shared responsibility model, which divides security duties between AWS and the customer
      - id: f
        text: AWS Audit Manager, which collects evidence for compliance assessments
      - id: g
        text: AWS Control Tower, which provisions and governs a multi-account environment
      - id: h
        text: Amazon SageMaker Model Dashboard, which lists deployed models and their monitoring status
      - id: i
