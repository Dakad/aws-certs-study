        f: A knowledge base splits, embeds, and indexes documents for retrieval; it does not write a summary of each one.
        g: An always-on real-time endpoint bills for instances by the hour and is built for low-latency traffic, not a cheap offline job.
        h: An asynchronous batch job processes the whole collection from one request, and supported models are priced lower for batch than for on-demand calls.
