      - id: g
        text: By storing the whole corpus in a database and retrieving the closest sentence for each prompt
      - id: h
        text: By training a separate small model for each task the finished model will later perform
      - id: i
        text: Through transfer learning from a small labeled sample of the startup's own documents
    accepted_correct_option_ids:
      - c
      - f
    author_notes:
      explanation: "Foundation models are pre-trained with self-supervised learning: the model reads huge unlabeled corpora and learns by predicting the next token, or a masked one, so the data provides its own labels. Human-labeled data comes later and in much smaller amounts, for fine-tuning and alignment steps such as instruction tuning and reinforcement learning from human feedback."
      option_rationales:
        a: Labeled prompt-and-response pairs are used later, in instruction fine-tuning, and in far smaller numbers than the pre-training corpus.
        b: Reinforcement learning from human feedback is an alignment step applied after pre-training, not how the base model first learns language.
        c: Because the next word of real text serves as the target, the corpus labels itself, which is what makes training on web-scale text feasible.
        d: Pre-training is a prediction task in which the model learns by predicting next or missing tokens, not by clustering documents.
        e: Language models learn statistical patterns from data; no one hand-writes grammar rules for them.
        f: Foundation models are pre-trained with self-supervised learning, which creates labels from the input data itself, typically through next-token prediction.
        g: A model learns patterns into its parameters rather than storing a retrievable copy of the corpus.
        h: One pre-trained foundation model serves many tasks; building a model per task is the traditional ML approach it replaces.
        i: A small company sample could be used later for customization, but pre-training uses very large, broad corpora.
  - id: aif-gen30
    domain: genai-fundamentals
    question: A telecom support portal uses keyword search. A customer types "my phone keeps dropping calls" and gets no results, although an article titled "Fixing intermittent voice disconnections" answers the question exactly. Which approach would find that article?
    answer_type: single
    options:
      - id: a
        text: Exact string matching on article titles, which is stricter than keyword search and therefore surfaces more relevant articles
      - id: b
        text: Ranking articles by how many letters they share with the query, which catches misspellings and near-miss words as well
      - id: c
        text: Raising the temperature of a text generation model so that it considers a wider and more varied set of articles
      - id: d
        text: Comparing the query's embedding with each article's embedding and returning the nearest vectors, since closeness reflects meaning
      - id: e
        text: Representing each article as a one-hot encoding of its title words, which captures how similar two texts are in their meaning
      - id: f
        text: Sorting the keyword results by publication date so that the newest and most relevant articles appear at the top
      - id: g
        text: Semantic search, which ranks articles by the cosine similarity of their embeddings to the query's embedding
      - id: h
        text: Searching only the article titles instead of the full article text, which removes irrelevant matches from the results
      - id: i
        text: Choosing a model with a larger context window so that longer customer questions fit into the search request
    accepted_correct_option_ids:
      - d
      - g
    author_notes:
      explanation: Keyword (lexical) search matches the words a user types, so it misses relevant content that is phrased differently. Semantic search embeds the query and the documents with the same embedding model and ranks documents by a similarity measure such as cosine similarity or vector distance, so text with the same meaning is found even when no words are shared. Many search systems combine both approaches as hybrid search.
      option_rationales:
        a: Exact matching is stricter than keyword search, so it finds even less when the customer and the article use different words.
        b: Shared letters measure spelling, not meaning, and "dropping calls" and "voice disconnections" have little in common letter by letter.
        c: Temperature affects how a generative model samples tokens and plays no part in retrieving documents.
        d: Embedding both texts and returning the nearest vectors retrieves articles by meaning, so different wording still matches.
        e: One-hot encodings are sparse and carry no notion of similarity, so they cannot match different words with the same meaning.
        f: Sorting changes the order of results that were found and cannot surface an article that keyword matching missed.
        g: Semantic search compares meaning through embeddings and a similarity measure such as cosine similarity, which is exactly what this wording mismatch needs.
        h: Narrowing the search to titles removes candidate matches rather than adding the one that uses different words.
        i: The query is already short, and context window size does not change whether keyword matching finds the article.
  - id: aif-gen31
    domain: genai-fundamentals
    question: A news publisher wants a "more like this" panel that shows stories similar to the one a reader is viewing, and wants to group 2 million archived stories into topic clusters. A developer proposes prompting a large text generation model to compare stories. Which kind of model is the better fit for these features?
    answer_type: single
    options:
      - id: a
        text: A large text generation model prompted to compare every pair of stories and reply with a similarity score from 1 to 10
      - id: b
        text: An embedding model such as Amazon Titan Text Embeddings V2, which turns each story into a comparable vector
      - id: c
        text: A text-to-image diffusion model that illustrates each story so that the pictures can be compared
      - id: d
        text: A speech-to-text model that transcribes each story before the stories are compared
      - id: e
        text: A text-to-speech model that reads each story aloud so that listeners can judge similarity
      - id: f
        text: A time series forecasting model trained on each story's daily page views
      - id: g
        text: An image classification model that assigns a category label to each story's lead photo
      - id: h
        text: A text generation model with temperature set to zero, whose summaries of the stories are then compared word by word
      - id: i
        text: A text embedding model such as Cohere Embed on Amazon Bedrock, whose vectors can be clustered and searched
    accepted_correct_option_ids:
      - b
      - i
    author_notes:
      explanation: "Similarity search, recommendations, and clustering all run on embeddings: an embedding model maps each item to a vector so that related items sit close together, and those vectors can be indexed, compared, and clustered cheaply at scale. A text generation model produces new text rather than comparable vectors, so it is the wrong tool for comparing millions of items. Amazon Titan Text Embeddings V2 and the Cohere Embed models on Amazon Bedrock are built for these tasks."
      option_rationales:
        a: Comparing 2 million stories pair by pair would take trillions of slow, costly generation calls, and generated scores are not consistent enough to rank or cluster reliably.
        b: Titan Text Embeddings V2 produces vectors for retrieval that also serve semantic similarity and clustering, which is exactly what both features need.
        c: A diffusion model generates images, and picture similarity says little about whether two stories cover the same topic.
        d: The stories are already text, and transcription produces text rather than a representation that can be compared.
        e: Text-to-speech creates audio for listening and provides nothing that can be compared or clustered.
        f: Forecasting predicts future values of a time series such as page views, not how similar two stories are.
        g: A label for the lead photo ignores the story's text and is far too coarse for finding similar stories.
        h: Comparing summaries word by word is keyword matching in disguise and misses stories that say the same thing in different words.
        i: Cohere Embed models on Amazon Bedrock produce embeddings for search, classification, and clustering, so similar stories can be found by vector distance.
  - id: aif-gen32
