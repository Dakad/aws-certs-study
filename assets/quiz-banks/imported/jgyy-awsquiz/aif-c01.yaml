  - id: aif-ra6
    domain: responsible-ai
    question: A resume screening model is trained on ten years of the company's own hiring decisions. Those past decisions favoured one group of candidates, and the new model reproduces the same pattern even though no demographic field was included as a feature. What is the most likely source of the model's bias?
    answer_type: single
    options:
      - id: a
        text: The historical training data encodes past human decisions, so the model learns the pattern in them, and correlated features act as proxies for the attribute that was left out
      - id: b
        text: The model is overfitting because it was trained for too many epochs
      - id: c
        text: The inference temperature is set too high
      - id: d
        text: The model is underfitting because it has too few parameters
      - id: e
        text: The endpoint instance type is too small for the request volume
      - id: f
        text: The model's context window is too short for a resume
      - id: g
        text: The learning rate was set too low during training
      - id: h
        text: Historical bias in the labels, carried through proxy features for the omitted attribute
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: A supervised model learns the relationship present in its labels. When the labels are historical human decisions that were themselves skewed, the model reproduces that skew, and dropping the sensitive attribute does not help because other features, such as postcode or the name of a school, correlate with it and serve as proxies. The fix is upstream, in how the dataset is assembled and reviewed, not in a training hyperparameter.
      option_rationales:
        a: Learning from biased historical labels, with correlated features acting as proxies, is the classic source of this behaviour.
        b: Overfitting means the model memorises its training set and generalises poorly; here it generalises the bias faithfully, which is a data problem.
        c: Temperature is a generative sampling setting and does not apply to a tabular classifier's group outcomes.
        d: Underfitting means the model is too simple to capture the signal, which would show up as poor accuracy overall, not a consistent group skew.
        e: Instance size affects latency and throughput, never which candidates the model favours.
        f: Context window length is a property of a language model's input and would truncate text, not skew outcomes by group.
        g: A low learning rate slows convergence; it does not create a demographic pattern.
        h: Labels that record past skewed decisions carry historical bias, and features correlated with the omitted attribute let the model reproduce it.
