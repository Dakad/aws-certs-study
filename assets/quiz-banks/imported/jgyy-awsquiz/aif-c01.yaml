  - id: aif-ra21
    domain: responsible-ai
    question: In responsible AI, how do interpretability and explainability differ?
    answer_type: single
    options:
      - id: a
        text: Interpretability is the degree to which a person can understand the model's mechanism by inspecting the model itself, whereas explainability is being able to account for the model's outputs, typically with post-hoc techniques, even when the mechanism stays opaque
      - id: b
        text: Interpretability is the ability to account for outputs after the fact, whereas explainability means a person can read the model's internal logic directly
      - id: c
        text: They are two names for the same property, so the terms can be used interchangeably
      - id: d
        text: Interpretability means the model is accurate, and explainability means the model is fair
      - id: e
        text: Interpretability measures how quickly the model returns a prediction, and explainability measures how much it costs
      - id: f
        text: Interpretability applies only to generative models and explainability only to classifiers
      - id: g
        text: Explainability is measured with ROUGE and interpretability with BLEU
      - id: h
        text: Interpretability comes from a model simple enough to read directly; explainability uses methods such as SHAP to account for an opaque model
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: A model is interpretable when a person can follow its mechanism directly, as with a small decision tree or a linear model whose coefficients can be read. A model is explainable when its behaviour can be accounted for, usually with post-hoc methods such as SHAP feature attribution, even though the internals are too complex to read. Explainability techniques therefore let a team reason about an opaque model without making that model interpretable.
      option_rationales:
        a: Understanding the mechanism directly versus accounting for outputs after the fact is the accepted distinction.
        b: This reverses the two definitions.
        c: The terms are related but distinct; treating them as identical loses the point that an opaque model can still be explained.
        d: Accuracy and fairness are separate properties and neither term means either of them.
        e: Latency and cost are operational measures unconnected to these terms.
        f: Both concepts apply across model types, including classic classifiers and foundation models.
        g: ROUGE and BLEU are text generation quality metrics and measure neither concept.
        h: A readable model structure versus post-hoc methods that account for a model you cannot read is the accepted distinction between the two terms.
  - id: aif-ra22
    domain: responsible-ai
    question: "A regulator requires that a lender be able to show, from the structure of the model itself, how each declined application was decided. The data science team has two candidates: a shallow decision tree whose rules can be read directly, and a deep ensemble that scores two points higher on accuracy but whose internals cannot be followed. How should the team resolve the trade-off?"
    answer_type: single
    options:
      - id: a
        text: Choose the inherently interpretable decision tree, because the regulatory need for a model whose logic can be inspected outweighs a small accuracy gain
      - id: b
        text: Always choose the model with the highest accuracy, because predictive performance is the only criterion that matters
      - id: c
        text: Deploy the ensemble and skip the documentation, since the accuracy gain justifies it
      - id: d
        text: There is no trade-off, because deep ensembles are inherently interpretable
      - id: e
        text: Deploy the ensemble and raise its inference temperature, which makes any model interpretable
      - id: f
        text: Deploy the ensemble and train it for more epochs, which will make its logic readable
      - id: g
        text: Deploy the ensemble and tell the regulator that explanations are impossible for modern models
      - id: h
        text: Deploy the decision tree, since post-hoc explanations of the ensemble would not expose the logic the regulator requires
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "Model choice is a responsible AI decision, not only an accuracy decision. There is a genuine tension between predictive power and transparency: simpler model families are easier to inspect, while higher-capacity models often score better and are opaque. Where a regulator requires the logic itself to be inspectable, post-hoc explanation of an opaque model does not satisfy the requirement, so the interpretable model wins despite the small loss in accuracy."
      option_rationales:
        a: Weighing a hard transparency requirement against a marginal accuracy gain and choosing the inspectable model is the correct resolution.
        b: Treating accuracy as the only criterion ignores the regulatory, fairness, and transparency constraints on the workload.
        c: Skipping documentation would breach the requirement outright and leave the lender unable to justify decisions.
        d: Deep ensembles combine many high-capacity models and are a standard example of an opaque one.
        e: Temperature is a generative sampling setting and has nothing to do with a credit classifier's transparency.
        f: More epochs changes the fitted weights, never the readability of the model's structure.
        g: Explanations are possible for opaque models through post-hoc methods, so the claim is untrue as well as unhelpful.
        h: Post-hoc explanations describe an opaque model's outputs without making its structure inspectable, so only the tree satisfies the requirement despite its small accuracy loss.
  - id: aif-ra23
    domain: responsible-ai
    question: A team is assembling the training dataset for a model that will serve a broad public audience. Which TWO practices most directly reduce unwanted bias in that dataset?
    answer_type: multi
    options:
      - id: a
        text: Check that every group the system will serve appears in the data in sufficient numbers, and collect more data for the groups that are thin
      - id: b
        text: Write explicit labeling guidelines, train the annotators on them, and measure agreement between annotators
      - id: c
        text: Increase the learning rate so the model converges faster on the data already collected
      - id: d
        text: Train for more epochs on the same data
      - id: e
        text: Drop the validation split so that all records can be used for training
      - id: f
        text: Duplicate the existing majority-group records to make the dataset larger
      - id: g
        text: Raise the model's inference temperature
      - id: h
        text: Deploy the model on a larger instance type
      - id: i
        text: Audit historical labels for past discriminatory decisions before using them as the training target
      - id: j
        text: Check features for proxies of sensitive attributes, such as neighborhood, and remove or transform them
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "Unwanted bias is addressed in the data, before training: check that every group is represented, label with written guidelines and measured annotator agreement, audit historical labels for past discrimination, and remove features that act as proxies for sensitive attributes. Training settings and infrastructure choices cannot undo problems built into the data."
      option_rationales:
        a: Representativeness across the groups the system serves is the first defence against unequal error rates.
        b: Clear guidelines and measured annotator agreement keep subjective judgement out of the labels.
        c: The learning rate governs the speed and stability of optimisation, not the composition of the data.
        d: More passes over a skewed dataset reinforces the skew rather than correcting it.
        e: Removing the validation split destroys the team's ability to detect the problem and adds no new data.
        f: Duplicating majority records makes the imbalance worse, not better.
        g: Temperature is a generative sampling setting applied at inference and has no effect on the dataset.
        h: Instance size affects throughput and cost only.
        i: Historical decisions used as labels carry past bias into the model, so reviewing and correcting them before training removes that bias at its source.
        j: Features that stand in for a sensitive attribute let bias through even when the attribute itself is dropped, so removing or transforming them reduces it.
  - id: aif-ra24
    domain: responsible-ai
    question: A marketing team wants to publish copy written by a foundation model without review. Which TWO risks should the legal and risk team raise?
    answer_type: multi
    options:
      - id: a
        text: Generated text may reproduce material that closely resembles copyrighted work, which can expose the company to an intellectual property claim
      - id: b
        text: A confident but fabricated statement about a product, published and acted on by customers, can cause real harm and damage trust in the brand
      - id: c
        text: Using a foundation model transfers all legal liability for the published content to the model provider
      - id: d
        text: Text produced by a foundation model is automatically in the public domain, so competitors may reuse it freely
      - id: e
        text: Foundation models cannot produce text in more than one language, so international campaigns will fail
      - id: f
        text: Organisations that use foundation models are exempt from data protection law for the resulting content
      - id: g
        text: The model's context window shrinks each time it is called, so later copy will be shorter
      - id: h
        text: Enabling prompt caching voids the provider's service terms
      - id: i
        text: Copy can repeat biases or stereotypes from the training data, alienating groups of customers
      - id: j
        text: Output can expose personal or confidential information that appeared in prompts or training data
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "Unreviewed generative output carries several legal and reputational risks: it can resemble copyrighted material, state fabricated facts with confidence, echo biases or stereotypes, or expose personal or confidential data. None of these is removed by using a managed service, so review of high-visibility output, grounding in approved source material, and content policy controls remain the team's responsibility."
      option_rationales:
        a: Output that resembles copyrighted work is a recognised intellectual property risk of generative AI.
        b: A fluent, confident falsehood published without review is the hallucination risk and directly damages customer trust.
        c: Responsibility for how output is used stays with the customer; provider indemnities are limited and conditional and do not remove that duty.
        d: Copyright status of generated content is unsettled and varies by jurisdiction; it is not automatically public domain.
        e: Many foundation models are explicitly multilingual, so this is simply untrue.
        f: No exemption from data protection law exists for content produced with AI.
        g: The context window is a fixed property of the model and does not shrink with use.
        h: Prompt caching is a supported cost and latency feature, not a terms violation.
        i: Biased or stereotyped content published under the brand is a recognized fairness and reputational risk of unreviewed generative output.
        j: Generated text can disclose personal or confidential data, which creates a privacy and confidentiality risk the legal team must weigh.
  - id: aif-ra25
    domain: responsible-ai
    question: A sustainability review asks the team to cut the environmental footprint of a new generative AI feature. Which choice reduces it the most?
    answer_type: single
    options:
      - id: a
        text: Start from an existing pre-trained foundation model and adapt it with prompting or light customisation, because pre-training a model from scratch consumes far more compute and energy than anything downstream
      - id: b
        text: Pre-train a new model from scratch on the company's own corpus so that it is exactly the right size
      - id: c
        text: Always select the model with the largest parameter count available
      - id: d
        text: Raise the maximum response length on every request so that answers are never truncated
      - id: e
        text: Run inference on the largest available accelerated instance whatever the traffic level
      - id: f
        text: Turn off auto scaling so that capacity is always provisioned for the annual peak
      - id: g
        text: Replicate the training dataset into every AWS Region for faster access
      - id: h
        text: Use a pre-trained model from Amazon Bedrock or SageMaker JumpStart, adapting it only as far as needed
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Pre-training dominates the energy cost of a foundation model, so the single largest sustainability lever is to reuse a model somebody has already trained and adapt it, rather than training one from scratch. After that, choosing the smallest model that meets the requirement, using optimised inference, and letting capacity scale with demand keep the running footprint down.
      option_rationales:
        a: Avoiding a from-scratch pre-training run removes by far the largest block of compute and energy in the lifecycle.
        b: Pre-training from scratch is the most energy-intensive option available and is what the review would want avoided.
        c: A larger model costs more compute for every single request, increasing the footprint rather than reducing it.
        d: A higher output ceiling means more tokens generated per call, which increases energy use.
        e: Over-provisioned accelerators idle at low traffic and waste energy.
        f: Provisioning permanently for peak leaves capacity running and consuming power when it is not needed.
        g: Copying data into every Region multiplies the storage and replication footprint without reducing compute.
        h: Reusing a model that has already been pre-trained avoids the largest energy cost in the lifecycle, the pre-training run itself.
  - id: aif-ra26
    domain: responsible-ai
    question: An HR team is launching an assistant that answers employees' questions about parental leave. Eligibility under the written leave policy depends on several interacting conditions, such as length of service, contract type, and weekly hours, and a wrong answer could have legal consequences. The team wants every answer checked against that policy with mathematically verifiable reasoning, so that answers contradicting the policy are flagged and correct ones come with the rules that support them. Which capability is built for this?
    answer_type: single
    options:
      - id: a
        text: The contextual grounding check in Amazon Bedrock Guardrails, which scores how well each answer is supported by the source passages supplied with it
      - id: b
        text: A denied topic in an Amazon Bedrock guardrail that blocks questions about parental leave
      - id: c
        text: Automated Reasoning checks in Amazon Bedrock Guardrails, using a policy created from the leave document
      - id: d
        text: An Amazon Bedrock knowledge base that retrieves the relevant policy passages before the model answers
      - id: e
        text: Content filters in Amazon Bedrock Guardrails set to High for every harm category
      - id: f
        text: Fine-tuning the model on several years of answers that HR staff have given to leave questions
      - id: g
        text: Setting the temperature to 0 so that the model's answers vary as little as possible
      - id: h
        text: A guardrail with an Automated Reasoning policy, which turns the leave rules into formal logic and returns a finding such as valid or invalid for each answer
      - id: i
        text: A sensitive information filter that masks employee IDs in the assistant's answers
    accepted_correct_option_ids:
      - c
      - h
    author_notes:
      explanation: Automated Reasoning checks, a safeguard in Amazon Bedrock Guardrails, turn a source document such as an HR or eligibility policy into formal logic rules and variables, then validate each model response against them. Every response receives a finding such as valid or invalid, together with the rules and variable assignments behind it, so factual errors are caught by mathematically verifiable reasoning rather than by a probabilistic score. The checks run in detect mode, returning findings the application uses to serve, rewrite, or clarify an answer, and they complement content filters and contextual grounding checks rather than replacing them.
      option_rationales:
        a: The grounding check compares an answer with supplied passages and applies a score threshold; it gives no formal proof and does not say which policy rules make an answer correct.
        b: A denied topic would stop the assistant answering leave questions at all, instead of checking whether its answers are correct.
        c: Automated Reasoning checks extract formal rules and variables from the policy document and validate each response against them, flagging contradictions and citing the rules that make an answer valid.
        d: Retrieval gives the model the right passages to draw on, which can reduce errors, but it does not verify the finished answer against the policy's rules.
        e: Content filters screen for harmful categories such as hate and violence and say nothing about whether a leave answer is correct.
        f: Fine-tuning shapes how the model answers, but its output stays probabilistic and comes with no proof that it follows the policy.
        g: A low temperature makes the wording more consistent, not more correct; a wrong answer can be repeated just as consistently, and nothing is checked against the policy.
        h: An Automated Reasoning policy attached to a guardrail returns a finding for each answer with the rules and variable values behind it, which is mathematically verifiable feedback rather than a model's judgment.
        i: A sensitive information filter protects personal data in the output and does not test whether the answer follows the leave rules.
  - id: aif-ra27
    domain: responsible-ai
    question: Before choosing between two foundation models for a public-facing career advice assistant, a nonprofit wants each model scored on the same set of prompts for how often its responses contain toxic or demeaning content, especially in responses about people of different genders, ethnicities, or religions. The scoring must be automatic, with no human review team. Which approach fits?
    answer_type: single
    options:
      - id: a
        text: An Amazon Bedrock guardrail with content filters set to High, which blocks harmful content in production
      - id: b
        text: A model evaluation job in Amazon Bedrock that uses a judge model with the built-in Harmfulness and Stereotyping metrics
      - id: c
        text: A model evaluation job in Amazon Bedrock in which staff from the nonprofit rate each response
      - id: d
        text: The built-in robustness metric, which measures how much responses change when the prompt is slightly altered
      - id: e
        text: A post-training bias analysis that computes disparate impact on the models' predicted labels
      - id: f
        text: ROUGE scores that compare each response with a human-written reference answer
      - id: g
        text: A programmatic Amazon Bedrock model evaluation job that computes the built-in toxicity metric on datasets such as RealToxicityPrompts and BOLD
      - id: h
        text: Amazon SageMaker Model Monitor bias drift monitoring on the deployed endpoint
      - id: i
        text: The built-in Faithfulness metric, which checks whether a response adds information not found in the prompt
    accepted_correct_option_ids:
      - b
      - g
    author_notes:
      explanation: Amazon Bedrock evaluations can score candidate models on responsible AI qualities before one is chosen. A programmatic evaluation job computes a toxicity metric, and its built-in datasets include RealToxicityPrompts, which tries to provoke racist, sexist, or otherwise toxic language, and BOLD, which probes fairness across domains such as gender, race, and religious ideology. An evaluation job that uses a judge model offers built-in Harmfulness and Stereotyping metrics, with an explanation for each score. Running both candidates through the same prompts gives comparable scores, which is a different job from a guardrail that filters harmful content once the application is live.
      option_rationales:
        a: A guardrail is a run-time control that blocks content; it produces no score for comparing candidate models, and it would hide the very behavior the team wants to measure.
        b: A judge model scores every response with the built-in Harmfulness and Stereotyping metrics and explains each score, so the two candidates can be compared automatically on the same prompts.
        c: A human-based evaluation job relies on people rating responses, which the requirement for fully automatic scoring rules out.
        d: Robustness measures how stable responses are when the prompt is perturbed; it does not detect toxic or demeaning content.
        e: Disparate impact compares favorable predicted labels between groups for a classifier; free-text responses have no predicted labels, and the metric does not detect toxic language.
        f: ROUGE measures word overlap with a reference answer and says nothing about whether a response is toxic.
        g: The programmatic toxicity metric scores responses automatically, and its built-in datasets are designed to provoke toxic language and to probe fairness across gender, race, and religion.
        h: Bias drift monitoring watches a deployed model's predictions change over time; it cannot compare candidates before one is chosen, and it does not measure toxic language.
        i: Faithfulness checks whether a response stays within the information it was given, which is a grounding measure rather than a toxicity or stereotyping measure.
  - id: aif-sec1
    domain: ai-security-governance
    question: An application on Amazon EC2 has to call one specific Amazon Bedrock foundation model. Security asks for the narrowest set of permissions that still lets the call succeed. What should the team configure?
    answer_type: single
    options:
      - id: a
        text: An IAM role attached to the instance whose policy allows bedrock:InvokeModel on the ARN of that one model
      - id: b
        text: An IAM role attached to the instance with the AdministratorAccess managed policy, so no call is ever blocked
      - id: c
        text: An IAM user with long-lived access keys pasted into the application's configuration file
      - id: d
        text: An IAM role whose policy allows bedrock:* on all resources, so future models need no policy change
      - id: e
        text: A security group on the instance that allows all outbound traffic on every port
      - id: f
        text: A service quota increase for Amazon Bedrock in the Region
      - id: g
        text: A public read policy on the Amazon S3 bucket that holds the application code
      - id: h
        text: An AWS KMS key policy that allows kms:Decrypt to every principal in the account
      - id: i
        text: An instance profile whose role may call only bedrock:InvokeModel on that model's ARN
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Least privilege means granting the specific action on the specific resource. For Amazon Bedrock that is an identity-based policy allowing bedrock:InvokeModel on the ARN of the model the application actually uses, delivered to the EC2 instance through an instance profile so no long-lived credentials exist on disk. Wildcards, administrator access, and network or quota changes either grant far more than the task needs or do not grant permission at all.
      option_rationales:
        a: An instance role scoped to one action on one model ARN is the textbook least-privilege grant, and the role supplies short-lived credentials automatically.
        b: AdministratorAccess grants every action on every service, which is the opposite of the narrowest workable permission.
        c: Long-lived access keys in a configuration file are a credential-management risk, and an IAM user is unnecessary when an instance role is available.
        d: bedrock:* on all resources permits model customisation, deletion, and every other Bedrock action, far beyond invoking one model.
        e: A security group controls network reachability; it grants no API permission, so the call would still be denied.
        f: A quota increase raises how many requests are allowed, not whether the caller is authorised to make them.
        g: Making a code bucket public exposes data and has no bearing on whether the application may call the model.
        h: A permissive KMS key policy weakens encryption controls and does not authorise a Bedrock invocation.
        i: An instance profile hands the application a role scoped to one action on one model, which grants exactly what the call needs and no more.
  - id: aif-sec2
    domain: ai-security-governance
    question: An ML administrator wants least-privilege Amazon SageMaker AI permissions for job functions such as data scientist and MLOps engineer, containing only the actions each role actually uses rather than hand-written IAM policies. Which AWS capability does that?
    answer_type: single
    options:
      - id: a
        text: IAM Access Analyzer policy generation, which builds a policy from the actions a role used in CloudTrail
      - id: b
        text: Amazon SageMaker Model Monitor, which detects drift in the data a deployed endpoint receives
      - id: c
        text: Amazon SageMaker Clarify, which measures bias and explains feature contributions
      - id: d
        text: Amazon SageMaker Feature Store, which stores and serves curated features for training and inference
      - id: e
        text: Amazon SageMaker Pipelines, which orchestrates the steps of an ML workflow
      - id: f
        text: Amazon SageMaker Model Registry, which versions models and tracks their approval status
      - id: g
        text: AWS Organizations service control policies, which set the maximum permissions available to member accounts
      - id: h
        text: Amazon SageMaker Ground Truth, which manages human data-labeling jobs
      - id: i
        text: IAM Access Analyzer policy generation, whose generated policy can be reviewed and edited before it is attached
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Amazon SageMaker Role Manager, which built roles from personas and ML activities, closed to new customers on July 30, 2026. AWS now recommends creating SageMaker AI execution roles in IAM from AWS managed policies, running the workload for a representative period, and then using IAM Access Analyzer policy generation to replace the broad starting policy with one that contains only the actions the role actually used in CloudTrail. IAM Identity Center permission sets and CloudFormation or CDK templates keep workforce access and role definitions consistent.
      option_rationales:
        a: Policy generation reviews the role's CloudTrail activity over a chosen period and produces a policy containing only the actions it used, which AWS now recommends in place of SageMaker Role Manager's persona templates.
        b: Model Monitor watches live inference data for drift and quality problems; it grants no permissions.
        c: Clarify reports bias metrics and feature attributions, which is a fairness and explainability tool.
        d: Feature Store is a repository for engineered features, unrelated to access control.
        e: Pipelines automates the sequence of ML steps; it does not define who may run them.
        f: Model Registry catalogues model versions and approval states, not user permissions.
        g: Service control policies cap what an account may do but never grant a persona its permissions, and they operate at account level rather than per job function.
        h: Ground Truth coordinates human labeling workforces and has nothing to do with IAM personas.
        i: The generated policy is a template that the administrator reviews, adds any missing actions to, and then attaches to the SageMaker AI execution role as an ordinary IAM policy.
  - id: aif-sec3
    domain: ai-security-governance
    question: An insurer trains a model in Amazon SageMaker AI on claims data held in Amazon S3. The security team requires the data to be encrypted both while it is stored and while it moves during training. Which TWO measures each contribute to meeting that requirement?
    answer_type: multi
    options:
      - id: a
        text: Encrypt the training bucket with server-side encryption using an AWS KMS customer managed key
      - id: b
        text: Require TLS for every request to the bucket and the training job, so data in transit is encrypted
      - id: c
        text: Enable S3 Versioning so that earlier copies of each object are retained
      - id: d
        text: Compress the training data with gzip before uploading it
      - id: e
        text: Enable S3 Transfer Acceleration so uploads complete faster
      - id: f
        text: Run the training job on Spot Instances to lower its cost
      - id: g
        text: Publish the training job's metrics to Amazon CloudWatch
      - id: h
        text: Copy the data to the training instance's local disk before the job starts
      - id: i
        text: Encrypt the training job's attached storage volumes with an AWS KMS key
      - id: j
        text: Enable inter-container traffic encryption for distributed training
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "Encryption at rest and in transit are separate controls, and each applies at more than one point: at rest, SSE-KMS protects the objects in the bucket and a KMS key protects the training job's storage volumes; in transit, TLS protects the transfer from Amazon S3 and inter-container traffic encryption protects data exchanged between training instances. The other options change durability, speed, or cost and leave the data no better protected."
      option_rationales:
        a: SSE-KMS with a customer managed key encrypts the objects at rest in the bucket, and the key policy gives the customer an auditable say over who can decrypt.
        b: Requiring TLS encrypts the data as it moves between the bucket and the training job, and it can be enforced rather than merely recommended.
        c: Versioning protects against accidental overwrite and deletion; an unencrypted object simply gains unencrypted versions.
        d: Compression reduces size. It is not encryption, and the content remains readable to anyone who obtains the file.
        e: Transfer Acceleration routes uploads over the AWS edge network for speed; it changes nothing about encryption.
        f: Spot Instances reduce training cost and have no security effect.
        g: CloudWatch metrics tell you how the job performed; they do not protect the data.
        h: Copying data onto a local disk moves it without adding any protection, and may spread it further.
        i: Data the job copies onto its ML storage volumes stays encrypted at rest there when the volumes use a KMS key.
        j: Inter-container traffic encryption protects data exchanged between the training instances as it moves during a distributed job.
  - id: aif-sec4
    domain: ai-security-governance
    question: Before a dataset already sitting in Amazon S3 is used to fine-tune a model, the governance team wants an automated scan that reports which objects in the bucket contain personal data such as names, card numbers, and national identifiers. Which AWS service is purpose-built for that?
    answer_type: single
    options:
      - id: a
        text: Amazon Macie, which discovers and classifies sensitive data in Amazon S3
      - id: b
        text: Amazon GuardDuty, which analyses account and network telemetry for signs of malicious activity
      - id: c
        text: Amazon Inspector, which scans workloads for known software vulnerabilities
      - id: d
        text: AWS Config, which records resource configurations and evaluates them against rules
      - id: e
        text: AWS CloudTrail, which records the API calls made in the account
      - id: f
        text: AWS Artifact, which provides AWS compliance reports and agreements
      - id: g
        text: Amazon S3 Storage Lens, which reports storage usage and activity trends across buckets
      - id: h
        text: AWS Secrets Manager, which stores and rotates application credentials
      - id: i
        text: Amazon Macie, running a sensitive data discovery job with managed data identifiers
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Amazon Macie uses managed and custom data identifiers to scan objects in Amazon S3 and report where sensitive data, including personally identifiable information, is stored. Running Macie over a candidate training set before fine-tuning is the standard way to find personal data that should be removed, masked, or brought under a stricter access policy first.
      option_rationales:
        a: Sensitive data discovery in S3 is precisely what Macie is for, and its findings name the bucket and object.
        b: GuardDuty looks for threat activity such as compromised credentials; it does not classify the contents of objects.
        c: Inspector reports software vulnerabilities and unintended network exposure in workloads, not personal data in files.
        d: Config records how resources are configured, for example whether a bucket blocks public access, not what the objects contain.
        e: CloudTrail records who called which API; it says nothing about the data inside a bucket.
        f: Artifact is a download portal for AWS's own audit reports and agreements.
        g: Storage Lens summarises storage metrics such as object counts and request rates, not data sensitivity.
        h: Secrets Manager holds credentials for applications; it does not scan datasets.
        i: A Macie sensitive data discovery job inspects the bucket's objects with managed data identifiers for names, card numbers, and national IDs, and reports each finding by object.
  - id: aif-sec5
    domain: ai-security-governance
    question: A bank's application runs in a private subnet with no internet gateway and no NAT gateway, and it must call Amazon Bedrock without the traffic traversing the public internet. What should the team configure?
    answer_type: single
    options:
      - id: a
        text: An interface VPC endpoint for Amazon Bedrock, powered by AWS PrivateLink, so calls stay on the AWS network
      - id: b
        text: A NAT gateway in a public subnet so the private subnet can reach the public Bedrock endpoint
      - id: c
        text: An internet gateway attached to the VPC with a default route from the private subnet
      - id: d
        text: A gateway VPC endpoint, which is the endpoint type offered for Amazon S3 and Amazon DynamoDB
      - id: e
        text: An AWS Site-to-Site VPN connection between the VPC and the on-premises data centre
      - id: f
        text: An Amazon CloudFront distribution placed in front of the Bedrock endpoint
      - id: g
        text: A security group rule that allows outbound HTTPS to 0.0.0.0/0
      - id: h
        text: AWS Direct Connect from the VPC to the Bedrock service endpoint
      - id: i
        text: AWS PrivateLink, giving the subnet a private IP entry point to the Bedrock API
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: "AWS PrivateLink creates an interface VPC endpoint: an elastic network interface with a private IP address inside the subnet that represents the service. Calls to Amazon Bedrock then resolve to that private address and never leave the AWS network, which satisfies a policy that forbids internet transit and works in a subnet with no internet path at all."
      option_rationales:
        a: An interface endpoint backed by PrivateLink is the supported way to reach Bedrock privately from a VPC.
        b: A NAT gateway still sends the request out to the public service endpoint, which is what the policy forbids.
        c: An internet gateway exposes the subnet to the internet, moving in the opposite direction from the requirement.
        d: Gateway endpoints exist only for Amazon S3 and DynamoDB; Bedrock is reached through an interface endpoint.
        e: Site-to-Site VPN connects the VPC to an on-premises network and does nothing for reaching an AWS service privately.
        f: CloudFront is a content delivery network for distributing content to clients, not a private path to an API.
        g: An outbound rule to the whole internet would only matter if there were an internet path, and it provides no privacy.
        h: Direct Connect is a dedicated link between a data centre and AWS, not a connection between a VPC and a service.
        i: PrivateLink places an endpoint network interface with a private IP address in the subnet, so Bedrock calls stay on the AWS network.
  - id: aif-sec6
    domain: ai-security-governance
    question: A legal team asks whether the prompts and completions its staff send to a third-party foundation model on Amazon Bedrock could end up in that model's future training data. Which statement is correct?
    answer_type: single
    options:
      - id: a
        text: Amazon Bedrock does not use customer prompts or model responses to train the base foundation models, and it does not share them with the model providers
      - id: b
        text: Prompts are added to the provider's next training run unless the customer opts out in the Bedrock console
      - id: c
        text: Prompts are used for training whenever the model is invoked under on-demand, pay-per-token pricing
      - id: d
        text: Fine-tuning data supplied by the customer is merged into the shared base model and becomes available to other customers
      - id: e
        text: Prompt content is used for training but is anonymised first, so no agreement with the provider is needed
      - id: f
        text: Amazon Bedrock stores every prompt in an AWS-owned public bucket so that usage can be audited
      - id: g
        text: Prompts are used for training only when the response exceeds the model's default output length
      - id: h
        text: Model providers have no access to the accounts where Bedrock runs their models, so they never receive customer prompts
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Amazon Bedrock does not use a customer's inputs or outputs to train the underlying foundation models, and that data is not shared with the third-party model providers. When a customer fine-tunes a model, Bedrock creates a private copy of the base model in the customer's account; the tuned weights are the customer's and are not folded back into the shared base model.
      option_rationales:
        a: "This is the stated Bedrock privacy position: customer inputs and outputs do not train the base models and are not passed to providers."
        b: There is no opt-out to configure, because prompts are not used for base model training in the first place.
        c: Pricing model has no bearing on data use; on-demand invocations are treated the same way.
        d: Fine-tuning produces a private copy of the model that only the customer can use; it does not change the shared base model.
        e: Anonymisation is irrelevant here, since the prompts are not used for training at all.
        f: Nothing is published to a public bucket. Customers who want a record enable model invocation logging to their own destination.
        g: Response length has no connection to how data is used.
        h: Bedrock hosts each provider's models in AWS-operated model deployment accounts that the provider cannot access, so prompts and completions never reach the provider.
  - id: aif-sec7
    domain: ai-security-governance
    question: A company builds a customer-facing application on Amazon Bedrock. Under the AWS shared responsibility model, which TWO tasks are the customer's responsibility rather than AWS's?
    answer_type: multi
    options:
      - id: a
        text: Deciding which data may be placed in a prompt, and classifying that data before it is sent
      - id: b
        text: Writing the IAM policies that decide which principals may invoke the model
      - id: c
        text: Patching the operating systems of the hosts that run the managed inference fleet
      - id: d
        text: Providing physical security for the data centres where the service runs
      - id: e
        text: Replacing failed hardware in the racks that serve the model
      - id: f
        text: Undergoing the SOC 2 audit of the underlying AWS infrastructure
      - id: g
        text: Operating the network backbone that connects AWS Regions and Availability Zones
      - id: h
        text: Maintaining the power and cooling systems of each Availability Zone
      - id: i
        text: Configuring guardrails that filter what the model returns to the application's users
      - id: j
        text: Setting encryption and retention for the logs and data the application stores
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "AWS is responsible for security of the cloud, which for a managed service such as Amazon Bedrock includes the facilities, hardware, network, and the software that runs the service. The customer is responsible for security in the cloud: what data they send and how it is classified, encrypted, and retained, who is allowed to call the service, and which guardrails filter its output."
      option_rationales:
        a: Choosing and classifying the data that goes into a prompt is entirely a customer decision; AWS cannot make it.
        b: Access control through IAM is the customer's configuration of the service, which is squarely security in the cloud.
        c: Patching the hosts behind a managed service is AWS's responsibility; customers never see those instances.
        d: Physical data centre security is the classic AWS-side responsibility.
        e: Hardware replacement in AWS facilities is performed by AWS.
        f: AWS undergoes the audits of its infrastructure; the customer's role is to obtain the resulting report, through AWS Artifact.
        g: The global network infrastructure is operated by AWS.
        h: Facility power and cooling belong to AWS's security of the cloud.
        i: Choosing and configuring content controls such as guardrails is part of the customer's security in the cloud for the application they build.
        j: Encryption keys, log retention, and storage settings for the customer's own data are configured by the customer, not by AWS.
  - id: aif-sec8
    domain: ai-security-governance
    question: An ML team has dozens of datasets spread across Amazon S3 and cannot tell which tables and columns exist or what format each one uses. They want a central technical metadata store that crawlers can populate automatically and that ETL and query engines can read. Which service provides it?
    answer_type: single
    options:
      - id: a
        text: The AWS Glue Data Catalog, a central metadata repository of databases, tables, and schemas that crawlers can populate
      - id: b
        text: Amazon S3 Inventory, which produces a scheduled report listing the objects in a bucket
      - id: c
        text: Amazon SageMaker Feature Store, which stores curated features for training and inference
      - id: d
        text: AWS CloudTrail, which records the API activity in the account
      - id: e
        text: Amazon CloudWatch Logs, which stores and searches application log events
      - id: f
        text: AWS Config, which records the configuration history of AWS resources
      - id: g
        text: AWS Secrets Manager, which stores and rotates credentials
      - id: h
        text: Amazon S3 Storage Lens, which reports storage usage and activity trends
      - id: i
        text: The AWS Glue Data Catalog, which acts as a Hive-compatible metastore for Athena and EMR
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: "The AWS Glue Data Catalog holds the technical metadata for a data estate: databases, tables, columns, data types, partitions, and the location of the underlying files. Crawlers infer that schema from the data and keep the catalogue current, and services such as AWS Glue ETL, Amazon Athena, and Amazon EMR read it. A populated catalogue is the starting point for data governance, because you cannot control or trace data you cannot enumerate."
      option_rationales:
        a: A crawler-populated catalogue of databases, tables, and schemas shared across analytics services is exactly the Glue Data Catalog.
        b: S3 Inventory lists objects and a few object-level attributes; it does not describe table schemas or column types.
        c: Feature Store holds engineered feature values for models, which is a narrower purpose than cataloguing the whole data estate.
        d: CloudTrail records who called which API, not the structure of the data.
        e: CloudWatch Logs stores log events from applications and services, not dataset schemas.
        f: Config tracks the configuration of AWS resources such as buckets, not the schema of the data inside them.
        g: Secrets Manager stores credentials and has no role in describing datasets.
        h: Storage Lens reports storage metrics and trends rather than schema metadata.
        i: The Glue Data Catalog is the shared, Apache Hive-compatible metastore from which query and ETL engines read table definitions that crawlers keep current.
  - id: aif-sec9
    domain: ai-security-governance
    question: An auditor asks the ML team to show, for a model now serving production traffic, exactly which dataset version, processing job, and training job produced it. Which practice answers that question directly?
    answer_type: single
    options:
      - id: a
        text: Lineage tracking, which records the datasets, processing steps, and jobs that produced each model artefact, as Amazon SageMaker ML Lineage Tracking does automatically
      - id: b
        text: Amazon SageMaker Model Monitor schedules, which compare live traffic against a baseline to detect drift
      - id: c
        text: Amazon S3 Versioning on the data bucket alone, which keeps object versions but records nothing about the jobs that used them
      - id: d
        text: Automatic model tuning, which searches hyperparameter combinations for the best objective metric
      - id: e
        text: Provisioned Throughput, which reserves inference capacity for a model
      - id: f
        text: An Amazon CloudFront distribution that caches the model's responses at the edge
      - id: g
        text: Increasing the training instance size so that jobs finish sooner
      - id: h
        text: Amazon Bedrock Guardrails, which filter harmful content in prompts and responses
      - id: i
        text: Provenance records linking the deployed model back to its source data and the jobs that built it
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Lineage is the recorded chain from source data through processing and training to a specific model artefact and endpoint. SageMaker creates lineage entities for trial components, datasets, and models as jobs run, so a question such as "which data produced this model?" is answered from records rather than from memory. The same discipline underpins source citation in retrieval systems and the documentation of data origins that auditors expect.
      option_rationales:
        a: Recording the datasets and jobs behind each artefact is the definition of lineage tracking, and it is what an auditor's question needs.
        b: Model Monitor reports on the data a deployed endpoint sees now; it cannot say what produced the model.
        c: Versioning preserves object copies but stores no link between an object version and the job that consumed it.
        d: Automatic model tuning selects hyperparameters; it is an optimisation technique, not a provenance record.
        e: Provisioned Throughput is a capacity purchase for inference and holds no metadata about training.
        f: CloudFront caching affects delivery latency, not traceability of a model's inputs.
        g: A larger instance shortens training time and records nothing about provenance.
        h: Guardrails screen content at inference time and say nothing about which data trained the model.
        i: Model provenance, recorded as lineage, traces an artifact back through its training and processing jobs to the exact data used, which is what the auditor asked for.
  - id: aif-sec10
    domain: ai-security-governance
    question: Overnight, an IAM role used by a training pipeline begins making API calls from an unfamiliar location and in a pattern the account has never seen before. Which AWS service is designed to detect that kind of activity continuously, from sources such as CloudTrail events, DNS logs, and VPC flow logs?
    answer_type: single
    options:
      - id: a
        text: Amazon GuardDuty, a managed threat detection service that analyses account and network telemetry
      - id: b
        text: Amazon Inspector, which scans EC2 instances, container images, and Lambda functions for known vulnerabilities
      - id: c
        text: Amazon Macie, which discovers and classifies sensitive data in Amazon S3
      - id: d
        text: AWS Artifact, which distributes AWS audit reports and agreements
      - id: e
        text: AWS Trusted Advisor, which checks an account against best practices in six categories
      - id: f
        text: AWS Config, which records resource configuration changes and evaluates rules
      - id: g
        text: AWS Audit Manager, which collects evidence and maps it to compliance frameworks
      - id: h
        text: AWS KMS, which creates and controls encryption keys
      - id: i
        text: Amazon GuardDuty, which uses machine learning and threat intelligence to generate findings
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: GuardDuty continuously consumes CloudTrail management and data events, VPC flow logs, and DNS query logs, and applies threat intelligence and anomaly detection to them. Credential use from an unusual location, or an unusual API pattern for a role, produces a finding without the customer writing any detection logic. It is the detective control in an ML account, alongside preventive controls such as IAM and encryption.
      option_rationales:
        a: Continuous threat detection from account and network telemetry, including anomalous credential use, is GuardDuty's purpose.
        b: Inspector finds software vulnerabilities and network exposure; it does not analyse API behaviour for threats.
        c: Macie classifies sensitive data at rest and does not evaluate credential activity.
        d: Artifact is a document portal, with no detection capability at all.
        e: Trusted Advisor performs best-practice checks on configuration and usage rather than detecting live threats.
        f: Config records configuration state and rule compliance; it does not flag anomalous API behaviour as a threat.
        g: Audit Manager gathers evidence for audits, which is a compliance workflow, not real-time detection.
        h: KMS manages keys and enforces key policies; it does not detect suspicious account activity.
        i: GuardDuty applies anomaly detection and threat intelligence to CloudTrail, DNS, and flow log data, which is how it flags credential misuse like this.
  - id: aif-sec11
    domain: ai-security-governance
    question: A team packages its training and inference code as container images in Amazon ECR. Security asks for continuous scanning of those images for known software vulnerabilities (CVEs) in the operating system and language packages. Which service does that?
    answer_type: single
    options:
      - id: a
        text: Amazon Inspector, which continuously scans container images, EC2 instances, and Lambda functions for known vulnerabilities
      - id: b
        text: Amazon GuardDuty, which analyses account telemetry for malicious or unauthorised behaviour
      - id: c
        text: Amazon Macie, which discovers and classifies sensitive data in Amazon S3
      - id: d
        text: AWS Shield, which protects applications against distributed denial of service attacks
      - id: e
        text: AWS WAF, which filters HTTP requests against configurable rules
      - id: f
        text: AWS Config, which records configuration changes of AWS resources
      - id: g
        text: AWS CloudTrail, which records the API calls made in the account
      - id: h
        text: AWS Secrets Manager, which stores and rotates credentials
      - id: i
        text: Amazon ECR enhanced scanning, which rescans images as new CVEs are published
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Amazon Inspector performs automated, continuous vulnerability management. When enhanced scanning is enabled for Amazon ECR, Inspector scans images on push and rescans them as new CVEs are published, so an ML image built months ago is re-evaluated without anyone rebuilding it. Findings carry a severity score and the fixed package version, which is what a remediation backlog needs.
      option_rationales:
        a: Continuous CVE scanning of container images is one of Inspector's core scan types.
        b: GuardDuty detects threat activity from telemetry; it does not inventory software packages for CVEs.
        c: Macie classifies data at rest and does not examine container images.
        d: Shield mitigates DDoS attacks against endpoints, not vulnerabilities inside an image.
        e: AWS WAF inspects web requests at the application layer, which has nothing to do with image contents.
        f: Config tracks whether resources match a desired configuration, not which CVEs a package carries.
        g: CloudTrail is an audit log of API activity, not a vulnerability scanner.
        h: Secrets Manager stores credentials; it performs no scanning.
        i: ECR enhanced scanning is powered by Amazon Inspector and continuously rescans repository images for operating system and language package vulnerabilities.
  - id: aif-sec12
    domain: ai-security-governance
    question: A company runs ML workloads in several AWS accounts. Findings arrive separately from GuardDuty, Inspector, and Macie, and the CISO wants one place that aggregates them across accounts and also scores the environment against standards such as the AWS Foundational Security Best Practices and CIS benchmarks. Which service provides that view?
    answer_type: single
    options:
      - id: a
        text: AWS Security Hub with Security Hub CSPM enabled for the standards checks
      - id: b
        text: Amazon GuardDuty, which produces its own threat findings but does not aggregate other services' findings or run standards checks
      - id: c
        text: AWS Audit Manager, which collects evidence for audits against compliance frameworks
      - id: d
        text: AWS Artifact, which provides AWS's own audit reports for download
      - id: e
        text: Amazon CloudWatch dashboards, which chart metrics published by AWS services
      - id: f
        text: AWS Organizations, which centrally manages accounts and applies service control policies
      - id: g
        text: AWS Control Tower, which sets up and governs a multi-account landing zone
      - id: h
        text: AWS Trusted Advisor, which checks an account against best practices in six categories
      - id: i
        text: AWS Security Hub CSPM, which consolidates findings and scores accounts against standards
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Security Hub CSPM ingests findings from GuardDuty, Inspector, Macie, and partner products in a common format across accounts and Regions, and continuously scores the environment against standards such as AWS Foundational Security Best Practices and CIS. The newer AWS Security Hub builds on it, correlating Security Hub CSPM findings with those from other security services to highlight the most critical exposures, so AWS recommends enabling both. The individual detectors remain the source of the findings.
      option_rationales:
        a: Security Hub collects findings from GuardDuty, Inspector, and Macie across accounts, and Security Hub CSPM, whose findings flow into it, scores the accounts against standards such as FSBP and CIS.
        b: GuardDuty is one of the sources Security Hub aggregates, and it runs no standards checks of its own.
        c: Audit Manager builds evidence packages for an auditor against a framework; it is not a live security findings console.
        d: Artifact distributes AWS's compliance documents and has no view of the customer's findings.
        e: CloudWatch dashboards visualise metrics, not normalised security findings from multiple services.
        f: Organizations manages account structure and permission guardrails; it does not collect security findings.
        g: Control Tower provisions and governs accounts with controls, but the aggregated findings view still comes from Security Hub.
        h: Trusted Advisor performs best-practice checks across six categories and does not ingest findings from GuardDuty, Inspector, or Macie.
        i: Security Hub CSPM ingests findings from GuardDuty, Inspector, and Macie across accounts and runs standards such as AWS Foundational Security Best Practices and the CIS benchmark.
  - id: aif-sec13
    domain: ai-security-governance
    question: An agent built on Amazon Bedrock can call an internal API that issues customer refunds. A guardrail already screens prompts and responses. Which additional control best limits the damage if a prompt injection still succeeds?
    answer_type: single
    options:
      - id: a
        text: Scope the agent's execution role to that single refund operation and require an explicit human confirmation before the action is carried out
      - id: b
        text: Raise the model's temperature so that an injected instruction is followed less predictably
      - id: c
        text: Increase the maximum response length so that answers are never truncated
      - id: d
        text: Encrypt the stored conversation history with an AWS KMS customer managed key
      - id: e
        text: Move the system prompt from the application code into an Amazon S3 object
      - id: f
        text: Switch to a smaller, cheaper model so that less context is processed
      - id: g
        text: Buy Provisioned Throughput for the model so that refund requests are never throttled
      - id: h
        text: Put an Amazon CloudFront distribution in front of the application
      - id: i
        text: Validate each refund in the API itself against business limits, such as amount caps
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: "Prompt injection cannot be eliminated by filtering alone, so an agent's security is layered: screen the input, then assume screening may fail and make the consequence survivable with a narrowly scoped execution role, business-rule checks enforced by the refund API itself, and human confirmation before irreversible actions. The other options change cost, sampling, or delivery and leave the blast radius untouched."
      option_rationales:
        a: Least privilege on the agent's role plus human approval of the consequential action bounds the damage of any successful injection.
        b: A higher temperature only makes output more random; the injected instruction can still be obeyed, and unpredictability is not a control.
        c: Output length has no bearing on whether an instruction hidden in the input is followed.
        d: Encrypting stored history protects the log if it is stolen, but it does nothing about an action the agent takes now.
        e: Where the system prompt is stored does not stop a model from being argued out of following it.
        f: A smaller model is not inherently more resistant to injection, and may well be less resistant.
        g: Provisioned Throughput reserves capacity. It is a performance purchase with no security effect.
        h: CloudFront caches and delivers content; it does not sit between the agent and the refund API.
        i: Checks enforced by the refund service, whatever the agent asks for, cap what a hijacked agent can do.
  - id: aif-sec14
    domain: ai-security-governance
    question: A prospective customer's security questionnaire asks for AWS's latest SOC 2 Type II report and its ISO 27001 certificate, covering the infrastructure the company's AI workload runs on. Where does an AWS account holder obtain those documents?
    answer_type: single
    options:
