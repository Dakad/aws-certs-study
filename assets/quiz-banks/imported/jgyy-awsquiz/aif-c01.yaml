  - id: aif-gen9
    domain: genai-fundamentals
    question: A data science manager is explaining to stakeholders how a foundation model differs from the task-specific models the team has built before. Which statement is accurate?
    answer_type: single
    options:
      - id: a
        text: A foundation model is pretrained on a very large, mostly unlabeled corpus and can then be adapted to many different downstream tasks, whereas a task-specific model is trained on labeled data for one task
      - id: b
        text: A foundation model is always smaller and cheaper to run than a task-specific model
      - id: c
        text: A foundation model needs no evaluation, because it was already validated by its provider
      - id: d
        text: A foundation model has to be retrained from scratch for every new prompt
      - id: e
        text: Task-specific models cannot be deployed behind an API endpoint
      - id: f
        text: Foundation models work only on images, while task-specific models work only on text
      - id: g
        text: A foundation model requires a labeled example for every output it could ever produce
      - id: h
        text: A foundation model adapts to new tasks through prompting or fine-tuning, while a task-specific model is limited to its trained task
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Foundation models are pretrained once at great expense on broad unlabeled data and are general enough to serve many tasks through prompting or customization, while a task-specific model is trained on labeled examples of one narrow task.
      option_rationales:
        a: Broad unlabeled pre-training plus adaptability to many tasks is what makes a model a foundation model.
        b: Foundation models are usually far larger and more expensive per prediction than a narrow model.
        c: You still have to evaluate a foundation model on your own data and task before trusting it.
        d: Prompting uses the already-trained model; no retraining happens per request.
        e: Task-specific models are routinely hosted behind real-time endpoints.
        f: Both kinds of model span text, images, audio, and tabular data.
        g: Needing a label for every possible output describes supervised learning, not foundation models.
        h: Adaptability to many downstream tasks without training a new model from scratch is the defining trait of a foundation model.
  - id: aif-gen10
    domain: genai-fundamentals
    question: A bank is deciding which backlog items to build on a text foundation model. Which TWO tasks are the strongest fit for a generative text model?
    answer_type: multi
    options:
      - id: a
        text: Producing a short plain-language summary of a long customer complaint thread
      - id: b
        text: Drafting a reply to a customer question in natural language for an agent to review and send
      - id: c
        text: Calculating the exact interest owed on each loan account at month end
      - id: d
        text: Storing 20 TB of transaction records for a seven-year regulatory retention period
      - id: e
        text: Applying the fixed rule that any transfer above 10,000 dollars needs a second approver
      - id: f
        text: Distributing web traffic evenly across two Availability Zones
      - id: g
        text: Producing a general ledger total that must reconcile to the cent every night
      - id: h
        text: Translating customer messages into the language the support agent reads
      - id: i
        text: Answering staff questions about internal policy documents through a chat assistant
      - id: j
        text: Assigning unique sequential account numbers to newly opened accounts
    accepted_correct_option_ids:
      - a
      - b
      - h
      - i
    author_notes:
      explanation: Generative text models are strong at summarization, drafting, translation, classification of free text, and conversational assistance; exact arithmetic, durable storage, fixed rules, and traffic distribution belong to conventional software that is deterministic and auditable.
      option_rationales:
        a: Summarizing long free text into a short readable form is a core generative language task.
        b: Drafting a natural language reply for human review is a standard assisted-response use case.
        c: Interest is a deterministic calculation that must be exact, so ordinary code is the right tool.
        d: Long-term retention is a storage requirement met by services such as Amazon S3.
        e: A fixed, regulated threshold should be enforced by explicit business logic, not a sampled model.
        f: Traffic distribution is handled by a load balancer, not by any model.
        g: A ledger total must reconcile exactly, which rules out a probabilistic generator.
        h: Translation between natural languages is a strong generative text task that needs fluent output rather than exact computation.
        i: Conversational question answering over policy text plays to a generative model's language strengths, especially when grounded in the source documents.
        j: Account numbers must never collide or skip, which calls for a database sequence rather than a probabilistic generator.
  - id: aif-gen11
