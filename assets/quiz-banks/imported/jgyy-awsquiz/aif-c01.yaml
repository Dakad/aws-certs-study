      - h
    author_notes:
      explanation: "Transparency is about giving the people who interact with or are affected by an AI system enough information to decide how to engage with it: disclosing that the counterpart is an AI, and publishing intended uses and known limitations. Explainability is the neighbouring but distinct dimension of accounting for why the system produced a particular output."
      option_rationales:
        a: Disclosure of AI use plus published intended uses and limitations is the textbook transparency measure.
        b: Explainability would mean showing why a specific answer was produced, which these measures do not attempt.
        c: Veracity and robustness concerns correctness under difficult inputs, not what users are told up front.
        d: Controllability concerns the operator's ability to monitor and steer the system, not user disclosure.
        e: Privacy and security concerns how data and models are handled, which the requirement does not address.
        f: Fairness concerns differing impacts across groups, which is not what legal asked for here.
        g: Safety concerns preventing harmful output and misuse rather than informing users about scope.
        h: Giving people the information they need to decide how far to trust and use an AI system is the purpose of the transparency dimension.
  - id: aif-ra4
    domain: responsible-ai
