        d: No service guarantees correct output; evaluation and review remain the startup's job.
        e: On-demand pricing is usage based, so the bill rises and falls with how much the assistant is used.
        f: Compliance of the product remains the startup's responsibility under the shared responsibility model.
        g: Using a model through the service grants no ownership of the provider's weights.
        h: Paying per use with no upfront commitment keeps costs small while the product is unproven and lets them grow with demand.
        i: A choice of models from several providers lets the startup trade quality against price to fit its goals instead of settling for one model.
