    question: A news publisher wants a two-sentence summary and five topic tags for each of 3 million archived articles, generated by a foundation model on Amazon Bedrock. Nobody is waiting on the results, which are due within a week. The team wants a lower model price than on-demand invocation and does not want to write code that sends millions of separate requests. Which approach fits best?
