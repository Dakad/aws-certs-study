    options:
      - id: a
        text: Amazon Polly, which converts written text into lifelike speech in many voices
      - id: b
        text: Amazon Transcribe, which converts recorded or streamed speech into text
      - id: c
        text: Amazon Nova 2 Sonic, a speech-to-speech foundation model on Amazon Bedrock
      - id: d
        text: A text-to-image diffusion model that turns each spoken request into a picture
      - id: e
        text: An embedding model such as Amazon Titan Text Embeddings V2, which returns vectors
      - id: f
        text: Amazon Translate, which converts text from one language into another
      - id: g
        text: A speech-to-speech foundation model that understands spoken input and replies with generated speech over a bidirectional stream
      - id: h
