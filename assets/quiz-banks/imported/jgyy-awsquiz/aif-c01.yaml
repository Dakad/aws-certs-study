  - id: aif-gen25
    domain: genai-fundamentals
    question: An interactive feature sorts short support messages into one of eight categories, must answer within about a second, and will handle 30 million messages a month. The team prototyped with the largest and most capable model on Amazon Bedrock and is now worried about cost and latency. What is the best first step?
    answer_type: single
    options:
      - id: a
        text: Test a smaller, lower-cost model on the same task and keep it if its accuracy is good enough, because smaller models generally cost less per token and respond faster
      - id: b
        text: Keep the largest model, because a larger model is always more accurate on every task
      - id: c
        text: Move the traffic to batch inference, even though each message needs an immediate answer
      - id: d
        text: Increase the maximum response length so that fewer calls are needed
      - id: e
        text: Raise the temperature so that the responses come back shorter
      - id: f
        text: Send all 30 million messages in one prompt to a model with a very large context window
      - id: g
        text: Self-host the largest model on GPU instances, which is always cheaper than a managed API
      - id: h
        text: Run an Amazon Bedrock model evaluation job comparing smaller models with the prototype on labeled sample messages
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Model choice is a trade-off between quality, latency, and price per token, and a short, well-defined classification task rarely needs the most capable model; the standard practice is to try a smaller and cheaper model against a representative test set and move up only if quality falls short.
      option_rationales:
        a: Right-sizing the model to the task is the normal way to cut both cost and latency without harming outcomes.
        b: Larger models cost more and respond more slowly, and simple tasks often do not benefit from them.
        c: Batch inference lowers price by relaxing latency, which this interactive requirement forbids.
        d: A longer allowed response can increase output tokens and cost, and does not reduce the number of messages.
        e: Temperature affects randomness, not response length or price.
        f: One giant prompt would exceed any context window and would not return per-message answers.
        g: Self-hosting adds GPU capacity, operations, and idle time costs, and is not automatically cheaper.
        h: Evaluating cheaper, faster models against the prototype on representative labeled data shows whether a smaller model is accurate enough before switching.
  - id: aif-gen26
    domain: genai-fundamentals
    question: A legal publisher is preparing 30,000 long court judgments for semantic search and Retrieval Augmented Generation. Each judgment is split into chunks, and each chunk is embedded separately. The team is now debating how large the chunks should be. Which statement about chunk size is accurate?
    answer_type: single
    options:
      - id: a
        text: Chunk size changes only how much the vector store costs; retrieval quality and answer quality are the same at any size
      - id: b
        text: Oversized chunks blend several topics into one vector and waste prompt space, while tiny chunks lose the context a passage needs
      - id: c
        text: Each whole judgment should be a single chunk, because the larger a chunk is, the more precisely its single vector matches any question a user asks
      - id: d
        text: Each sentence should be its own chunk, because the smallest possible chunks always give the most relevant and the most complete answers
      - id: e
        text: Chunk size controls the temperature the model uses when it writes the final answer, so it should match the desired creativity
      - id: f
        text: Chunking is only a compression step that shrinks the files so the vector store bills less per gigabyte stored
      - id: g
        text: Smaller chunks match a question precisely but carry less context; larger chunks keep context but match less precisely
      - id: h
        text: Once documents are chunked, the chunks can be matched to questions directly, so embeddings are no longer needed
      - id: i
        text: Overlap between neighboring chunks should always be avoided, because text repeated across boundaries never helps retrieval
    accepted_correct_option_ids:
      - b
      - g
    author_notes:
      explanation: "Long documents are split into chunks so that each focused passage gets its own embedding, fits the embedding model's input limit, and can be retrieved on its own. Chunk size is a trade-off: small chunks give precise embeddings but can lose the context needed to understand them, while large chunks keep context but merge several ideas into one vector, which weakens the match, and they use more of the prompt when retrieved. Overlap between chunks and strategies such as hierarchical chunking exist to balance the two."
      option_rationales:
        a: Chunk size shapes what each vector represents and how much text reaches the model, so it affects retrieval and answer quality, not just storage.
        b: An oversized chunk averages several ideas into one vector and fills the prompt with text the question does not need, and a tiny chunk can be stripped of the context that gives it meaning.
        c: A whole long judgment in one vector blends many topics, so its embedding matches any single question weakly, and retrieving it sends far more text than needed.
        d: Sentence-sized chunks often lose the surrounding facts needed to interpret them, so they can match precisely yet leave the model without enough context.
        e: Temperature is an inference parameter set on the generation request; chunk size has no effect on it.
        f: Chunking exists so retrieval can work on focused passages that fit the embedding model's input limit, not to compress files for storage billing.
        g: This is the core trade-off between a precise match and complete context, with larger chunks also consuming more of the prompt's token budget.
        h: Chunks still have to be embedded, because the embeddings are what semantic retrieval compares with the embedded question.
        i: A modest overlap is a common way to keep ideas that straddle a chunk boundary intact, so it often helps.
  - id: aif-gen27
    domain: genai-fundamentals
    question: A developer adds top-k = 50 to the inference parameters of requests sent to a text model on Amazon Bedrock. What effect does this setting have?
    answer_type: single
    options:
      - id: a
        text: The response is limited to at most 50 output tokens
      - id: b
        text: The model keeps the smallest set of next tokens whose probabilities add up to 50 percent
      - id: c
        text: At each step, the next token is sampled only from the 50 most probable candidates
      - id: d
        text: The model returns 50 alternative responses and the application picks one of them
      - id: e
        text: The probability distribution is flattened so that unlikely tokens are picked more often
      - id: f
        text: Generation stops as soon as the model has written 50 sentences
      - id: g
        text: The 50 most relevant document chunks are retrieved and added to the prompt
      - id: h
        text: Before each token is chosen, every candidate outside the 50 highest-probability options is discarded
      - id: i
        text: The request is billed for no more than 50 input tokens, whatever the prompt length
    accepted_correct_option_ids:
      - c
      - h
    author_notes:
      explanation: "Top-k limits the candidates for each next token to a fixed number of the most likely ones before sampling: a lower value keeps output to more predictable tokens, and a higher value lets less likely tokens through. Top-p instead keeps a variable number of candidates whose cumulative probability reaches a threshold, temperature reshapes the whole distribution, and the maximum-token setting limits length."
      option_rationales:
        a: Output length is capped by the maximum-tokens setting; top-k limits which tokens are considered at each step, not how many are produced.
        b: Keeping candidates up to a cumulative probability is top-p, also called nucleus sampling, not top-k.
        c: Top-k restricts sampling to a fixed count of the most likely next tokens, here the top 50.
        d: Top-k shapes a single response token by token; it does not generate several candidate responses.
        e: Flattening the distribution is what a higher temperature does; top-k truncates the candidate list instead of reshaping it.
        f: Top-k has nothing to do with sentences; length and stopping are governed by maximum tokens and stop sequences.
        g: The number of passages returned is a retrieval setting of a knowledge base, not the top-k sampling parameter of a text model.
        h: Discarding all but the k most probable candidates before sampling is exactly how top-k narrows the choice.
        i: Input tokens are billed in full whatever the sampling settings; top-k does not change how the prompt is metered.
  - id: aif-gen28
    domain: genai-fundamentals
    question: A team uses a text model to generate sample dialogues between customers and support agents. Each prompt ends with "Agent:", but after writing the agent's reply the model keeps going and invents the customer's next line, which starts with "Customer:". Which inference setting makes generation end right after the agent's reply?
    answer_type: single
    options:
      - id: a
        text: Lower the temperature so the model writes less creatively
      - id: b
        text: Raise top-p so that more candidate tokens are considered
      - id: c
        text: Set top-k to 1 so the model always picks the most likely token
      - id: d
        text: Set "Customer:" as a stop sequence
      - id: e
        text: Raise the maximum output tokens so the reply is never cut short
      - id: f
        text: Choose a model with a larger context window
      - id: g
        text: Cap the maximum output tokens at a fixed number such as 60
      - id: h
        text: Turn on response streaming so the reply arrives sooner
      - id: i
        text: Supply a string that ends generation as soon as the model writes it, here the label that opens the customer's turn
    accepted_correct_option_ids:
      - d
      - i
    author_notes:
      explanation: Stop sequences are strings that end generation when the model produces them. Using the label that opens the next speaker's turn, or an end marker the prompt asks the model to write, cuts the output at the right point however long the reply is. Temperature, top-p, and top-k change word choice, and the maximum-token setting only caps length.
      option_rationales:
        a: Temperature changes how predictable the wording is; the model can still continue into an invented customer line.
        b: A higher top-p widens the candidate pool and does nothing to end generation at the turn boundary.
        c: Always picking the most likely token makes the wording repeatable but does not stop the model from writing the next speaker's line.
        d: Generation ends as soon as the model produces the stop sequence, so the output stops before the invented customer line.
        e: More output tokens give the model more room to keep writing, which makes the problem worse.
        f: A larger context window allows longer input and does not tell the model where to stop.
        g: Replies vary in length, so a fixed cap either cuts some replies mid-sentence or still leaves room for the invented line.
        h: Streaming changes how quickly text is delivered, not where generation ends.
        i: 'That is a stop sequence: a string such as "Customer:" whose appearance ends generation exactly at the turn boundary.'
