      - h
    author_notes:
      explanation: When a dataset does not reflect the population the system will serve, the model learns the under-represented part of the input space poorly and its error rate there is higher. The remedy is to validate representativeness before training and to collect or augment data for the thin slices, then re-measure per-group performance rather than relying on a single overall accuracy figure.
      option_rationales:
        a: A training distribution that does not match the user population is the definition of sampling bias, and it explains the per-group error gap.
        b: Overfitting to the validation set would degrade performance broadly rather than for one specific group.
        c: Feature count is unrelated to which group the model serves poorly.
        d: A miscomputed matrix would be a measurement error; the stem states the training data composition is the difference.
        e: Instance sizing changes latency and cost, never accuracy for a subgroup.
        f: Context window applies to language model input length, not to image classification accuracy.
        g: Temperature is a generative sampling parameter and does not apply to a classifier's per-group error rate.
        h: Representation bias is the term for a training set in which part of the served population has too few examples, which produces the per-group error gap described.
  - id: aif-ra8
    domain: responsible-ai
    question: A content moderation dataset was sampled so that every user community is represented in proportion to its share of the platform. Even so, the trained model flags posts written in one regional dialect as abusive far more often than equivalent posts in standard usage. Reviewers find the annotation guidelines never defined how to treat dialect, and annotators applied their own judgement. What is the source of this bias?
    answer_type: single
    options:
      - id: a
        text: Labeling bias introduced by the annotation process, because vague guidelines let annotators apply inconsistent, subjective judgements to the labels
      - id: b
        text: Sampling bias, because the dataset does not reflect the user population
      - id: c
        text: Overfitting, because the model memorised the training set
      - id: d
        text: Data drift, because the input distribution has moved since training
      - id: e
        text: An inference temperature that is set too high
      - id: f
        text: An undersized endpoint instance type
      - id: g
        text: A learning rate that was set too high during training
      - id: h
        text: Annotator bias, where labelers' subjective views became the ground truth
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "Bias can enter at collection, at labeling, or through the choice of target variable. Here the collection step is stated to be proportionate, so the skew came from the labels: without clear, tested instructions, annotators fall back on personal judgement, and the model faithfully learns their inconsistency. Written guidelines, annotator training, gold-standard test items, and measuring agreement between annotators are the standard mitigations, as the AWS Well-Architected Responsible AI Lens recommends."
      option_rationales:
        a: Subjective labels produced under vague guidelines are the definition of labeling bias, and the stem rules out the alternatives.
        b: The stem explicitly says the sample matches the population in proportion, so sampling is not the cause.
        c: Overfitting is about failing to generalise beyond the training data; here the model generalises the labelers' judgement accurately.
        d: Data drift is a change in production input after deployment, whereas this flaw was baked in before training.
        e: Temperature is a generative sampling setting and does not affect a moderation classifier's labels.
        f: Instance sizing affects latency and cost, not which posts are flagged.
        g: A high learning rate can destabilise training but cannot create a dialect-specific pattern that the labels did not contain.
        h: Inconsistent, subjective judgements by the people producing the labels are annotator bias, and the model learned them as if they were correct.
  - id: aif-ra9
    domain: responsible-ai
    question: Before any training job runs, a team wants to measure whether its labeled dataset is already skewed with respect to a demographic attribute, for example whether one group is under-represented or receives the positive label less often than another. Which capability produces those measurements?
    answer_type: single
    options:
      - id: a
        text: A pre-training bias analysis that computes metrics such as class imbalance on the labeled dataset
      - id: b
        text: Amazon SageMaker Model Monitor, which compares live endpoint traffic against a baseline
      - id: c
        text: Amazon Bedrock Guardrails
      - id: d
        text: An Amazon SageMaker model card
      - id: e
        text: Amazon Augmented AI (A2I)
      - id: f
        text: A SageMaker automatic model tuning job
      - id: g
        text: Amazon Comprehend sentiment analysis over the dataset
      - id: h
        text: An Amazon Bedrock model evaluation job
      - id: i
        text: A Data Wrangler bias report in Amazon SageMaker Canvas
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Pre-training bias metrics look only at the dataset and its labels, before a model exists, and report measures such as class imbalance and difference in proportions of labels across the facet you nominate. SageMaker Clarify computed them in processing jobs but closed to new customers on July 30, 2026, and AWS now recommends computing the same published formulas directly with pandas and scikit-learn; the bias report in Data Wrangler within SageMaker Canvas also produces them without code. That is exactly the question of whether the data itself is skewed.
      option_rationales:
        a: A pre-training bias analysis looks only at the labeled dataset, so it measures skew such as class imbalance and difference in proportions of labels before any training runs; the metrics are published formulas a team can compute directly with pandas and scikit-learn.
        b: Model Monitor needs a deployed endpoint and live traffic, so it cannot be used before a model exists.
        c: Guardrails filter content in Amazon Bedrock prompts and responses; they do not analyse a training dataset.
        d: A model card documents a model once it exists; it does not compute dataset statistics.
        e: A2I routes production predictions to human reviewers and has no dataset analysis function.
        f: Automatic model tuning searches hyperparameters for better accuracy and reports no bias metrics.
        g: Comprehend returns sentiment for text and says nothing about demographic skew in labels.
        h: A Bedrock evaluation job scores generative model output, not the balance of a labeled training set.
        i: The Data Wrangler bias report computes pre-training bias metrics, such as class imbalance, on the dataset for a chosen label and facet before any model exists.
  - id: aif-ra10
    domain: responsible-ai
    question: "A model has finished training. The compliance team now asks a different question: do the model's own predictions fall differently across a demographic facet, for example does one group receive the favourable predicted outcome less often than another? Which analysis answers that?"
    answer_type: single
    options:
      - id: a
        text: A post-training bias analysis that compares the model's predictions across the facet groups
      - id: b
        text: A Clarify pre-training bias analysis, which examines the dataset and its labels and never looks at the model's predictions
      - id: c
        text: Overall accuracy on the held-out test set
      - id: d
        text: Root mean squared error on the held-out test set
      - id: e
        text: A Model Monitor data quality baseline over the training data
      - id: f
        text: An Amazon Augmented AI human review loop
      - id: g
        text: An Amazon Bedrock guardrail with a denied topic
      - id: h
        text: The model's parameter count
      - id: i
        text: Disparate impact measured on the model's predictions across the facet
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: Post-training bias metrics run after training and compare the outcomes the model predicts for each facet value, with measures such as difference in positive proportions in predicted labels, disparate impact, and accuracy difference. SageMaker Clarify computed them but closed to new customers on July 30, 2026, and AWS now recommends computing the same published formulas directly from the predictions with pandas and scikit-learn. Pre-training metrics cannot answer this because they only see the dataset, and a single overall accuracy figure hides differences between groups entirely.
      option_rationales:
        a: Post-training bias metrics, such as difference in positive proportions in predicted labels, are defined over the model's predictions across the facet, which is precisely the question asked.
        b: Pre-training metrics describe the dataset before a model exists and therefore cannot describe predictions.
        c: A single accuracy number aggregates over everyone and conceals differences between groups.
        d: RMSE summarises numeric error for a regression model and reports nothing per group.
        e: A data quality baseline captures statistics and constraints for drift detection, not outcome disparity.
        f: A2I routes individual predictions to human reviewers; it does not compute group statistics.
        g: Guardrails screen generative content in Amazon Bedrock and compute no bias metrics.
        h: Parameter count describes model size and measures nothing about fairness.
        i: Disparate impact is a post-training bias metric that compares the rates of favorable predicted outcomes between the facet groups.
  - id: aif-ra11
    domain: responsible-ai
    question: A declined applicant asks why the model rejected their specific application. The team needs, for that one prediction, a signed contribution from each input feature showing how much it pushed the decision toward or away from approval. Which explainability output provides it?
    answer_type: single
    options:
      - id: a
        text: Feature attributions computed with Shapley values (SHAP), which assign each feature a contribution to that individual prediction
      - id: b
        text: The confusion matrix for the test set
      - id: c
        text: The model's overall accuracy
      - id: d
        text: The pre-training class imbalance metric for the dataset
      - id: e
        text: The F1 score of the classifier
      - id: f
        text: The area under the ROC curve
      - id: g
        text: The training job's loss curve
      - id: h
        text: The number of training epochs the job completed
      - id: i
        text: Local feature attributions for the individual record
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: SHAP is a model-agnostic method that distributes the difference between a prediction and a baseline across the input features. It yields global attributions, which rank feature importance across the dataset, and local attributions for an individual record, which is what an adverse-action explanation needs. SageMaker Clarify, which is built on the SHAP library, closed to new customers on July 30, 2026, and AWS now recommends using the SHAP library directly.
      option_rationales:
        a: SHAP feature attribution is designed to attribute a single prediction to its input features, which is exactly what the applicant is owed.
        b: A confusion matrix summarises correct and incorrect predictions across a whole dataset, not one decision.
        c: Accuracy is a single aggregate figure and explains nothing about an individual case.
        d: Class imbalance describes the dataset's composition before training, not this prediction.
        e: F1 balances precision and recall over a set of predictions and is not per-record.
        f: AUC-ROC summarises ranking quality across thresholds for the whole model.
        g: A loss curve shows how training progressed, which tells the applicant nothing.
        h: Epoch count is a training detail with no bearing on why one application was declined.
        i: Local explanations, such as SHAP values for a single record, attribute that one prediction to its input features, giving each feature a signed contribution.
  - id: aif-ra12
    domain: responsible-ai
    question: Amazon SageMaker Model Monitor watches a deployed endpoint on a schedule. Which TWO of the following are monitoring types it offers?
    answer_type: multi
    options:
      - id: a
        text: Bias drift, which recomputes bias metrics on live inference data and compares them with a baseline
      - id: b
        text: Feature attribution drift, which detects when the relative importance of the model's input features shifts away from the baseline
      - id: c
        text: Prompt injection attempts found in the request payload
      - id: d
        text: The per-request token price charged for the endpoint
      - id: e
        text: Changes made to the endpoint's IAM execution role policy
      - id: f
        text: Changes to the default encryption setting of the model artifact's Amazon S3 bucket
      - id: g
        text: The number of Amazon Bedrock guardrail versions in the account
      - id: h
        text: The query latency of the application's vector store
      - id: i
        text: Data quality, which compares live input statistics with a baseline to detect drift
      - id: j
        text: Model quality, which compares predictions with ground truth labels to track accuracy
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "Model Monitor supports four monitor types: data quality, model quality, bias drift, and feature attribution drift. The first two compare live inputs and prediction accuracy with a baseline, while the last two are backed by SageMaker Clarify and keep fairness and the model's explanation profile under watch after launch. Model Monitor closed to new customers on July 30, 2026; existing customers keep using it, and AWS points new users to its open-source SageMaker AI monitoring solutions with Amazon CloudWatch."
      option_rationales:
        a: Bias drift monitoring is one of the four Model Monitor types and is the one that keeps fairness under watch after launch.
        b: Feature attribution drift is the fourth type and tracks how the model's explanation profile changes over time.
        c: Prompt attack detection is an Amazon Bedrock Guardrails policy, not a SageMaker Model Monitor type.
        d: Cost per request is reported through billing and Cost Explorer, not by Model Monitor.
        e: IAM policy changes are recorded by AWS CloudTrail and assessed by AWS Config, not by Model Monitor.
        f: Bucket encryption settings are an Amazon S3 and AWS Config concern, outside Model Monitor's scope.
        g: Guardrail versions live in Amazon Bedrock and have no relationship to a SageMaker endpoint monitor.
        h: Vector store latency is an application performance metric, typically watched in Amazon CloudWatch.
        i: Data quality monitoring is one of the four Model Monitor types and flags drift in the statistics of live input data.
        j: Model quality monitoring is one of the four Model Monitor types and tracks metrics such as accuracy by merging predictions with ground truth.
  - id: aif-ra13
    domain: responsible-ai
    question: A credit model's fairness was assessed and signed off at launch. A year later the applicant population has shifted noticeably. The team wants to check on an ongoing basis whether the model's outcomes for each group have drifted from what was approved at launch, and to be alerted when they move outside the agreed range. What should they set up?
    answer_type: single
    options:
      - id: a
        text: An EventBridge-scheduled job that recomputes bias metrics on captured endpoint traffic and alerts through Amazon SNS
      - id: b
        text: Re-run the original Clarify pre-training bias analysis on the training dataset that was used a year ago
      - id: c
        text: Attach an Amazon Bedrock guardrail to the credit model's endpoint
      - id: d
        text: Create an Amazon SageMaker model card and update it once a year
      - id: e
        text: Send every prediction to an Amazon Augmented AI human review loop
      - id: f
        text: Create an Amazon CloudWatch billing alarm on the endpoint's monthly cost
      - id: g
        text: Enable AWS CloudTrail data events for the endpoint
      - id: h
        text: Capture endpoint traffic and schedule a job that compares per-facet outcome metrics with the launch baseline
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Bias measured once at launch goes stale as the population changes. Continuous fairness monitoring captures the endpoint's inference data, runs a scheduled job, for example triggered by Amazon EventBridge, that recomputes the bias metrics for each facet, compares them with the thresholds agreed at launch, and alerts through Amazon SNS when a gap crosses them. SageMaker Model Monitor's bias drift monitor offered this as a managed feature but closed to new customers on July 30, 2026, and AWS now points to its open-source SageMaker AI monitoring solutions, which run this pattern with Evidently AI and SageMaker AI MLflow.
      option_rationales:
        a: Recomputing the bias metrics on a schedule over captured live traffic, comparing them with the launch thresholds, and alerting on a breach is the continuous fairness check the team needs, and it is the pattern AWS's open-source SageMaker AI monitoring solutions use.
        b: Re-running the analysis on last year's training data measures the same old dataset and can never reveal a shift in today's applicants.
        c: Amazon Bedrock guardrails screen generative text content; they do not compute bias metrics and are not attached to a SageMaker endpoint serving a tabular credit model.
        d: A model card is documentation of the model; it records findings but detects nothing on its own.
        e: Reviewing every prediction by hand is not a metric comparison and would not scale for a credit decisioning endpoint.
        f: A billing alarm watches spend and says nothing about fairness.
        g: CloudTrail data events log who called the endpoint, which is an audit trail rather than a bias measurement.
        h: Recomputing per-facet metrics such as selection rate on the captured inference data at each run, and alerting when the gap moves outside the agreed range, detects fairness drift as the population changes.
  - id: aif-ra14
    domain: responsible-ai
    question: An insurer extracts fields from scanned claim forms automatically. Any extraction whose confidence score falls below a set threshold must wait for a trained reviewer to check it, and the reviewer's corrected value must flow back into the downstream workflow. Which approach fits this requirement?
    answer_type: single
    options:
      - id: a
        text: An AWS Step Functions workflow that pauses on a callback task token until the reviewer returns the corrected value
      - id: b
        text: Amazon SageMaker Ground Truth, which builds labeled datasets for training rather than reviewing live production predictions
      - id: c
        text: Amazon SageMaker Model Monitor
      - id: d
        text: Amazon SageMaker Clarify
      - id: e
        text: An Amazon Bedrock guardrail with a sensitive information filter
      - id: f
        text: Raise the confidence threshold and discard every extraction that falls below it
      - id: g
        text: Post each low-confidence extraction to Amazon Mechanical Turk and collect the answers yourself
      - id: h
        text: A Step Functions Choice state on the confidence score that sends uncertain extractions to a human review task
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Amazon Augmented AI (A2I), the managed human review service that Amazon Textract integrates with, closed to new customers on July 30, 2026, so a new build orchestrates the review loop itself. In AWS Step Functions, a Choice state compares each extraction's confidence score with the threshold, and a task using the .waitForTaskToken callback pattern pauses the execution while a trained reviewer checks the value in the insurer's own review application. When the application returns the token with the corrected value, the workflow resumes and passes it downstream, keeping a person in the loop where the model is least certain.
      option_rationales:
        a: A task using the .waitForTaskToken callback pattern pauses the execution at the review step, and when the reviewer's application returns the token with the corrected value, the workflow resumes with it.
        b: Ground Truth annotates datasets used to train a model; it is not triggered by a production prediction's confidence.
        c: Model Monitor detects drift against a baseline and routes nothing to a person.
        d: Clarify measures bias and produces feature attributions; it has no review workflow.
        e: A sensitive information filter masks PII in Amazon Bedrock traffic and has no bearing on extraction confidence.
        f: Discarding uncertain extractions loses the claim data entirely, which is the opposite of reviewing it.
        g: Mechanical Turk closed to new customers on July 30, 2026 and closes permanently on September 30, 2026, and a public crowd is not a trained reviewer for personal claim data in any case.
        h: The Choice state compares each confidence score with the threshold and routes only the uncertain extractions to a review task, which waits for the reviewer's decision before passing the corrected value downstream.
  - id: aif-ra15
    domain: responsible-ai
    question: What does reinforcement learning from human feedback (RLHF) contribute to a foundation model?
    answer_type: single
    options:
      - id: a
        text: People rank or rate candidate responses, those preferences train a reward model, and the reward model is then used to further train the foundation model so its output aligns better with human judgements of helpfulness and harmlessness
      - id: b
        text: It produces the labels for a supervised training dataset before any model exists
      - id: c
        text: It compresses the model's weights so that inference uses less memory
      - id: d
        text: It caches previous responses so that repeated questions are answered without calling the model
      - id: e
        text: It guarantees that the model's answers are factually correct
      - id: f
        text: It encrypts prompts and responses in transit
      - id: g
        text: It increases the number of tokens the model can accept in one request
      - id: h
        text: It aligns the model with human preferences, making responses more helpful and less likely to be harmful
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: RLHF adds human preference to training. Reviewers compare candidate responses to the same prompt, their rankings are used to fit a reward model that scores responses the way people would, and the foundation model is then optimised against that reward. It is the standard way of aligning a model with human expectations, but it shifts the model's behaviour toward preferred answers rather than proving any answer true.
      option_rationales:
        a: Human rankings, a learned reward model, and further training against that reward is the definition of RLHF.
        b: Producing labels for a supervised dataset is data annotation, for example with SageMaker Ground Truth.
        c: Shrinking weights describes quantisation or distillation, which are efficiency techniques.
        d: Reusing earlier responses describes caching, a latency and cost optimisation.
        e: Alignment to human preference reduces unhelpful and harmful output but cannot guarantee factual correctness.
        f: Encryption in transit is a transport security control configured outside the model.
        g: The context window is fixed by the model architecture and is not changed by RLHF.
        h: Aligning a model's behavior with what people prefer, typically toward helpful and harmless output, is the contribution RLHF is used for.
  - id: aif-ra16
    domain: responsible-ai
    question: Clinicians will act on the output of a triage model. The design team is deciding how the prediction should be presented. Which approach best reflects human-centered design for explainable AI?
    answer_type: single
    options:
      - id: a
        text: Show the prediction together with the factors that contributed most to it and how confident the model is, and let the clinician record a different decision
      - id: b
        text: Show only the final recommendation, so that clinicians are not distracted by the model's reasoning
      - id: c
        text: Hide the confidence score, because an uncertain number would undermine trust in the system
      - id: d
        text: Apply the model's recommendation automatically and notify the clinician afterwards, to remove human error from the process
      - id: e
        text: Raise the model's temperature so the wording of the recommendation sounds more natural
      - id: f
        text: Publish the model's weights on the intranet so that any clinician can inspect them
      - id: g
        text: Increase the training batch size so the model converges on a more confident answer
      - id: h
        text: Pair each prediction with similar past cases and their outcomes, and keep the final decision with the clinician
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Human-centered design starts from the person who has to act. In a high-consequence workflow that means giving the reviewer the information needed for an informed judgement, which is the contributing factors, the model's uncertainty, and comparable cases, and keeping the human able to disagree. Oversight that is designed into the interface is what makes explainability useful rather than merely available.
      option_rationales:
        a: Contributing factors, a confidence signal, and a genuine override are exactly the elements that make human oversight effective.
        b: Withholding the reasoning leaves the clinician unable to judge whether the recommendation applies to this patient.
        c: Concealing uncertainty invites over-reliance on the model precisely when it is least reliable.
        d: Removing the human from a high-consequence clinical decision is the opposite of human-centered design.
        e: Temperature changes the phrasing of generated text and adds nothing to the clinician's understanding.
        f: Raw weights are not interpretable by a clinician and disclose nothing useful about an individual case.
        g: Batch size is a training hyperparameter and has no effect on how the output is presented or understood.
        h: Comparable cases give the clinician an example-based explanation to weigh, and keeping the decision with them preserves meaningful human oversight.
  - id: aif-ra17
    domain: responsible-ai
    question: A retail bank's assistant must never give personalised investment advice, however a customer phrases the request, and the same rule has to hold across the three different foundation models the bank calls. Which control enforces this most reliably?
    answer_type: single
    options:
      - id: a
        text: Configure a denied topic in an Amazon Bedrock guardrail, describing the topic and giving sample phrasings in natural language, and apply that one guardrail to every model the application calls
      - id: b
        text: Add a line to each system prompt telling the model not to give investment advice, and rely on the model to obey it
      - id: c
        text: Fine-tune each of the three models so that it refuses investment questions
      - id: d
        text: Lower the temperature so that the model's answers become more conservative
      - id: e
        text: Enable a contextual grounding check so that answers stay close to the retrieved passages
      - id: f
        text: Enable a sensitive information filter so that account numbers are masked in responses
      - id: g
        text: Buy Provisioned Throughput for the three models
      - id: h
        text: Screen every prompt and response through the ApplyGuardrail API with one guardrail holding that denied topic
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: A denied topic is defined in natural language with a short description and example utterances, and the guardrail blocks matching content in both the prompt and the response, returning your configured message instead. Because a guardrail is a separate resource evaluated around the model, one guardrail can be applied to several models, to agents, or to any text through the ApplyGuardrail API, which gives a single, auditable place where the bank's policy lives.
      option_rationales:
        a: A denied topic applied through one shared guardrail enforces the policy outside the model and consistently across all three.
        b: A prompt instruction is guidance the model may fail to follow, and it has to be duplicated and kept in step in three places.
        c: Fine-tuning three models to refuse is expensive, slow to change, and still probabilistic rather than an enforced block.
        d: Temperature changes how varied the wording is; it does not stop the model discussing a subject.
        e: A contextual grounding check reduces claims unsupported by retrieved passages, which is about factual grounding rather than a forbidden subject.
        f: A sensitive information filter masks personal data and does nothing about the topic of the conversation.
        g: Provisioned Throughput reserves inference capacity and applies no content policy at all.
        h: The ApplyGuardrail API evaluates text against a guardrail independently of which model produced it, so one denied topic enforces the rule across all three models.
  - id: aif-ra18
    domain: responsible-ai
    question: A public-facing assistant occasionally returns insults and hateful phrasing. The safety team wants to set, per harmful category, how aggressively such content is blocked, and to have the check applied to both what users send and what the model returns. Which Amazon Bedrock Guardrails policy does this?
    answer_type: single
    options:
      - id: a
        text: Content filters, which let you set a filter strength for categories such as hate, insults, sexual content, violence, and misconduct, and apply it to prompts and to responses
      - id: b
        text: The denied topics policy, which blocks specific subjects you describe yourself rather than offering tunable strengths for standard harm categories
      - id: c
        text: The word filter, which blocks an exact list of words and phrases you supply
      - id: d
        text: The sensitive information filter, which blocks or masks personally identifiable information
      - id: e
        text: The contextual grounding check, which scores how far a response is supported by the passages supplied to it
      - id: f
        text: Provisioned Throughput for the model
      - id: g
        text: Prompt caching for the model
      - id: h
        text: The guardrail's content policy, with a strength from None to High for each harm category
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Content filters are the harmful-content policy inside a guardrail. Each category has a configurable strength, so a team can be strict about hate and more permissive elsewhere, and the filter is evaluated on the input and on the output. This is the control that supports the safety dimension of responsible AI for a public audience.
      option_rationales:
        a: Per-category, adjustable filtering of harmful content on both prompt and response is exactly what content filters provide.
        b: Denied topics block subjects you define in your own words and have no per-category harm strengths.
        c: A word filter is an exact match list, which cannot cover the many ways an insult can be phrased.
        d: Sensitive information filters address personal data leakage, not toxicity.
        e: The contextual grounding check targets unsupported claims in retrieval-based answers.
        f: Provisioned Throughput reserves capacity and enforces no content policy.
        g: Prompt caching reduces cost and latency for a repeated prompt prefix and filters nothing.
        h: The content policy is the guardrail's harmful-content filter set, where each category gets its own strength and is evaluated on prompts and responses.
  - id: aif-ra19
    domain: responsible-ai
    question: An internal model risk committee wants, for each version of each model the company builds, a single record holding the intended use, a risk rating, the datasets and training details, the evaluation results, and the reviewer's sign-off, so that it can be produced on demand during an audit. Which AWS capability is purpose-built for that record?
    answer_type: single
    options:
      - id: a
        text: Amazon SageMaker Model Cards, which capture intended uses, risk rating, training and evaluation details, and an approval status for each model version
      - id: b
        text: An AWS AI Service Card, which AWS publishes about its own AI services rather than about a model your team builds
      - id: c
        text: An Amazon Bedrock guardrail
      - id: d
        text: Amazon SageMaker Model Monitor
      - id: e
        text: A SageMaker Clarify bias report on its own
      - id: f
        text: AWS Artifact
      - id: g
        text: A plain text README stored beside the model artifact in Amazon S3
      - id: h
        text: A SageMaker model card per model version, exportable as a PDF
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "A SageMaker model card is a structured, versioned document attached to a model: model overview and owner, intended uses and risk rating, training details and datasets, evaluation results and metrics, and a status that moves from draft to pending review to approved. It is the governance artifact that turns scattered notes into something an auditor can be handed."
      option_rationales:
        a: Model cards are designed to hold exactly these fields per model version, with an approval status for sign-off.
        b: AI Service Cards are AWS's transparency documents for AWS AI services and models; you do not author one for your own model.
        c: A guardrail filters content at inference time and documents nothing.
        d: Model Monitor detects drift on a live endpoint; it records no intended use or risk rating.
        e: A bias report is one useful input to a model card, not the record of intended use and approval.
        f: AWS Artifact provides AWS compliance reports and agreements, not documentation of your models.
        g: A free-form README has no schema, no version linkage, and no approval workflow, which is what the committee needs.
        h: A model card records intended use, risk rating, training and evaluation details, and approval status, and can be exported as a PDF to hand to an auditor.
  - id: aif-ra20
    domain: responsible-ai
    question: Before approving a customer-facing feature built on an AWS AI service, a risk reviewer asks for AWS's own published account of that service's intended use cases, its limitations, the responsible AI design choices behind it, and best practices for deploying it well. What should the team point the reviewer to?
    answer_type: single
    options:
      - id: a
        text: The AWS AI Service Card for that service, which AWS publishes as a responsible AI transparency document covering intended uses, limitations, design choices, and deployment best practices
      - id: b
        text: An Amazon SageMaker model card, which the team authors about a model it builds itself
      - id: c
        text: AWS Artifact, which provides AWS audit reports and compliance agreements
      - id: d
        text: The service's API reference, which documents request and response syntax
      - id: e
        text: AWS Trusted Advisor checks for the account
      - id: f
        text: A SageMaker Clarify explainability report for the service
      - id: g
        text: An AWS Config conformance pack
      - id: h
        text: The AI Service Card that AWS maintains for the service among its responsible AI resources
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: AWS AI Service Cards are AWS's transparency resource for its own AI services and models. Each card sets out the use cases the service is intended for, how machine learning is used, key limitations, the responsible AI design choices AWS made across dimensions such as fairness, explainability, veracity and robustness, privacy and security, safety, controllability, governance, and transparency, and guidance on deploying and optimising the service. It is the right artifact for assessing a supplied service, as opposed to a model you trained yourself.
      option_rationales:
        a: An AI Service Card is precisely the AWS-published document containing intended uses, limitations, and responsible design choices for an AWS AI service.
        b: A model card documents a model your own team builds and would not describe AWS's design choices for its service.
        c: AWS Artifact supplies compliance reports such as SOC and ISO attestations, not AI transparency documentation.
