  - id: aif-ml17
    domain: ai-ml-fundamentals
    question: A utility forecasts daily electricity demand in megawatt hours and wants an error metric that penalizes a few very large misses more heavily than many small ones. Which metric should the team report?
    answer_type: single
    options:
      - id: a
        text: Root mean squared error (RMSE)
      - id: b
        text: Mean absolute error (MAE)
      - id: c
        text: Accuracy
      - id: d
        text: F1 score
      - id: e
        text: Precision
      - id: f
        text: Area under the ROC curve (AUC)
      - id: g
        text: A confusion matrix
      - id: h
        text: Mean squared error (MSE)
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: RMSE and MSE square each error before averaging, so large deviations dominate the score, which is what the team wants; MAE is the alternative regression metric that weights every error in proportion to its size.
      option_rationales:
        a: Squaring the errors makes RMSE grow quickly with large misses, which is exactly the penalty the team asked for.
        b: MAE averages absolute errors and treats a single huge miss the same as an equivalent total of small ones.
        c: Accuracy counts correct labels and does not apply to a continuous target such as megawatt hours.
        d: The F1 score balances precision and recall for classification problems.
        e: Precision is a classification metric describing how many positive predictions were correct.
        f: AUC summarizes a classifier's ranking ability across thresholds and has no meaning for regression.
        g: A confusion matrix tabulates predicted versus actual class labels, which a forecast of a continuous value does not produce.
        h: MSE squares each error before averaging, so a few very large misses raise it far more than many small ones.
