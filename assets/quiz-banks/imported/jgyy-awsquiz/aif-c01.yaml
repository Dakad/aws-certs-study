  - id: aif-ml26
    domain: ai-ml-fundamentals
    question: An online retailer in Mexico scores every card payment for risk during checkout. The shopper waits while the model runs, so each prediction must come back synchronously within about 100 milliseconds, and traffic is steady throughout the day with evening peaks. Which Amazon SageMaker AI inference option fits best?
    answer_type: single
    options:
      - id: a
        text: Batch transform run once each night
      - id: b
        text: Asynchronous inference with results written to Amazon S3
      - id: c
        text: A real-time inference endpoint
      - id: d
        text: On-demand Serverless Inference, accepting a cold-start delay after idle periods
      - id: e
        text: A SageMaker AI Processing job started for each payment
      - id: f
        text: The Amazon SageMaker Feature Store offline store
      - id: g
        text: An instance-backed endpoint that stays running, answers each request synchronously, and auto scales for the evening peaks
      - id: h
        text: SageMaker Canvas batch predictions on the day's payments
    accepted_correct_option_ids:
      - c
      - g
    author_notes:
      explanation: Real-time inference deploys the model to a persistent, fully managed endpoint whose instances stay running, which suits interactive workloads that need a synchronous, low-latency answer to every request, and auto scaling adds instances for peaks. Batch transform and asynchronous inference return results after the caller has moved on, and on-demand Serverless Inference can add cold-start delays, so none of them fits a checkout that must answer in milliseconds.
      option_rationales:
        a: A nightly batch job scores stored data long after the shopper has left, so it cannot approve a payment during checkout.
        b: Asynchronous inference queues each request and delivers the result to Amazon S3 later, which suits large or slow requests, not a caller waiting 100 milliseconds for an answer.
        c: Real-time endpoints are built for interactive, low-latency, synchronous requests, and steady all-day traffic keeps the always-on instances well used.
        d: Serverless Inference provisions compute on demand, so a cold start can add seconds when it wakes after idle time or scales for a peak, which breaks a strict checkout latency target.
        e: Processing jobs launch their own compute and take minutes to start, which is far too slow for a per-payment decision.
        f: The offline store holds historical feature values for building training datasets; it does not run the model or return predictions.
        g: "This describes a SageMaker AI real-time endpoint: instances stay running behind a managed endpoint, return each prediction synchronously, and auto scaling adds capacity for peaks."
        h: Canvas batch predictions score a whole dataset in bulk, not individual payments while a shopper waits.
