        text: Generated text cannot be logged or reviewed afterwards
      - id: h
        text: Its knowledge stops at a training cutoff date, so recent events are unknown to it
      - id: i
        text: Output can reflect social biases present in the training data
      - id: j
        text: The model cannot follow instructions given in a system prompt
    accepted_correct_option_ids:
      - a
      - b
      - h
      - i
    author_notes:
      explanation: Real designs must allow for factual unreliability, low interpretability, a knowledge cutoff after which the model knows nothing new, and biases absorbed from training data; these push teams toward grounding, human review, evaluation, and logging.
      option_rationales:
        a: Confident but incorrect output, commonly called hallucination, is a well-known limitation.
        b: Interpretability is genuinely hard for large models, which complicates audit and debugging.
        c: Models accept thousands to hundreds of thousands of tokens, far more than one sentence.
        d: Generative models are nondeterministic; identical repeated output is not the normal behavior.
        e: API invocation is the usual way to use them, for example through Amazon Bedrock.
        f: Inference uses the already-trained model; nothing is retrained per request.
        g: Requests and responses can and should be logged for review and troubleshooting.
        h: A model only knows what was in its training data, so anything after the cutoff has to be supplied by the application.
        i: Models absorb biases from the large corpora they are trained on, so outputs need evaluation and guardrails for fairness.
