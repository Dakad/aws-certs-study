  - id: aif-ra5
    domain: responsible-ai
    question: A claims triage assistant has to keep producing correct results when the text it receives contains typos, unusual formatting, or wording deliberately crafted to confuse it. Which AWS responsible AI dimension names that property?
    answer_type: single
