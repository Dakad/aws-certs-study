        d: Trusted Advisor checks a live account rather than offering design guidance for a workload being planned.
        e: The Health Dashboard reports service events and outages.
        f: A Model Card documents one model; it is not a design framework for ML workloads.
        g: The Pricing Calculator estimates cost and says nothing about design practice.
        h: Conformance packs bundle Config rules for compliance checking, not design guidance.
