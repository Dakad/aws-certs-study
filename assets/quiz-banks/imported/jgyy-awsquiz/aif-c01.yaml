      - id: b
        text: Fine-tune on Inf2 instances powered by AWS Inferentia2, and serve on Trn instances powered by AWS Trainium
      - id: c
        text: Run both steps on AWS Graviton processors, the AWS chips built specifically for deep learning
      - id: d
        text: Run both steps on AWS Inferentia, which AWS designed for training large models
      - id: e
        text: Use the AWS Nitro System as the accelerator that runs the model
      - id: f
        text: Move both steps to Amazon Bedrock on-demand inference, which runs on chips in the customer's own EC2 fleet
      - id: g
