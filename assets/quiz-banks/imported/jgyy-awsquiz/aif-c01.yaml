        text: Amazon Rekognition
      - id: b
        text: Amazon Comprehend
      - id: c
        text: Amazon Personalize
      - id: d
        text: Amazon Lex
      - id: e
        text: Amazon Polly
      - id: f
        text: A daily Amazon Athena query that lists the 20 most-watched titles for every viewer
      - id: g
        text: Amazon Textract
      - id: h
        text: A fully managed recommendation service that trains private models on the company's views, clicks, and item catalog
      - id: i
