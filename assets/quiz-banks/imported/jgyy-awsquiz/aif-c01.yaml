      - id: c
        text: Amazon Rekognition
      - id: d
        text: Amazon Transcribe
      - id: e
        text: Amazon Polly
      - id: f
        text: Amazon Personalize
      - id: g
        text: Amazon Translate
      - id: h
        text: A managed computer vision service that returns content moderation labels with a confidence score for each image
      - id: i
        text: Amazon Lex
    accepted_correct_option_ids:
      - c
      - h
    author_notes:
      explanation: Amazon Rekognition is the AWS computer vision service, and its content moderation capability detects explicit, inappropriate, and violent content in images and videos, returning moderation labels with confidence scores that the application can use to hold or reject a listing. It runs pretrained deep learning models, so no machine learning expertise or training data is needed.
      option_rationales:
