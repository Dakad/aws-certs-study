  - id: aif-gen34
    domain: genai-fundamentals
    question: An operations director asks why the company should use generative AI for customer communications instead of building a separate traditional ML model for each task. Which TWO are genuine advantages of generative AI?
    answer_type: multi
    options:
      - id: a
        text: "Accuracy: its answers are guaranteed to be factually correct, so generated outputs never need human review"
      - id: b
        text: "Adaptability: one foundation model can summarize, translate, classify, and draft, switching tasks through the prompt alone"
      - id: c
        text: "Determinism: identical prompts always produce identical output, which keeps testing simple"
      - id: d
        text: "Transparency: the exact reason behind every output can be traced step by step, which makes compliance audits simple"
      - id: e
        text: "Responsiveness: it produces tailored content in real time, within seconds of each request"
      - id: f
        text: "Currency: it knows about events after its training cutoff without being given them"
      - id: g
        text: "Autonomy: it removes the need for human oversight of regulated customer decisions"
      - id: h
        text: "Simplicity: staff instruct it in plain natural language, with no task-specific training or feature engineering"
      - id: i
        text: "Fairness: it cannot reflect bias, because it learns from very large datasets"
      - id: j
        text: "Personalization: it can tailor each message to the details of the individual customer's request"
      - id: k
        text: "Zero marginal cost: once a model is chosen, generating content incurs no further charges"
    accepted_correct_option_ids:
      - b
      - e
      - h
      - j
    author_notes:
      explanation: "Generative AI's advantages come from foundation models: adaptability (one pre-trained model performs many tasks based on the prompt), responsiveness (content generated in real time for each request), simplicity (a plain-language interface with no task-specific training), and personalization of each output. It does not guarantee accuracy, determinism, interpretability, current knowledge, fairness, or free operation, which is why designs still include grounding, evaluation, and human review."
      option_rationales:
        a: Generative models can produce confident but false content, so output still needs grounding, evaluation, and review.
        b: A foundation model handles many different tasks based on the prompt, whereas traditional ML needs a separately trained model for each task.
        c: Generation samples from a probability distribution, so wording varies between calls unless decoding is tightly constrained.
        d: Large models are hard to interpret, and the exact reason for a given output cannot be traced.
        e: Content is generated on demand within seconds for each request, which suits live customer interactions.
        f: A model knows nothing after its training cutoff unless the application supplies the information.
        g: Regulated decisions still need accountable human oversight; generative AI does not remove that requirement.
        h: A natural language interface lets people direct the model without engineering features or training a task-specific model.
        i: Models absorb biases present in their training data, so outputs must be evaluated for fairness.
        j: Because each response is generated for the specific request, messages can be personalized to the customer's situation.
        k: Inference is billed per token or per unit of reserved capacity, so every generated response has a cost.
  - id: aif-gen35
    domain: genai-fundamentals
    question: A hospital uses a large language model to draft discharge summaries that physicians review and sign. After one draft leaves out a documented allergy, the quality team asks for an exact explanation of why the model dropped that detail. What is the most accurate response?
    answer_type: single
    options:
      - id: a
        text: Export the model's decision rules, which list the exact conditions under which each clinical detail is included in a summary
      - id: b
        text: Ask the model why it left the allergy out, because its reply is an exact record of the internal computation that produced the draft
      - id: c
        text: Set the temperature to zero, which turns the model's internal reasoning into readable rules
      - id: d
        text: "No exact account exists: the output emerges from billions of learned weights, so the reason for one omission cannot be traced"
      - id: e
        text: Read the model's weights directly, because each weight corresponds to one clinical instruction
      - id: f
        text: Pull the model invocation logs, which record the step-by-step reasoning performed inside each layer of the model for every request
      - id: g
        text: Switch to a model with a larger context window, which lists its reasons for every omission in the output
      - id: h
        text: Fine-tune the model on past summaries, after which it reports why it includes or omits each detail
      - id: i
        text: The model is a black box, so the team should rely on evidence it can inspect, such as the logged input and output and physician review
    accepted_correct_option_ids:
      - d
      - i
    author_notes:
      explanation: "Large language models are often described as black boxes: an output emerges from interactions among billions of learned parameters, and understanding how the model arrived at a specific output is challenging. When a result must be explained exactly, teams rely on evidence they can inspect, such as logged prompts and responses, the source passages the model was given, and accountable human review, and they keep decisions that need an exact rationale in transparent rules or interpretable models."
      option_rationales:
        a: A large language model has no explicit rule set to export; its behavior is spread across its learned parameters.
        b: A self-explanation is newly generated text that can sound convincing and still be wrong; it is not a record of the model's internal computation.
        c: Temperature changes how tokens are sampled, and a repeatable output is still produced by the same opaque computation.
        d: Understanding how a large model arrived at a specific output is inherently hard, so a precise causal account of one omission cannot be produced.
        e: Individual weights do not map to readable instructions, because what the model has learned is distributed across billions of them.
        f: Invocation logs capture the prompts and responses exchanged with the model, not what happens inside its layers.
        g: A larger context window lets more text in; it does not make the model explain itself.
        h: Fine-tuning changes the model's behavior but does not make its internal reasoning traceable.
        i: Because the model's reasoning cannot be traced, accountability rests on evidence the team can inspect and on the physician who signs the summary.
  - id: aif-gen36
    domain: genai-fundamentals
    question: An online travel agency estimated its Amazon Bedrock bill by counting the words in its prompts and assuming one token per word. Actual input token counts came in higher, higher still for customer messages in Hindi and Arabic, and different again when the team tested a model from another provider. Which conclusion should the team draw?
    answer_type: single
    options:
      - id: a
        text: Amazon Bedrock bills per word, so the higher token counts must be a metering error to raise with AWS
      - id: b
        text: All models share one tokenizer, so the difference between the two providers must come from the temperature setting in each request
      - id: c
        text: Only output tokens are billed, so the length of the prompt has no effect on the monthly bill
      - id: d
        text: Text in other languages is translated into English before it is tokenized, so the language of a message cannot change its token count
      - id: e
        text: "Tokens are not words: each model's tokenizer splits text its own way, and some languages need more tokens per word"
      - id: f
        text: Context limits are counted in words, so the mismatch affects the price of each request but never the maximum input size
      - id: g
        text: A token is always exactly four characters, so the count depends only on the length of the text
      - id: h
        text: Estimate with the target model, for example the Amazon Bedrock CountTokens API, because token counts differ between tokenizers
      - id: i
        text: Choosing a model with a larger context window makes each word count as a single token
    accepted_correct_option_ids:
      - e
      - h
    author_notes:
      explanation: Models read and bill text in tokens, and a token is often a piece of a word rather than a whole one. Each model's tokenizer splits text its own way, so the same prompt can produce different token counts on different models, and many languages need more tokens per word than English. Prices, context windows, and most quotas are measured in tokens, so estimates should come from counting tokens with the target model, for example with the Amazon Bedrock CountTokens API.
      option_rationales:
        a: On-demand text inference is metered in input and output tokens, not words, so the difference is expected rather than an error.
        b: Tokenization is model-specific, and temperature affects sampling, not how input text is counted.
        c: Input tokens are billed as well as output tokens, so long prompts raise the bill.
        d: Text is tokenized as sent, and many tokenizers split non-English or non-Latin-script text into more tokens per word.
        e: A token is often a fragment of a word, the split depends on each model's tokenizer, and some languages need more tokens per word, so words are a poor proxy.
        f: Context windows are also measured in tokens, so a higher token count can push a request past the model's input limit.
        g: Characters per token vary with the text, the language, and the tokenizer; about four characters is only a rough average for English.
        h: CountTokens returns the input token count the chosen model would charge for, which is a reliable basis for cost and limit planning.
        i: The context window limits how many tokens fit in a request; it does not change how the tokenizer splits words.
