  - id: aif-sec24
    domain: ai-security-governance
    question: A company is establishing governance for the AI systems it deploys. Beyond the technical controls already in place, which TWO practices belong in its governance protocols?
    answer_type: multi
    options:
      - id: a
        text: A defined review cadence in which each deployed model is re-assessed on a schedule against its documented risk and performance criteria
      - id: b
        text: Role-specific training, so the people who build, operate, and approve AI systems understand the policies they have to follow
      - id: c
        text: Auto scaling the inference endpoint so that it absorbs traffic spikes
      - id: d
        text: Choosing a model with a larger context window so that fewer requests are needed
      - id: e
        text: Caching frequently repeated prompts to reduce token cost
      - id: f
        text: Using Spot Instances for training jobs to lower their cost
      - id: g
        text: Raising the temperature setting so that responses vary more between users
      - id: h
        text: Quantising the model so that it fits on a smaller instance type
      - id: i
        text: A named owner for each AI system who is accountable for its risks and approves changes
      - id: j
        text: Transparency standards that define what is disclosed to users about each AI system
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "Governance protocols are the human and procedural side of responsible AI: written policies, clear accountability, a schedule on which models and their risks are reviewed, transparency standards for what gets disclosed, and training so that the people involved know what is expected. Without them, technical controls drift, because no one is obliged to look at them again. The remaining options are performance and cost decisions, which belong to operations rather than governance."
      option_rationales:
        a: A scheduled re-assessment against documented criteria is how a governance programme keeps deployed models within policy over time.
        b: Training the builders, operators, and approvers is what makes a written policy take effect in practice.
        c: Auto scaling is a capacity and availability measure with no governance content.
        d: Context window size is a model selection trade-off about prompt capacity and cost.
        e: Prompt caching is a cost optimisation.
        f: Spot Instances reduce training cost and say nothing about oversight.
        g: Temperature changes output randomness; varying responses is not a governance practice.
        h: Quantisation is an efficiency technique for serving a model on smaller hardware.
        i: Clear accountability, with a named owner answerable for each system, is a core element of an AI governance protocol.
        j: Agreed standards for what is disclosed about AI systems belong in governance, because they make transparency a policy rather than an individual choice.
