  - id: aif-ml22
    domain: ai-ml-fundamentals
    question: "A finance team must decide whether a new requirement needs machine learning. The rule is fixed by regulation: any transfer above 10,000 dollars requires a second approver, with no exceptions, and every decision must be explained exactly. What is the most appropriate recommendation?"
    answer_type: single
    options:
      - id: a
        text: Implement it as deterministic business logic, because the rule is known, fixed, and must be fully auditable, so machine learning would add cost and uncertainty with no benefit.
      - id: b
        text: Train a binary classifier so the system can learn the threshold from historical transfers.
      - id: c
        text: Use a foundation model to judge each transfer from a natural language prompt.
      - id: d
        text: Use an anomaly detection model to flag transfers above the threshold.
      - id: e
        text: Use machine learning anyway, so the system will adapt automatically to future regulations.
      - id: f
        text: Use a clustering model to group transfers by amount and approve each group.
      - id: g
        text: Use a recommendation engine to suggest what the second approver should decide.
      - id: h
        text: Apply the limit with a rules engine, because a fixed rule that must be explained exactly needs no learned model.
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Machine learning suits problems whose rules are unknown, complex, or changing; when a rule is explicit, stable, and must be explained exactly, deterministic code is cheaper, faster, and fully auditable.
      option_rationales:
        a: A known, fixed, legally mandated threshold is a textbook case for deterministic logic rather than a learned model.
        b: A classifier would approximate a threshold that is already stated exactly, introducing errors a regulator would not accept.
        c: A foundation model adds latency, cost, and non-determinism to a decision that must be exact and repeatable.
        d: Anomaly detection finds unusual records; a transfer above 10,000 dollars is a defined rule, not an anomaly.
        e: Models do not adapt to regulations on their own; a changed regulation means a code change either way.
        f: Clustering produces groups with no guaranteed relation to the regulatory threshold.
        g: A recommendation engine ranks items for users and cannot enforce a compliance rule.
        h: A rules engine applies the stated limit exactly and records why each decision was made, which a learned model cannot guarantee.
