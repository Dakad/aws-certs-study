      - id: d
        text: Whether the model accepts image input as well as text
      - id: e
        text: The default top-k value the model applies when none is supplied
      - id: f
        text: The date on which the model's training data ends
      - id: g
        text: Whether the model can be tried out in PartyRock
      - id: h
        text: The number of guardrails that already exist in the account
      - id: i
        text: How accurately the model uses details from deep inside a very long prompt
      - id: j
        text: The price per input token, since every request carries a very long prompt
    accepted_correct_option_ids:
      - a
      - b
      - i
      - j
    author_notes:
      explanation: "Long-input, long-output work is bounded at both ends: the filing has to fit inside the model's input limit and the briefing note inside the number of tokens it can generate for one response. Among models that clear those limits, accuracy over very long prompts and the price per input token then decide which candidate suits the workload best."
      option_rationales:
        a: If the filing does not fit in one request, the team must chunk it or pick another model, so input capacity is the first constraint.
        b: A five-page note is several thousand tokens, so the output ceiling is the second hard constraint.
        c: Embedding dimension describes a vector search component that this single-call summarization does not use.
        d: The filings are text, so image input capability adds nothing.
        e: A default top-k affects wording variety and can be overridden per request; it does not limit length.
        f: A training cutoff limits what the model knows from memory, but here the content arrives in the prompt.
        g: PartyRock availability is about a no-code playground, not about production model capacity.
        h: Existing guardrails are an account configuration detail, unrelated to document length.
        i: Some models lose track of material in the middle of a long input, so long-context accuracy decides whether a 300-page filing is summarized faithfully.
        j: Each request sends a whole filing, so input token price dominates the cost of this workload and differs sharply between models.
  - id: aif-fm3
    domain: foundation-model-applications
    question: An Amazon Bedrock summarizer returns answers that break off in the middle of a sentence, always at about the same length, even though the prompt asks for a full paragraph. Which inference setting should the developer change first?
    answer_type: single
    options:
      - id: a
        text: Raise the maximum response length, which caps how many tokens the model is allowed to generate
      - id: b
        text: Raise the temperature
      - id: c
        text: Lower top-p
      - id: d
        text: Add a stop sequence at the end of the paragraph
      - id: e
        text: Raise top-k
      - id: f
        text: Switch to a model with a larger context window
      - id: g
        text: Turn on prompt caching
      - id: h
        text: Raise maxTokens in the inference configuration
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Output that always stops at roughly the same point, mid-sentence, is the signature of hitting the maximum response length (the max tokens setting), which ends generation as soon as the budget is spent. Sampling settings such as temperature, top-p, and top-k change which words are chosen, not how many are allowed.
      option_rationales:
        a: The cap on generated tokens is exactly what truncates a response at a fixed length regardless of content.
        b: A higher temperature makes wording more varied; it does not lift the token budget.
        c: A lower top-p narrows the candidate tokens and makes output more predictable, not longer.
        d: A stop sequence ends generation earlier, which makes the truncation worse rather than better.
        e: Top-k widens or narrows the candidate pool per token and has no effect on length.
        f: A bigger context window admits more input; the configured output cap would still cut the answer off.
        g: Prompt caching reduces the cost and latency of repeated prompt prefixes and does not change response length.
        h: maxTokens is the Converse API name for the output token cap, so raising it lets the model finish the paragraph.
  - id: aif-fm4
    domain: foundation-model-applications
    question: An assistant must answer staff questions from the company's own policy documents, quote the passage it relied on, and stay current although the documents are edited most weeks. The team does not want to train or retrain a model. Which approach does this describe, and why does it cut down invented answers?
    answer_type: single
    options:
      - id: a
        text: "Retrieval Augmented Generation: the application searches an external store of the company's documents at query time and places the retrieved passages in the prompt, so the model answers from supplied text instead of from memory alone"
      - id: b
        text: "Fine-tuning: the document text is folded into the model's weights, so the model recalls it directly"
      - id: c
        text: "Continued pre-training: the base model is trained further so that policy wording becomes part of what it knows"
      - id: d
        text: Raising the temperature, so that the model explores more possible answers before settling on one
      - id: e
        text: Choosing a model with a larger context window, which by itself makes answers factual
      - id: f
        text: Prompt caching, which stores previous answers so repeated questions are answered from the cache
      - id: g
        text: Provisioned Throughput, which dedicates model capacity to the assistant
      - id: h
        text: "Grounded generation: passages from the current documents are retrieved for each question and supplied as context, so answers rest on evidence"
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Retrieval Augmented Generation, a form of grounded generation, keeps the model unchanged and instead retrieves relevant passages from an external knowledge source at query time, adding them to the prompt. Grounding the answer in text the application supplied both reduces fabrication and makes citation possible, and a document edited today is used as soon as it is re-indexed.
      option_rationales:
        a: Retrieving passages at query time and grounding the answer in them is the definition of RAG and the reason it reduces hallucination.
        b: Fine-tuning changes weights in a training job, so weekly document edits would mean repeated retraining and still no citation.
        c: Continued pre-training is an even heavier training exercise and shares the same staleness and citation problems.
        d: A higher temperature increases variety, which makes invented detail more likely, not less.
        e: A larger context window only means more text can be sent; something still has to choose and supply the right text.
        f: Prompt caching is a cost and latency optimisation for repeated prompt prefixes, not a source of grounded facts.
        g: Provisioned Throughput reserves capacity and has no effect on answer accuracy.
        h: Grounding each answer in passages retrieved at query time is the RAG pattern, and answering from supplied evidence is what reduces invented content.
  - id: aif-fm5
    domain: foundation-model-applications
    question: A team is weighing Retrieval Augmented Generation against fine-tuning for an internal policy assistant whose source documents are edited most weeks. Which TWO statements are genuine advantages of the RAG approach in this situation?
    answer_type: multi
    options:
      - id: a
        text: An edited document is reflected in answers as soon as it is re-indexed, with no training job to run
      - id: b
        text: The response can cite the retrieved passage, so a reviewer can check where the answer came from
      - id: c
        text: It removes the token cost of the retrieved text from every request
      - id: d
        text: It guarantees that the assistant can never state anything incorrect
      - id: e
        text: It writes the policy text permanently into the model's weights
      - id: f
        text: It means the team no longer needs to evaluate the assistant's answers
      - id: g
        text: It removes the need for any vector store or search index
      - id: h
        text: Per-user access filters can be applied to what is retrieved, which model weights cannot enforce
      - id: i
        text: No labeled prompt-and-completion dataset has to be built to get started
      - id: j
        text: It lowers per-request latency because no lookup happens before generation
    accepted_correct_option_ids:
      - a
      - b
      - h
      - i
    author_notes:
      explanation: RAG leaves the model alone and changes what the prompt contains, so freshness becomes an indexing problem rather than a training problem, no labeled training set is needed, and because the passages are known the application can cite them and filter them by user permissions. It does not make the system infallible, and the retrieved passages are extra input tokens that you pay for on every call.
      option_rationales:
        a: Re-indexing is fast and cheap compared with a fine-tuning job, which is why RAG suits content that changes often.
        b: Citations are possible precisely because the application knows which passages it put in the prompt.
        c: "The opposite is true: retrieved passages add input tokens, so each request costs more than an unaugmented one."
        d: A model can still misread or over-generalise from a correct passage, so RAG reduces but does not eliminate wrong answers.
        e: Changing weights describes fine-tuning or continued pre-training, not RAG.
        f: Evaluation and human review of high-risk output remain necessary whatever the grounding approach.
        g: RAG depends on a retrieval component, usually a vector store or search index, so it cannot remove the need for one.
        h: Retrieval can be filtered by each user's permissions, whereas text absorbed into fine-tuned weights is available to every user of the model.
        i: RAG works from the documents as they are, while fine-tuning needs a curated set of labeled training examples.
        j: RAG adds a retrieval call before generation, so each request usually takes longer, not shorter.
  - id: aif-fm6
    domain: foundation-model-applications
    question: "A team wants managed retrieval on Amazon Bedrock: point the service at documents in Amazon S3 and have it split them into chunks, create embeddings, keep them in a vector index, and return answers with citations, without the team writing ingestion or retrieval code. Which capability should they use?"
    answer_type: single
    options:
      - id: a
        text: Amazon Bedrock Knowledge Bases
      - id: b
        text: Amazon Bedrock Provisioned Throughput
      - id: c
        text: An Amazon Bedrock model evaluation job
      - id: d
        text: A fine-tuning job that uses the same documents as training data
      - id: e
        text: Amazon Comprehend entity detection over the bucket
      - id: f
        text: An AWS Glue crawler over the bucket
      - id: g
        text: Amazon Athena queries over the bucket
      - id: h
        text: Amazon Bedrock prompt caching
      - id: i
        text: Bedrock data source sync with the RetrieveAndGenerate API
    accepted_correct_option_ids:
      - a
      - i
    author_notes:
      explanation: "Amazon Bedrock Knowledge Bases is the managed RAG pipeline: you register a data source such as an S3 prefix, choose an embedding model and a supported vector store, and the service handles chunking, embedding, and syncing. The RetrieveAndGenerate API then returns an answer together with the citations for the chunks it used."
      option_rationales:
        a: Knowledge Bases performs exactly this ingestion, embedding, retrieval, and citation work as a managed feature.
        b: Provisioned Throughput reserves inference capacity and has nothing to do with indexing documents.
        c: An evaluation job scores model or knowledge base output; it does not build the index.
        d: Fine-tuning on documents is a training job, gives no citations, and goes stale as the documents change.
        e: Comprehend extracts entities, key phrases, and sentiment; it is not a retrieval layer for a generative assistant.
        f: A Glue crawler catalogs table schemas for analytics, not semantic chunks for generation.
        g: Athena runs SQL over structured files in S3; it has no embedding or semantic search step.
        h: Prompt caching reuses a repeated prompt prefix to save cost and latency; it does not index your documents.
        i: Syncing a Bedrock data source chunks, embeds, and indexes the S3 documents, and RetrieveAndGenerate returns answers with citations, which is the Knowledge Bases workflow.
  - id: aif-fm7
    domain: foundation-model-applications
    question: In a Retrieval Augmented Generation application, what is the particular job of the vector store?
    answer_type: single
    options:
      - id: a
        text: It holds an embedding vector for each document chunk and returns the chunks whose vectors are closest to the query's vector
      - id: b
        text: It stores the model's weights so that inference does not have to load them
      - id: c
        text: It caches finished answers so that identical questions are never sent to the model
      - id: d
        text: It keeps the conversation history for billing purposes
      - id: e
        text: It turns text into embedding vectors
      - id: f
        text: It applies content filters to the model's output
      - id: g
        text: It compresses the prompt so that it fits the context window
      - id: h
        text: It serves as the semantic search index that finds the passages most related to the question
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "A vector store indexes embeddings and answers nearest-neighbour queries: given the embedding of a question, it returns the most semantically similar chunks so they can be added to the prompt. Producing the embeddings is the embedding model's job; the store's job is to keep them and search them quickly."
      option_rationales:
        a: Storing embeddings and returning the nearest matches by similarity is precisely what a vector store contributes.
        b: Model weights live with the inference service, not in your vector store.
        c: Answer caching is a separate optimisation and is not what a vector index does.
        d: Billing records are produced by the service, not by the retrieval layer.
        e: An embedding model produces the vectors; the store receives and indexes them.
        f: Filtering harmful content is the job of a guardrail applied at inference time.
        g: Nothing in the vector store rewrites or compresses the prompt.
        h: Acting as a semantic index searched by embedding similarity is the vector store's particular contribution to a RAG pipeline.
  - id: aif-fm8
    domain: foundation-model-applications
    question: A product catalog already runs on Amazon Aurora PostgreSQL-Compatible Edition. The team wants semantic search over the same catalog rows and does not want to introduce and keep a second datastore in sync. Which approach fits best?
    answer_type: single
    options:
      - id: a
        text: Enable the pgvector extension in the Aurora PostgreSQL cluster and store each row's embedding in a vector column next to the catalog data
      - id: b
        text: Create an Amazon OpenSearch Serverless vector collection and copy the catalog into it
      - id: c
        text: Load the embeddings into Amazon Neptune and traverse the graph to find similar products
      - id: d
        text: Use the embedding as a partition key in an Amazon DynamoDB global secondary index
      - id: e
        text: Keep the embeddings in Amazon ElastiCache with a time to live
      - id: f
        text: Write the embeddings to Amazon Timestream
      - id: g
        text: Publish the embeddings to an Amazon SQS queue and search the queue
      - id: h
        text: Use Aurora machine learning to create embeddings with Amazon Bedrock and query them with pgvector in the same cluster
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: The pgvector extension adds a vector data type and similarity operators to PostgreSQL, so Aurora PostgreSQL can hold embeddings beside the business rows and serve nearest-neighbor queries in the same SQL statement, and Aurora machine learning can generate those embeddings by calling Amazon Bedrock from SQL. Aurora PostgreSQL with pgvector is also one of the vector stores supported by Amazon Bedrock Knowledge Bases.
      option_rationales:
        a: Adding a vector column to the database already in use satisfies the requirement with no second datastore to synchronise.
        b: An OpenSearch Serverless vector collection is a capable vector store, but standing one up is the extra datastore the requirement rules out.
        c: Neptune is a graph database for relationships between entities, not the natural home for similarity search over catalog rows.
        d: DynamoDB indexes exact key values; a high-dimension embedding is not a usable partition key and no similarity search results.
        e: ElastiCache is an in-memory cache with expiring entries, which is a poor fit for the durable catalog index.
        f: Timestream is built for time-series measurements, not for semantic similarity.
        g: SQS delivers messages and cannot be queried by similarity at all.
        h: Aurora machine learning lets SQL call Bedrock embedding models, and pgvector stores and searches the vectors beside the catalog rows, so no second datastore is needed.
  - id: aif-fm9
    domain: foundation-model-applications
    question: A team lists four ways of making a foundation model perform better on its task. Which ordering runs from the cheapest and quickest to put in place to the most expensive and slowest?
    answer_type: single
    options:
      - id: a
        text: Prompt engineering, then Retrieval Augmented Generation, then fine-tuning, then pre-training a model from scratch
      - id: b
        text: Pre-training from scratch, then fine-tuning, then Retrieval Augmented Generation, then prompt engineering
      - id: c
        text: Fine-tuning, then prompt engineering, then pre-training from scratch, then Retrieval Augmented Generation
      - id: d
        text: Retrieval Augmented Generation, then prompt engineering, then pre-training from scratch, then fine-tuning
      - id: e
        text: Prompt engineering, then fine-tuning, then pre-training from scratch, then Retrieval Augmented Generation
      - id: f
        text: Pre-training from scratch, then Retrieval Augmented Generation, then prompt engineering, then fine-tuning
      - id: g
        text: Rewriting the prompt, then adding retrieved context, then adjusting the model's weights, then training a new model from nothing
      - id: h
        text: Prompt engineering, then fine-tuning, then Retrieval Augmented Generation, then pre-training a model from scratch
    accepted_correct_option_ids:
      - a
      - g
    author_notes:
      explanation: Prompt engineering needs no new infrastructure and can be changed in minutes. RAG adds an index and a retrieval step but still leaves the model untouched. Fine-tuning needs a curated labeled dataset and a training job, and pre-training a model from scratch needs an enormous corpus and a large amount of accelerated compute. AWS guidance is to exhaust the cheaper options before customising the model.
      option_rationales:
        a: This is the accepted order of increasing cost, data requirement, and elapsed time.
        b: This is the correct order reversed, starting with the most expensive option.
        c: Fine-tuning is far more costly than prompt engineering, so it cannot come first.
        d: Prompt engineering is cheaper than RAG, and pre-training is more expensive than fine-tuning, so two positions are wrong.
        e: Pre-training from scratch is the most expensive approach and cannot sit before RAG.
        f: Pre-training from scratch is the most expensive approach and cannot come first.
        g: These are prompt engineering, RAG, fine-tuning, and pre-training described by what each changes, in the accepted order of rising cost and effort.
        h: Fine-tuning needs a curated dataset and a training job, so it costs more than adding retrieval and cannot come before RAG.
  - id: aif-fm10
    domain: foundation-model-applications
    question: A manufacturer holds two million internal engineering documents full of in-house part names and jargon, and has no labeled examples at all. It wants a custom model that understands that vocabulary before any task-specific work starts. Which model customisation approach matches that need?
    answer_type: single
    options:
      - id: a
        text: Continued pre-training, which trains the base model further on a large body of unlabeled domain text
      - id: b
        text: Fine-tuning, which requires labeled pairs of prompt and expected completion
      - id: c
        text: Model distillation, which transfers behaviour from a larger teacher model into a smaller student model
      - id: d
        text: Reinforcement fine-tuning, which learns from reward functions that score each response
      - id: e
        text: Few-shot prompt engineering, which supplies a handful of examples in each request
      - id: f
        text: Buying Provisioned Throughput for the base model
      - id: g
        text: Turning on prompt caching for the base model
      - id: h
        text: Domain adaptation training, which exposes the base model to a large corpus of unlabeled company text
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Continued pre-training, also called domain adaptation, keeps training a base model on a large volume of your own unlabeled text so that it absorbs domain vocabulary and language patterns. Fine-tuning is the labeled, task-specific step and is often applied afterwards, needing far fewer labeled records because the model already knows the domain.
      option_rationales:
        a: A large unlabeled corpus and a goal of domain vocabulary is exactly the continued pre-training case.
        b: Fine-tuning cannot start here because the company has no labeled prompt-and-completion pairs.
        c: Distillation makes a smaller model imitate a larger one; it does not teach new domain vocabulary from a corpus.
        d: Reinforcement fine-tuning needs reward functions that judge responses, which is a different exercise from absorbing a corpus.
        e: A few examples per request cannot convey the vocabulary of two million documents, and the requirement asks for a custom model.
        f: Provisioned Throughput reserves inference capacity and changes nothing about what the model knows.
        g: Prompt caching reduces the cost of repeated prompt prefixes and does not customise the model.
        h: Domain adaptation is the other name for continued pre-training on unlabeled in-house text, which is how the model learns the company's vocabulary.
  - id: aif-fm11
    domain: foundation-model-applications
    question: A team is preparing a dataset to fine-tune a foundation model on Amazon Bedrock so that it writes incident summaries in the company's house format. How should the training data be prepared?
    answer_type: single
    options:
      - id: a
        text: As labeled examples in JSON Lines format, one record per line pairing the input prompt with the desired output, stored in Amazon S3
      - id: b
        text: As one large PDF containing every past incident report, stored in Amazon S3
      - id: c
        text: As raw unlabeled text, because fine-tuning works out the target format by itself
      - id: d
        text: As an Amazon DynamoDB table with one item per past incident
      - id: e
        text: As a list of prompts with no expected outputs, leaving the model to infer the format
      - id: f
        text: As screenshots of correctly formatted summaries
      - id: g
        text: As a CSV of numeric feature columns and one numeric target column
      - id: h
        text: As JSONL conversation records in Amazon S3, each pairing a user message with the ideal assistant reply
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: A Bedrock fine-tuning job reads a JSON Lines file from Amazon S3 in which every line is one labeled example, either a prompt with its completion or a conversation ending in the ideal assistant reply. Teams normally reserve a separate validation file in the same format so that training progress can be measured on data the job did not train on.
      option_rationales:
        a: One labeled prompt-and-completion record per line in JSONL, held in S3, is the required format.
        b: A single PDF is neither line-delimited nor labeled, so the job has no input-output pairs to learn from.
        c: Unlabeled text is the input for continued pre-training, not for fine-tuning a specific output format.
        d: A DynamoDB table is not an accepted training data source for a Bedrock customisation job.
        e: Without expected outputs there is nothing supervised for the model to learn.
        f: Images of summaries do not give a text model the text pairs it needs.
        g: A numeric feature and target table is the shape of classic tabular machine learning, not of text fine-tuning.
        h: Bedrock also accepts fine-tuning data as JSONL conversation records, where the assistant turn is the labeled target output, stored in S3.
  - id: aif-fm12
    domain: foundation-model-applications
    question: Four teams have pasted near-identical copies of a 600-word prompt into their own code, and each copy has drifted. The platform team wants one governed prompt with named variables and versions that every application calls by identifier, and wants to compare versions before releasing them. Which Amazon Bedrock feature is designed for this?
    answer_type: single
    options:
      - id: a
        text: Prompt management, which stores, versions, and tests reusable prompts together with their variables and model configuration
      - id: b
        text: Amazon Bedrock Guardrails
      - id: c
        text: Amazon Bedrock Knowledge Bases
      - id: d
        text: Prompt caching
      - id: e
        text: A fine-tuning job that bakes the prompt into a custom model
      - id: f
        text: AWS Systems Manager Parameter Store
      - id: g
        text: Amazon Bedrock batch inference
      - id: h
        text: Stored Bedrock prompts that the Converse API can run
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "Prompt management in Amazon Bedrock is a catalog of reusable prompts: each prompt carries its text with input variables, the model and inference configuration it is meant for, and numbered versions you can test in the console and then reference from an application or a flow, which removes the copy-and-paste drift."
      option_rationales:
        a: Storing, versioning, testing, and reusing prompts with variables is exactly what prompt management provides.
        b: Guardrails filter harmful content and sensitive data; they do not manage prompt text.
        c: Knowledge Bases supply retrieved passages to a prompt rather than governing the prompt itself.
        d: Prompt caching reuses a repeated prompt prefix at inference time to cut cost and latency; it does not version anything.
        e: Fine-tuning changes model weights and would have to be repeated for every prompt edit.
        f: Parameter Store can hold a string, but it has no prompt variables, no linked model configuration, and no built-in prompt testing.
        g: Batch inference runs many prompts offline at a lower price and has no prompt catalog.
