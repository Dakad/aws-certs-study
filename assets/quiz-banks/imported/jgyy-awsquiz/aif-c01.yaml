  - id: aif-gen43
    domain: genai-fundamentals
    question: "An online retailer uses one model on Amazon Bedrock for two workloads: a shopping assistant that customers chat with during flash sales, where every second of delay loses sales, and an internal job that summarizes product reviews for a weekly report and can wait. Neither workload justifies reserving capacity. Which choice gives the assistant the fastest responses while cutting the cost of the review job?"
    answer_type: single
    options:
      - id: a
        text: Priority tier for the shopping assistant, and Flex tier for the review summaries
      - id: b
        text: Flex tier for the shopping assistant, and Priority tier for the review summaries
      - id: c
        text: Priority tier for both workloads, so that every request is answered as fast as possible
      - id: d
        text: Flex tier for both workloads, to get the lower price on every request
      - id: e
        text: Reserved tier for both workloads, with a three-month capacity reservation
      - id: f
        text: Batch inference for the shopping assistant, and Standard tier for the review summaries
      - id: g
        text: Provisioned Throughput for the shopping assistant, and Priority tier for the review summaries
      - id: h
        text: Priority tier for the shopping assistant, and a batch inference job for the review summaries
      - id: i
        text: Standard tier for the shopping assistant, and Priority tier for the review summaries
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "Amazon Bedrock service tiers trade responsiveness against price per request: Priority charges a premium to serve requests ahead of Standard and Flex traffic, Standard is the default, Flex gives a discount in exchange for longer processing times, and Reserved dedicates capacity for a term. Latency-sensitive customer traffic belongs on Priority, while work that can wait saves money on Flex or as a discounted batch inference job."
      option_rationales:
        a: Priority serves the customer-facing requests first, and Flex discounts the review job, which can tolerate slower processing.
        b: This reverses the trade-off, slowing the assistant and paying a premium for a job nobody is waiting on.
        c: Paying the Priority premium for the weekly review job raises its cost instead of cutting it.
        d: Flex accepts longer processing times, which would slow the assistant during flash sales.
        e: The Reserved tier requires a capacity reservation for a term, which neither workload justifies.
        f: Batch inference returns results asynchronously and cannot serve a live chat, and Standard gives the review job no discount.
        g: Provisioned Throughput is reserved capacity, which the retailer has ruled out, and Priority adds cost to the review job.
        h: Priority gives the assistant the fastest responses, and a batch job runs the weekly summaries at a lower price than on-demand.
        i: Standard gives the assistant no prioritization, and Priority adds cost where speed does not matter.
  - id: aif-gen44
    domain: genai-fundamentals
    question: For a cost estimate, assume a model on Amazon Bedrock is priced at $3 per million input tokens and $15 per million output tokens. Each request to the new feature sends 3,000 input tokens and receives 1,000 output tokens. Which statement about the cost of one request is correct?
    answer_type: single
    options:
      - id: a
        text: The 1,000 output tokens cost more than the 3,000 input tokens
      - id: b
        text: Each request costs the same whatever the response length, because Amazon Bedrock bills per request
      - id: c
        text: The input tokens make up most of the cost, because there are three times as many of them
      - id: d
        text: Removing 1,000 tokens from the prompt saves exactly as much as removing 1,000 tokens from the response
      - id: e
        text: Each request costs $0.060 in model charges
      - id: f
        text: Each request costs $0.012 in model charges
      - id: g
        text: Raising the temperature lowers the price charged for each output token
      - id: h
        text: Capping responses at 500 tokens saves more per request than cutting 1,000 tokens from the prompt
      - id: i
        text: Output tokens are not billed when generation ends at a stop sequence
      - id: j
        text: Each request costs $0.024 in model charges
    accepted_correct_option_ids:
      - a
      - h
      - j
    author_notes:
      explanation: On-demand pricing counts input and output tokens separately, and on most models an output token costs more than an input token. Here the input costs 3,000 x $3 / 1,000,000 = $0.009 and the output 1,000 x $15 / 1,000,000 = $0.015, so the shorter output is the larger share of the $0.024 total. The main levers are shorter prompts and a lower maximum response length, and each output token removed saves five times as much as an input token.
      option_rationales:
        a: The output costs $0.015 against $0.009 for the input, because each output token is priced five times higher.
        b: On-demand text models are billed per token, so a longer response costs more.
        c: The input is only $0.009 of the $0.024 total; the higher output price outweighs the larger input count.
        d: Removing 1,000 prompt tokens saves $0.003, while removing 1,000 response tokens saves $0.015.
        e: $0.060 would mean charging all 4,000 tokens at the output rate.
        f: $0.012 would mean charging all 4,000 tokens at the input rate.
        g: Temperature changes how tokens are sampled, not what each token costs.
        h: Halving the response saves 500 x $15 per million, or $0.0075, while trimming the prompt saves only 1,000 x $3 per million, or $0.003.
        i: Every generated output token is billed, however generation stops.
        j: Input at $0.009 plus output at $0.015 gives $0.024 per request.
  - id: aif-gen45
    domain: genai-fundamentals
    question: A startup in Kenya runs its application in the AWS Region closest to its customers and finds that the foundation model it has chosen is not offered In-Region there on Amazon Bedrock. Company policy allows prompts to be processed in other countries. How can the team use the model without moving the application?
    answer_type: single
    options:
      - id: a
        text: Call the model through a global cross-Region inference profile, if the model's Regional availability lists one for that source Region
      - id: b
        text: Call the model by its plain In-Region model ID, and Amazon Bedrock will forward the request to a Region that has it
      - id: c
        text: Buy Provisioned Throughput in the current Region, which makes any model available there
      - id: d
        text: Request a service quota increase for the model in the current Region
      - id: e
        text: Ask AWS Support to install a copy of the model in that Region for the account
      - id: f
        text: Wait for Amazon Bedrock to replicate the model into the Region automatically after the first failed request
      - id: g
        text: Place Amazon CloudFront in front of Amazon Bedrock to cache the model at a nearby edge location
      - id: h
        text: Send the model requests to the Amazon Bedrock endpoint in another Region where the model is offered In-Region
      - id: i
        text: Switch the requests to the Flex service tier, which serves every model in every Region
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Model availability on Amazon Bedrock varies by Region, and the Regional availability page shows for each model whether it is offered In-Region, through a geographic cross-Region profile, or through a global profile. When a model is not offered In-Region, the application can call another Region's endpoint or use a cross-Region profile, and both options mean prompts are processed outside the source Region. That is acceptable only because this policy allows it; a workload that must stay in one Region or geography needs an In-Region model or a geographic profile that stays inside the boundary.
      option_rationales:
        a: A global profile routes requests from the source Region to Regions where the model runs, and the policy permits processing abroad.
        b: An In-Region request is processed only in the Region specified, so it cannot reach a model that is not offered there.
        c: Provisioned Throughput buys capacity for a model already offered in a Region; it does not bring a new model to it.
        d: A quota raises limits on a model that is available; it cannot make an unavailable model appear.
        e: AWS decides where each model is offered; Support does not install models in a Region for one account.
        f: Bedrock does not copy models into a Region in response to failed calls.
        g: CloudFront caches web content at the edge and cannot host or run a foundation model.
        h: An application can call the Bedrock endpoint of any Region where the model is offered, and the policy allows the prompts to be processed there.
        i: Service tiers change priority and price for a model in a Region, not where the model is offered.
