        c: The file names are stock numbers, so the typed words never match them.
        d: Furniture photos contain little or no printed text, so there is nothing useful for Textract to extract.
        e: A multimodal embedding model puts text and images in one shared space, so the vectors of a description and a matching photo end up close together.
        f: Top-k tunes token sampling in text generation; it neither reads photos nor searches a catalog.
        g: One-hot pixel colors carry no meaning and cannot be compared with words.
        h: Cohere Embed v4 embeds both text and images into a single vector space, which makes text-to-image search possible.
