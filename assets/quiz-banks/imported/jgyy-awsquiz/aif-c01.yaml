    question: A property management startup hosts a model that estimates repair costs from a short web form. It is called a few hundred times on some days and not at all on others, with long idle gaps overnight and at weekends. Each user waits on the page for the estimate to come back in the response, but a few extra seconds on the first request after a quiet spell is acceptable. The team does not want to choose instance types, manage scaling, or pay for idle capacity. Which Amazon SageMaker AI inference option fits best?
    answer_type: single
    options:
      - id: a
        text: Serverless Inference
      - id: b
        text: A real-time endpoint on one instance kept running around the clock
      - id: c
        text: Batch transform on a nightly schedule
      - id: d
        text: Asynchronous inference, with each estimate written to Amazon S3 and announced through Amazon SNS
      - id: e
        text: A multi-model endpoint on always-on GPU instances
      - id: f
        text: A self-managed Amazon EC2 Auto Scaling group running the model container
      - id: g
        text: An endpoint that launches compute only when requests arrive, scales to zero when idle, and bills only for processing time
      - id: h
        text: An Amazon SageMaker HyperPod cluster sized for the busiest day
    accepted_correct_option_ids:
      - a
      - g
    author_notes:
      explanation: Serverless Inference provisions and scales compute automatically as requests arrive and scales the endpoint down to zero when there is no traffic, so the team chooses no instance types and pays only for the time spent processing requests. The trade-off is a possible cold start on the first request after an idle period, which is why AWS positions it for workloads with idle periods between traffic spurts that can tolerate cold starts.
      option_rationales:
        a: Serverless Inference is designed for intermittent, unpredictable traffic that can tolerate cold starts, with no instances to manage and no charge for idle time.
        b: An always-on instance bills every hour, including the nights and weekends when nobody calls the model.
        c: A nightly batch job cannot return an estimate to a user who is waiting on the web form.
        d: Asynchronous inference returns results later through Amazon S3, but here each user waits for the estimate in the same request.
        e: A multi-model endpoint still runs on provisioned instances that bill while idle, and GPUs add cost this small model does not need.
        f: Running your own Auto Scaling group means choosing instance types and managing scaling, which the team wants to avoid.
        g: This describes on-demand SageMaker AI Serverless Inference, which provisions compute per request, scales to zero between bursts, and charges only for processing time.
        h: HyperPod provides persistent clusters for large-scale training and inference that the team must size and pay for, the opposite of scaling to zero.
  - id: aif-ml28
    domain: ai-ml-fundamentals
    question: "A city's 311 service receives thousands of resident reports each day and wants a model that assigns every new report to one of six departments: roads, water, waste, parks, noise, or transit. It has 400,000 past reports, each labeled with the department that resolved it. Which type of machine learning problem is this?"
    answer_type: single
    options:
      - id: a
        text: Regression
      - id: b
        text: Unsupervised clustering of the reports
      - id: c
        text: Binary classification
      - id: d
        text: Multi-class classification
      - id: e
        text: Time-series forecasting
      - id: f
        text: Reinforcement learning with a reward signal
      - id: g
        text: Anomaly detection
      - id: h
        text: Supervised learning with a categorical label
      - id: i
        text: Dimensionality reduction
    accepted_correct_option_ids:
      - d
      - h
    author_notes:
      explanation: When the target is a category rather than a number and the training examples already carry the right answer, the task is supervised classification. With six possible departments it is multi-class classification, whereas binary classification chooses between exactly two classes, regression predicts a continuous value, and clustering groups records that have no labels.
      option_rationales:
        a: Regression predicts a continuous number, such as a cost or a duration, not a department name.
        b: Clustering discovers groups in unlabeled data, but here the departments are fixed in advance and every past report is already labeled.
        c: Binary classification chooses between exactly two classes, and this problem has six.
        d: Assigning each record to one of several predefined, mutually exclusive categories learned from labeled examples is multi-class classification.
        e: Forecasting projects a numeric series forward in time; the task here labels each individual report.
        f: Reinforcement learning learns from rewards through trial and error in an environment, not from a table of labeled reports.
        g: Anomaly detection flags rare, unusual records; every report here must be assigned to one of the normal departments.
        h: The labeled department is a categorical target with six possible values, so this is supervised learning of the multi-class classification kind.
        i: Dimensionality reduction compresses many input features into fewer and does not assign a label to anything.
  - id: aif-ml29
    domain: ai-ml-fundamentals
    question: A logistics company trains a simple linear model to predict whether a delivery route will run late. It reaches 64% accuracy on the training data and 62% on the test data, far below the 90% the business needs. Which TWO statements about this model are correct?
    answer_type: multi
    options:
      - id: a
        text: The model is overfitting, because its training and test scores are almost identical.
      - id: b
        text: "The model is underfitting: it has not captured the relationship between the inputs and the target."
      - id: c
        text: Adding more informative features or switching to a more flexible model is likely to help.
      - id: d
        text: Because training and test accuracy are close, the model generalizes well and is ready for production.
      - id: e
        text: The model has high variance, so stronger regularization is the recommended fix.
      - id: f
        text: The model has high bias, which is why it performs poorly even on the data it was trained on.
      - id: g
        text: Removing features to simplify the model further is the most likely way to reach 90%.
      - id: h
        text: Reducing the amount of regularization, so the model can fit the data more closely, is likely to help.
      - id: i
        text: High bias here means the model treats one demographic group unfairly, so a fairness audit is the fix.
      - id: j
        text: Stopping training earlier, before the model sees every epoch, will raise both scores.
      - id: k
        text: Training for more passes (epochs) over the existing data may help the model fit better.
    accepted_correct_option_ids:
      - b
      - c
      - f
      - h
      - k
    author_notes:
      explanation: "Poor accuracy on the training data as well as the test data is the signature of underfitting, also described as high bias: the model is too simple, or has too few useful features, to capture the real pattern. Its opposite in the bias-variance trade-off is overfitting, or high variance, where strong training scores sit alongside weak test scores. Underfitting is addressed by increasing model flexibility, for example by adding informative features, using a more expressive algorithm, reducing regularization, or training for more epochs."
      option_rationales:
        a: Overfitting shows a large gap between strong training scores and weak test scores; here both scores are poor, which points the other way.
        b: Weak accuracy even on the training data means the model has not learned the underlying pattern, which is underfitting.
        c: Too few informative features, or a model too simple for the relationship, are common causes of underfitting, so richer features or a more flexible algorithm address it directly.
        d: Similar scores only show consistency; both are far below target, so the model is consistently wrong rather than ready.
        e: High variance describes overfitting, and adding regularization would constrain an already underpowered model even further.
        f: "An underfit model exhibits high bias: its simplifying assumptions make it inaccurate on training and test data alike."
        g: Simplifying an underfit model reduces its flexibility further and usually lowers accuracy rather than raising it.
        h: Regularization penalizes complexity, so relaxing it lets an underfit model capture more of the real relationship.
        i: In the bias-variance trade-off, bias is a statistical error caused by overly simple assumptions, not the fairness concept of treating groups unequally.
        j: Stopping early is a remedy for overfitting; cutting training short leaves an underfit model even less trained.
        k: An underfit model may not have trained long enough, and more passes over the existing data can help it fit the pattern.
  - id: aif-ml30
    domain: ai-ml-fundamentals
    question: A factory trains a model to flag defective circuit boards from test readings. Only about 1 board in 200 is defective, so a model that passes every board would score 99.5% accuracy. Missing a defect and scrapping a good board are both costly, and the team wants one number that reflects both kinds of error at the threshold the production line will use. Which metric should it report?
    answer_type: single
    options:
      - id: a
        text: Accuracy
      - id: b
        text: The F1 score
      - id: c
        text: Precision on its own
      - id: d
        text: Recall on its own
      - id: e
        text: Root mean squared error (RMSE)
      - id: f
        text: Specificity
      - id: g
        text: Area under the ROC curve (AUC)
      - id: h
        text: The harmonic mean of precision and recall
      - id: i
        text: R-squared
    accepted_correct_option_ids:
      - b
      - h
    author_notes:
      explanation: The F1 score is the harmonic mean of precision and recall, so it stays high only when the model both finds the defective boards (few false negatives) and avoids flagging good ones (few false positives). On heavily imbalanced data, accuracy is dominated by the majority class, which is why a model that never flags a defect can still look 99.5% accurate.
      option_rationales:
        a: With 199 good boards for every defective one, a model that never flags anything scores 99.5% accuracy while catching no defects, so accuracy hides the problem.
        b: F1 combines precision and recall into one score at the chosen threshold and drops sharply if either kind of error is frequent, which suits a rare positive class.
        c: Precision tracks false alarms only; a model that flags a single obvious defect can score perfect precision while missing almost all the others.
        d: Recall tracks missed defects only; flagging every board gives perfect recall while scrapping all the good ones.
        e: RMSE measures the size of errors in a continuous prediction, not the balance of false positives and false negatives in a pass or fail decision.
        f: Specificity measures how many good boards are correctly passed and ignores the defects the model misses.
        g: AUC summarizes ranking quality across every possible threshold, so it does not describe the errors at the one threshold the line will run, and it does not use precision.
        h: Because a harmonic mean is pulled toward the lower of the two values, this score is high only when precision and recall are both high.
        i: R-squared measures explained variance in a regression model and does not apply to a pass or fail classifier.
  - id: aif-ml31
    domain: ai-ml-fundamentals
    question: A lender has two candidate binary classifiers that each output a probability that an applicant will default. The credit policy team has not yet chosen the probability cut-off above which applications are declined and expects to change it every quarter. Which metric compares how well the two models separate defaulters from non-defaulters across every possible cut-off?
    answer_type: single
    options:
      - id: a
        text: Area under the ROC curve (AUC)
      - id: b
        text: The F1 score at a 0.5 cut-off
      - id: c
        text: Accuracy at a 0.5 cut-off
      - id: d
        text: Precision at the cut-off used last quarter
      - id: e
        text: Root mean squared error (RMSE)
      - id: f
        text: The training loss at the final epoch
      - id: g
        text: The area under a curve of true positive rate plotted against false positive rate over all thresholds
      - id: h
        text: A confusion matrix of predicted against actual outcomes at a 0.5 cut-off
      - id: i
        text: R-squared
    accepted_correct_option_ids:
      - a
      - g
    author_notes:
      explanation: The ROC curve plots the true positive rate against the false positive rate as the classification threshold moves, and AUC, the area under it, aggregates performance across all possible thresholds into one number, where 1 is perfect and 0.5 is no better than random guessing. Metrics such as F1, precision, and accuracy are each computed at one chosen threshold, so they cannot fairly compare models before the cut-off is fixed.
      option_rationales:
        a: AUC summarizes performance over all thresholds, so it can compare the two models before any cut-off is chosen.
        b: F1 is calculated at one threshold; a different cut-off next quarter would give a different score and could reverse the comparison.
        c: Accuracy depends on the chosen cut-off and is also inflated when defaults are rare.
        d: Precision is tied to a single cut-off, and the policy team has not settled on the one that will be used.
        e: RMSE measures the error of a continuous prediction; it is a regression metric, not a threshold-free comparison of classifiers.
        f: Training loss shows how well each model fit its own training data, not how well it separates the classes on unseen data across thresholds.
        g: This is the ROC curve, and its area gives one threshold-independent score for comparing classifiers.
        h: A confusion matrix counts outcomes at one specific threshold, so it describes a single operating point rather than every possible cut-off.
        i: R-squared measures explained variance in regression and does not evaluate a probability-based classifier.
  - id: aif-ml32
    domain: ai-ml-fundamentals
    question: An online secondhand marketplace lets sellers upload photos with each listing. The company wants every photo checked automatically for explicit or violent content before the listing goes live, using a pretrained AWS service so that it does not have to collect training data or build a model. Which service fits?
