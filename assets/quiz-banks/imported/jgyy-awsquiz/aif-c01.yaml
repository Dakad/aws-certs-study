  - id: aif-ml37
    domain: ai-ml-fundamentals
    question: A data scientist at an online grocer is preparing a churn model and lists the tasks done so far. Which TWO of these tasks are feature engineering, as opposed to exploratory data analysis, data cleaning, or another stage of the ML lifecycle?
    answer_type: multi
    options:
      - id: a
        text: Plotting a histogram of each column and computing summary statistics to understand the data
      - id: b
        text: Calculating each customer's average basket value over the last 90 days from the raw order lines
      - id: c
        text: Removing customer records that were loaded twice by mistake
      - id: d
        text: One-hot encoding the "preferred payment method" column into separate binary columns
      - id: e
        text: Randomly splitting the records into training, validation, and test sets
      - id: f
        text: Using principal component analysis (PCA) to compress 300 clickstream columns into 20 components
      - id: g
        text: Running several training jobs to find the best learning rate
      - id: h
        text: Keeping only the 15 inputs with the highest feature importance scores and dropping the rest
      - id: i
        text: Measuring the trained model's F1 score on the held-out test set
      - id: j
        text: Exporting six months of raw order history from the transactional database to Amazon S3
      - id: k
        text: Binning customer age into ranges such as 18 to 24 and 25 to 34
    accepted_correct_option_ids:
      - b
      - d
      - f
      - h
      - k
    author_notes:
      explanation: Feature engineering selects and transforms the variables a model learns from, and AWS groups it into feature creation (for example calculated features, one-hot encoding, and binning), feature transformation, feature extraction such as PCA, and feature selection. Exploratory data analysis comes before it to understand the data, removing duplicates and splitting the data are data preprocessing, and tuning and evaluation belong to model development.
      option_rationales:
        a: Profiling distributions and summary statistics is exploratory data analysis, which informs feature engineering but does not create or change features.
        b: Calculating a new input from existing data is feature creation, one of the components of feature engineering.
        c: Removing duplicate records is data cleaning, part of data preprocessing.
        d: One-hot encoding turns a categorical column into numeric indicator features, and AWS lists it as a feature creation technique.
        e: Partitioning into training, validation, and test sets is a data preprocessing step that guards against overfitting and data leakage.
        f: Reducing many columns to a few components with PCA is feature extraction, the dimensionality reduction part of feature engineering.
        g: Searching for the best learning rate is hyperparameter tuning, part of model training.
        h: Choosing the subset of inputs that contributes most to the model's accuracy is feature selection.
        i: Scoring the trained model on held-out data is model evaluation, which comes after the features are engineered.
        j: Moving raw data into Amazon S3 is data collection and ingestion, which happens before any feature work.
        k: Binning a continuous value into ranges creates new categorical features, one of the feature creation techniques AWS lists.
  - id: aif-ml38
    domain: ai-ml-fundamentals
    question: A data scientist has a working XGBoost training job, but the model's validation AUC is disappointing. Rather than launching and comparing dozens of training jobs by hand, the data scientist wants Amazon SageMaker AI to try values of max_depth, eta, and alpha within specified ranges and keep the combination that produces the highest validation AUC. Which capability does this?
    answer_type: single
    options:
      - id: a
        text: Amazon SageMaker AI automatic model tuning
      - id: b
        text: Amazon SageMaker Feature Store
      - id: c
        text: Amazon SageMaker Model Registry
      - id: d
        text: Batch transform
      - id: e
        text: Amazon SageMaker Data Wrangler
      - id: f
        text: A hyperparameter tuning job that runs many training jobs over the specified ranges and ranks them by the objective metric
      - id: g
        text: Compiling the trained model with SageMaker Neo so it runs faster on the target hardware
      - id: h
        text: A larger training instance type for the existing job
      - id: i
        text: Amazon SageMaker JumpStart
    accepted_correct_option_ids:
      - a
      - f
    author_notes:
      explanation: Automatic model tuning, also called hyperparameter tuning, runs many training jobs on the dataset using the algorithm and the hyperparameter ranges you specify, and chooses the values that produce the best result on the objective metric you pick, such as validation AUC. It can search with Bayesian optimization, random search, grid search, or Hyperband, and completion criteria can stop the search once a quality target is met.
      option_rationales:
        a: Automatic model tuning searches the hyperparameter ranges you define by running training jobs and keeps the one with the best objective metric.
        b: Feature Store stores and serves feature values; it does not choose hyperparameters.
        c: Model Registry catalogs trained model versions and their approval status after training rather than searching for better settings.
        d: Batch transform runs inference on a stored dataset with a model that is already trained.
        e: Data Wrangler prepares and transforms training data; it does not run training jobs across hyperparameter ranges.
        f: This describes a SageMaker AI hyperparameter tuning job, which launches training jobs with different values and reports the best one by the chosen metric.
        g: Neo compiles a trained model to run more efficiently on target hardware and does not change its hyperparameters.
        h: A bigger instance may make one training job finish sooner, but it trains with the same hyperparameters and searches for nothing.
        i: JumpStart offers pretrained models and solution templates; it does not tune the hyperparameters of this XGBoost job.
  - id: aif-ml39
    domain: ai-ml-fundamentals
    question: A retail bank's credit risk models are built by hand in notebooks. Each data scientist runs the steps in a different order, nobody can reproduce the model that went live last quarter, and retraining takes weeks of manual work. Which TWO measures apply MLOps practices to fix this?
    answer_type: multi
    options:
      - id: a
        text: Define data preparation, training, evaluation, and model registration as an automated, versioned workflow in Amazon SageMaker Pipelines
      - id: b
        text: Ask one senior data scientist to retrain the models by hand whenever accuracy complaints arrive
      - id: c
        text: Log every training run's parameters, metrics, and artifacts to managed MLflow in Amazon SageMaker AI so runs can be compared and reproduced
      - id: d
        text: Deploy each new model straight to production without an evaluation step so improvements reach customers sooner
      - id: e
        text: Keep the pipeline code and infrastructure definitions in version control and release changes through a CI/CD pipeline
      - id: f
        text: Move to larger notebook instances so the manual steps finish faster
      - id: g
        text: Start the retraining pipeline automatically with Amazon EventBridge on a schedule or when new data lands in Amazon S3
      - id: h
        text: Train each model once and never retrain it, so production behavior stays the same
      - id: i
        text: Give every data scientist administrator access so they can change production models directly
      - id: j
        text: Stop recording experiment details so the team spends its time on training instead
    accepted_correct_option_ids:
      - a
      - c
      - e
      - g
    author_notes:
      explanation: "MLOps applies DevOps practices to machine learning: every step from data preparation to deployment runs as automated, versioned code so the process is repeatable, experiments are tracked so any model can be reproduced, and pipeline runs start when source data or code changes. On AWS, SageMaker Pipelines orchestrates the workflow, managed MLflow in SageMaker AI tracks experiments, CI/CD tooling releases pipeline changes, and Amazon EventBridge can start pipeline runs on a schedule or on events such as a new file in Amazon S3."
      option_rationales:
        a: A pipeline runs the same steps in the same order every time and versions each execution, which removes the inconsistency of hand-run notebooks.
        b: Manual, person-dependent retraining is exactly the slow, unrepeatable process that MLOps replaces with automation.
        c: Experiment tracking records how each model was produced, so results can be compared and last quarter's model can be rebuilt.
        d: MLOps adds automated validation before deployment; skipping evaluation raises the risk of shipping a worse model.
        e: Treating pipelines and infrastructure as versioned code released through CI/CD is the DevOps foundation that MLOps builds on.
        f: Faster notebooks speed up the manual steps but leave them unrepeatable and untracked.
        g: MLOps calls for starting pipeline runs when data changes, and SageMaker Pipelines is a supported EventBridge target for scheduled or event-driven runs.
        h: Customer behavior changes over time, so a model that is never retrained degrades; MLOps makes retraining routine rather than avoiding it.
        i: Broad administrator access removes controls and auditability, the opposite of a governed, repeatable release process.
        j: Dropping experiment records makes models impossible to reproduce, which is the problem the team already has.
  - id: aif-gen1
    domain: genai-fundamentals
    question: A developer is estimating the monthly bill for a summarization feature that calls a large language model on Amazon Bedrock, where on-demand pricing charges per input token and per output token. What is a token?
    answer_type: single
    options:
      - id: a
        text: A word or part of a word that the model handles as one unit
      - id: b
        text: A single character of the prompt
      - id: c
        text: One complete request to the model, however long the text is
      - id: d
        text: A numeric vector that captures the meaning of a sentence
      - id: e
        text: A temporary security credential issued by AWS STS
      - id: f
        text: One layer of the model's neural network
      - id: g
        text: An API key that authorizes the Bedrock call
      - id: h
        text: A unit of text from the model's fixed vocabulary
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Models break text into tokens, each roughly a word or a fragment of a word, and on-demand Bedrock pricing counts both the tokens sent in the prompt and the tokens generated in the response, so prompt length affects cost as much as response length.
      option_rationales:
        a: A token is the unit of text the model processes, typically a short word or a word fragment.
        b: Tokenizers usually group several characters together, so a token is larger than one character.
        c: Billing is per token, not per request, which is why long prompts cost more than short ones.
        d: A numeric vector that captures meaning is an embedding, a different concept from a token.
        e: STS issues credentials for authentication; it has nothing to do with how text is counted.
        f: Layers are part of the model architecture and are not what the service meters.
        g: An API key or IAM credential authorizes the call; the token count measures the text in it.
        h: A model splits text into entries from the fixed vocabulary it was trained with, and each of those entries, typically a word or a piece of a word, is one token.
  - id: aif-gen2
    domain: genai-fundamentals
    question: A team converts each product description into a list of 1,024 floating point numbers, arranged so that descriptions with similar meaning sit close together in that numeric space. What are these numeric representations called?
    answer_type: single
    options:
      - id: a
        text: Embeddings
      - id: b
        text: Tokens
      - id: c
        text: One-hot encodings
      - id: d
        text: Model weights
      - id: e
        text: Hyperparameters
      - id: f
        text: Model checkpoints
      - id: g
        text: Prompt templates
      - id: h
        text: Dense vectors
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: An embedding is a dense vector that represents text, an image, or another input so that distance between vectors reflects similarity in meaning; embedding models such as Amazon Titan Text Embeddings and Cohere Embed produce them.
      option_rationales:
        a: "Embeddings are exactly this: vectors positioned so that semantically similar inputs are near each other."
        b: Tokens are the chunks of text fed to the model, not the vector that represents their meaning.
        c: A one-hot encoding is a sparse vector with a single 1 per category and carries no notion of similarity.
        d: Model weights are the learned parameters inside the model, not a representation of one input.
        e: Hyperparameters are settings chosen before training, such as learning rate or batch size.
        f: A checkpoint is a saved copy of a model's state during or after training.
        g: A prompt template is reusable text with placeholders, not a numeric representation.
        h: A fixed-length list of floating point values positioned by meaning is a dense vector, which is the form a semantic embedding takes.
  - id: aif-gen3
    domain: genai-fundamentals
    question: An analyst pastes a 200-page contract into a single prompt and the model rejects the request because the input is too long. Which model characteristic does this limit describe?
    answer_type: single
    options:
      - id: a
        text: The context window, which is the maximum number of tokens the model can take in and generate for one request
      - id: b
        text: The temperature setting
      - id: c
        text: The knowledge cutoff date of the training data
      - id: d
        text: The requests-per-minute service quota
      - id: e
        text: The number of parameters in the model
      - id: f
        text: The dimension of the model's embeddings
      - id: g
        text: The top-k value used during sampling
      - id: h
        text: The model's maximum sequence length
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: The context window, also called the maximum sequence length, is the fixed token budget a model can attend to in one call, covering the prompt and the generated response together; oversized input must be split into smaller pieces or sent to a model with a larger window.
      option_rationales:
        a: Exceeding the token budget for a single request is precisely a context window limit.
        b: Temperature changes how randomly tokens are sampled and has no effect on how much text fits.
        c: A knowledge cutoff limits what the model knows about, not how much text it can read at once.
        d: A requests-per-minute quota throttles how often you can call the model, not the size of one call.
        e: Parameter count describes model size; a large model can still have a small context window.
        f: Embedding dimension is the length of a vector produced by an embedding model.
        g: Top-k restricts which candidate tokens are sampled and does not change the input limit.
        h: Maximum sequence length is the most tokens the model can process in one pass, so an oversized contract exceeds it and is rejected.
  - id: aif-gen4
    domain: genai-fundamentals
    question: A bank's case summarizer must produce the most consistent and focused wording it can for the same input, avoiding creative rephrasing. Which inference parameter change best supports that goal?
    answer_type: single
    options:
      - id: a
        text: Lower the temperature
      - id: b
        text: Raise the temperature
      - id: c
        text: Raise top-p toward 1.0
      - id: d
        text: Raise top-k to a much larger value
      - id: e
        text: Increase the maximum response length
      - id: f
        text: Add more stop sequences
      - id: g
        text: Choose a model with a larger context window
      - id: h
        text: Set top-k to 1
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Temperature scales the probability distribution the model samples from, so a low value concentrates probability on the most likely tokens and yields focused, repeatable wording; setting top-k to 1 goes further by always choosing the single most likely token.
      option_rationales:
        a: A lower temperature makes the highest-probability tokens far more likely, giving consistent, conservative output.
        b: Raising temperature increases randomness, which is the opposite of what a summarizer needs here.
        c: A top-p near 1.0 admits almost the whole distribution, so more unusual tokens can be sampled.
        d: A larger top-k widens the candidate pool and therefore increases variety.
        e: Maximum response length caps how long the answer may be; it does not affect word choice.
        f: Stop sequences end generation at a marker; they do not make the wording more consistent.
        g: A larger context window lets you send more input and says nothing about output consistency.
        h: With top-k set to 1 the model always picks the single most likely token, which is greedy decoding and gives the most repeatable wording.
  - id: aif-gen5
    domain: genai-fundamentals
    question: A developer wants the model to sample only from the smallest set of next tokens whose probabilities add up to 0.9. Which inference parameter does this?
    answer_type: single
    options:
      - id: a
        text: Top-p
      - id: b
        text: Top-k
      - id: c
        text: Temperature
      - id: d
        text: Maximum response length
      - id: e
        text: Stop sequences
      - id: f
        text: Number of provisioned model units
      - id: g
        text: Nucleus sampling
      - id: h
        text: Frequency penalty
    accepted_correct_option_ids:
      - a
      - g
    author_notes:
      explanation: Top-p, also called nucleus sampling, keeps the shortest list of candidate tokens whose cumulative probability reaches the given value, so the size of the candidate set changes with the model's confidence; top-k instead keeps a fixed number of candidates regardless of their probabilities.
      option_rationales:
        a: Top-p is defined by a cumulative probability threshold, exactly as described.
        b: Top-k keeps a fixed count of the most likely tokens, not a probability total.
        c: Temperature reshapes the whole distribution rather than truncating it at a probability sum.
        d: Maximum response length limits output tokens and has no role in choosing candidates.
        e: Stop sequences tell the model where to stop generating text.
        f: Model units are a Provisioned Throughput capacity setting, not an inference parameter.
        g: Nucleus sampling is the other name for top-p, which keeps the smallest set of tokens whose cumulative probability reaches the threshold.
        h: A frequency penalty lowers the likelihood of tokens that have already appeared rather than truncating candidates at a probability total.
  - id: aif-gen6
    domain: genai-fundamentals
    question: Why did transformer-based architectures largely replace earlier recurrent networks for large language models?
    answer_type: single
    options:
      - id: a
        text: Self-attention lets the model weigh how every token in the input relates to every other token and process them in parallel, so training scales to huge corpora and long-range context is preserved
      - id: b
        text: Transformers process one token at a time in strict order, which trains faster than parallel designs
      - id: c
        text: Transformers need no training data, because attention is a hand-written rule set
      - id: d
        text: Transformers remove the need for accelerated hardware such as GPUs
      - id: e
        text: Transformers store the training corpus verbatim and look up the matching answer
      - id: f
        text: Transformers train only on labeled data, which is why they are more accurate
      - id: g
        text: Transformers return the identical output for the same input every time
      - id: h
        text: Without recurrence, all positions in a sequence can be trained in parallel, which made scaling to huge datasets practical
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: The transformer's attention mechanism computes relationships between all positions in a sequence at once, which removes the sequential bottleneck of recurrent networks, allows massive parallel training, and keeps distant context available.
      option_rationales:
        a: Parallel processing plus attention over the whole sequence is the transformer's defining advantage.
        b: Strictly sequential processing is the recurrent network behavior that transformers avoid.
        c: Transformers are trained statistically on very large text corpora; attention weights are learned.
        d: Training and serving large transformers is hardware-hungry and usually needs GPUs or custom accelerators.
        e: Models learn statistical patterns rather than storing a retrievable copy of the corpus.
        f: Pre-training uses vast amounts of unlabeled text; labels are only used for later customization.
        g: Sampling makes generative output vary between calls unless decoding is heavily constrained.
        h: Dropping step-by-step recurrence allows parallel computation across the sequence on accelerators, which is what made training on web-scale corpora feasible.
  - id: aif-gen7
    domain: genai-fundamentals
    question: A marketing team wants a model that creates original product imagery from a written description. Which model family is designed for this, and how does it work at a high level?
    answer_type: single
    options:
      - id: a
        text: A diffusion model, which starts from random noise and removes the noise step by step, guided by the text prompt, until an image emerges
      - id: b
        text: A large language model, which predicts the next word in a sequence of text
      - id: c
        text: A convolutional image classifier, which assigns each image one category label
      - id: d
        text: A linear regression model, which fits a line through labeled pixels
      - id: e
        text: A k-means clustering model, which groups similar images together
      - id: f
        text: A recurrent network, which converts recorded speech into text
      - id: g
        text: A decision tree, which splits pixels on threshold rules
      - id: h
        text: A generative adversarial network, where a generator creates images and a discriminator judges their realism
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: Text-to-image generation is done mainly by diffusion models, which learn to reverse a noising process and are steered by the prompt while denoising, and also by generative adversarial networks; Amazon Nova Canvas and Stability AI's Stable Diffusion models are available through the Amazon Bedrock API.
      option_rationales:
        a: Iterative denoising from random noise, conditioned on a prompt, is how diffusion image models work.
        b: A language model generates text; it does not produce pixels.
        c: A classifier labels an existing image and creates nothing new.
        d: Linear regression predicts a number from features and cannot synthesize an image.
        e: Clustering groups existing images without generating any.
        f: Speech-to-text converts audio into words, which is a different task entirely.
        g: A decision tree makes rule-based predictions and has no generative capability.
        h: Generative adversarial networks pit a generator against a discriminator and can create realistic images from text prompts.
  - id: aif-gen8
    domain: genai-fundamentals
    question: A logistics company wants one model that can accept a photograph of a damaged pallet together with a written question about it and answer in text. Which kind of model is needed?
