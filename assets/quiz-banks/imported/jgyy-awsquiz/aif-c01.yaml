  - id: aif-ml33
    domain: ai-ml-fundamentals
    question: A regional airline wants one bot for its website chat and its phone line that lets travelers change a booking. The bot must work out what the traveler wants, such as changing a flight, prompt for any missing details such as the booking reference and new travel date, and then call an AWS Lambda function to make the change. Which AWS service is designed for this?
    answer_type: single
    options:
      - id: a
        text: Amazon Polly
      - id: b
        text: Amazon Lex
      - id: c
        text: A managed service that converts each caller's speech into a text transcript
      - id: d
        text: Amazon Comprehend
      - id: e
        text: Amazon Translate
      - id: f
        text: Amazon Rekognition
      - id: g
        text: Amazon Textract
      - id: h
        text: A conversational AI service in which each intent has slots that the bot prompts the user to fill
      - id: i
        text: Amazon Personalize
    accepted_correct_option_ids:
      - b
      - h
    author_notes:
      explanation: Amazon Lex builds conversational interfaces for voice and text using automatic speech recognition and natural language understanding. An intent represents an action the user wants to perform, recognized from sample utterances, and slots are the details the bot prompts for until every required value is supplied, after which the intent is fulfilled, typically by an AWS Lambda function.
      option_rationales:
        a: Polly turns text into speech; it could voice a bot's replies but does not recognize intents or manage the dialog.
        b: Lex recognizes the traveler's intent, prompts for each required slot such as the booking reference, and hands the completed request to Lambda for fulfillment.
        c: Speech-to-text, the job of Amazon Transcribe, produces a transcript but does not recognize intents, hold a conversation, or collect missing details.
        d: Comprehend extracts entities, key phrases, and sentiment from text, but it has no dialog management to prompt for missing values.
        e: Translate converts text between languages and does not understand or fulfill requests.
        f: Rekognition analyzes images and video, which this bot does not involve.
        g: Textract extracts text and form data from documents and plays no part in a conversation.
        h: "This describes Amazon Lex: intents capture what the user wants to do, and slots are the details the bot keeps asking for until the request can be fulfilled."
        i: Personalize generates recommendations from interaction data and cannot run a conversation.
