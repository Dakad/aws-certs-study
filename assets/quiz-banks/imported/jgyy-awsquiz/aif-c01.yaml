      - id: c
        text: Hyperparameters and parameters are two names for the same values.
      - id: d
        text: Hyperparameters are used only at inference time.
      - id: e
        text: Parameters must be set by hand for every prediction request.
      - id: f
        text: Hyperparameters are the model artifacts written to Amazon S3 when training finishes.
      - id: g
        text: Parameters are the instance type and instance count of the training cluster.
      - id: h
        text: Hyperparameters are external settings given to the training job, while parameters are internal values fitted to the data.
    accepted_correct_option_ids:
