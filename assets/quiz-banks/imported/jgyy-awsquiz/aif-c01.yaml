  - id: aif-gen13
    domain: genai-fundamentals
    question: A legal team tests an assistant built on a foundation model and finds that it cites a court case that does not exist, stated with complete confidence. What is this behavior, and what does it imply for the design?
    answer_type: single
    options:
      - id: a
        text: "A hallucination: the model can generate fluent content that is simply untrue, so output used in a regulated process must be grounded in trusted sources and reviewed by a person"
      - id: b
        text: "Overfitting: the model memorized its training set, so it needs more training epochs"
      - id: c
        text: "Data drift: the production data has moved away from the training data, so the endpoint must be scaled up"
      - id: d
        text: "A throttling error: the account needs a higher requests-per-minute quota"
      - id: e
        text: "Underfitting: the model is too small, so the context window must be enlarged"
      - id: f
        text: "Label leakage: the target value was present among the input features"
      - id: g
        text: "A cold start: the endpoint needs to warm up before its answers become accurate"
      - id: h
        text: "A confabulation: the model made up a plausible fact, so regulated use needs grounding in trusted sources and human review"
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: A hallucination, also called a confabulation, is confident, plausible-sounding output that is factually wrong; because the model optimizes for likely text rather than truth, high-risk uses need authoritative source material supplied with the request and human review of the result.
      option_rationales:
        a: Inventing a convincing but non-existent citation is the textbook example of a hallucination.
        b: Overfitting describes a model that performs well on training data and poorly on new data, and more epochs would worsen it.
        c: Drift concerns changing input distributions over time, not a fabricated fact in one answer.
        d: Throttling returns an error rather than a wrong answer.
        e: Underfitting means the model fails to capture patterns; the context window is unrelated to truthfulness.
        f: Label leakage is a supervised training data problem, not a generation behavior.
        g: Cold start affects latency on the first request, not factual accuracy.
        h: Confabulation is the term NIST and others use for confidently generated false content, the same failure as a hallucination.
  - id: aif-gen14
    domain: genai-fundamentals
    question: "A QA engineer raises a defect: sending the identical prompt to the identical foundation model twice returns two differently worded answers. What is the most accurate response?"
    answer_type: single
    options:
      - id: a
        text: This is expected behavior, because the model samples each next token from a probability distribution; lowering temperature and top-p makes responses far more consistent, though identical text is still not guaranteed
      - id: b
        text: The model is faulty and must be redeployed
      - id: c
        text: The model's knowledge cutoff has passed, so its answers change over time
      - id: d
        text: The account is being throttled, which silently truncates responses
      - id: e
        text: Two different model versions must be serving the traffic; nothing else can cause this
      - id: f
        text: The context window was exceeded, so the prompt was silently cut in half
      - id: g
        text: The model must be fine-tuned before it can return consistent answers
      - id: h
        text: This is expected from a probabilistic model, so tests should check meaning and format rather than exact wording
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: "Generative models are nondeterministic by design: the next token is sampled from a distribution, so wording varies between calls. Test suites therefore assert on meaning, format, or required content rather than exact string equality."
      option_rationales:
        a: Sampling explains the variation, and the decoding parameters control how much of it there is.
        b: Varying wording is normal model behavior and is not evidence of a broken deployment.
        c: The knowledge cutoff is fixed for a model version and does not change answers call by call.
        d: Throttling produces an explicit error rather than quietly reworded output.
        e: Even a single model version produces varied wording, so this is not the only possible cause.
        f: Exceeding the context window raises a validation error instead of silently truncating.
        g: Fine-tuning changes style and task behavior but does not remove sampling randomness.
        h: Sampled output naturally varies in wording, so the right fix is to change the test's assertions rather than treat the variation as a defect.
  - id: aif-gen15
    domain: genai-fundamentals
    question: A support assistant built on a foundation model gives wrong details about a product the company launched last month, although it answers questions about older products correctly. What is the most likely explanation?
    answer_type: single
    options:
      - id: a
        text: The model's training data has a cutoff date, so it never saw the new product; the application has to supply those facts with the request or use a model customized with them
      - id: b
        text: The temperature is set too low, which removes recent facts
      - id: c
        text: The context window is too large, which dilutes the answer
      - id: d
        text: The model is overfitted to the new product
      - id: e
        text: The model needs Provisioned Throughput before it can answer accurately
      - id: f
        text: Tokenization has failed for the product name
      - id: g
        text: The embedding dimension is too small for recent data
      - id: h
        text: The launch postdates the training data, so the model has to be given those facts
    accepted_correct_option_ids:
      - a
      - h
    author_notes:
      explanation: A foundation model only knows what was in its training corpus up to its knowledge cutoff, so anything newer must be provided at request time or added through customization; the model will otherwise answer from stale or invented knowledge.
      option_rationales:
        a: A knowledge cutoff is exactly why a model is confidently wrong about very recent events.
        b: Temperature controls randomness of wording and cannot add facts the model never saw.
        c: A larger context window is a capacity to send more input, never a cause of wrong facts.
        d: Overfitting requires the model to have trained on the product, which is the opposite of the situation.
        e: Provisioned Throughput buys capacity; it has no effect on what the model knows.
        f: Tokenization handles unfamiliar words routinely by splitting them into sub-word pieces.
        g: Embedding dimension is a property of embedding models and unrelated to training recency.
        h: The model learned nothing after its training data was collected, so newer product facts have to be supplied with the request or through customization.
