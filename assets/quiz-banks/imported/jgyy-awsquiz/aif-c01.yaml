      explanation: Cross-Region inference sends requests through an inference profile that can route each one to any of several Regions, which raises the throughput available during peaks with no extra routing charge. A geographic profile (such as US, EU, or APAC) keeps processing inside that geography, which suits data residency rules, while a global profile can route to supported commercial Regions anywhere and suits workloads with no residency constraint.
      option_rationales:
        a: The EU geographic profile draws on capacity in several EU Regions, easing the throttling while keeping processing inside the EU.
        b: A global profile can send prompts to Regions outside the EU, which breaks the insurer's residency policy.
        c: Provisioned Throughput is dedicated capacity bought for a term, which the team has ruled out.
        d: Processing claims data in a US Region breaks the EU-only policy.
        e: Batch inference returns results asynchronously, which does not work for an interactive assistant.
        f: CloudFront caches and delivers web content; it adds no model capacity and cannot reuse unique generated answers.
        g: Temperature affects how varied the wording is, not how many requests the account can send.
        h: Using the EU profile ID in place of the Frankfurt model ID is how cross-Region inference is turned on, and the EU profile only routes to EU Regions.
        i: S3 replication copies stored objects between buckets; it adds no model capacity, and no other Region serves the model calls because of it.
  - id: aif-gen40
