  - id: aif-gen41
    domain: genai-fundamentals
    question: A travel company has fine-tuned a model on Amazon Bedrock with 20,000 past itinerary descriptions so that it writes in the house style. The finance lead now asks what owning that custom model will cost over the coming year. Which statement is accurate?
    answer_type: single
    options:
      - id: a
        text: The custom model brings a training charge per token processed, a monthly fee to store it, and the cost of serving it
      - id: b
        text: Fine-tuning on Amazon Bedrock has no training charge; only the Amazon S3 storage for the training data is billed
      - id: c
        text: A fine-tuned model is billed only for the hours it spends training and is then free to invoke in production
      - id: d
        text: Deleting the training data from Amazon S3 after the job ends removes every ongoing charge for the custom model
      - id: e
        text: Fine-tuning is billed as a flat monthly subscription, whatever the size of the dataset or the number of epochs
      - id: f
        text: Serving the custom model runs through Provisioned Throughput or, for supported models, an on-demand custom model deployment, and that inference is billed
      - id: g
        text: Once fine-tuned, the model keeps learning from new descriptions automatically at no extra cost
      - id: h
        text: Each call to the custom model is billed at one flat fee per request, however many tokens it reads or writes
      - id: i
        text: Custom models are stored free of charge for as long as the account stays open
      - id: j
        text: Retraining the custom model whenever the house style or the source data changes incurs the training charge again
    accepted_correct_option_ids:
      - a
      - f
      - j
    author_notes:
      explanation: "A custom model on Amazon Bedrock brings three kinds of charge: training, billed by the tokens in the training data multiplied by the number of epochs; a monthly fee for storing the custom model; and inference, which runs through Provisioned Throughput or, for supported models, an on-demand custom model deployment. None of these ends when training finishes, and every retraining run to follow a new house style or new data is billed again, which is why teams weigh that total against the per-request token cost of prompting a base model instead."
      option_rationales:
        a: Training, monthly storage, and serving are the three cost elements a custom model adds.
        b: Model customization is billed per token processed during training, in addition to any S3 storage.
        c: Inference on a custom model is charged too, through Provisioned Throughput hours or on-demand token pricing.
        d: The training data is only an input to the job; the stored custom model and its serving are billed whether or not that data is kept.
        e: The training charge scales with the tokens processed, so a larger dataset or more epochs cost more.
        f: A custom model has to be served through Provisioned Throughput or, where supported, an on-demand custom model deployment, and either way its inference is charged.
        g: A custom model is fixed once trained; new data only reaches it through another paid customization job.
        h: Custom model inference is billed by Provisioned Throughput hours or by tokens on an on-demand deployment, not by a flat fee per request.
        i: Custom model storage is a monthly charge for each model kept in the account.
        j: A fine-tuned model captures the data it was trained on, so changes to the style or source data mean paying for another training job.
  - id: aif-gen42
