  - id: aif-ra3
    domain: responsible-ai
    question: A company is launching a customer-facing assistant. Legal asks that every user be told plainly that they are talking to an AI system, and that the published help pages describe what the assistant is meant to be used for and where it should not be relied on. Which AWS responsible AI dimension are these measures serving?
    answer_type: single
    options:
      - id: a
        text: "Transparency: enabling stakeholders to make informed choices about their engagement with an AI system"
      - id: b
        text: "Explainability: understanding and evaluating the reasons behind an individual system output"
      - id: c
        text: "Veracity and robustness: achieving correct outputs even with unexpected or adversarial inputs"
      - id: d
        text: "Controllability: having mechanisms to monitor and steer AI system behaviour"
      - id: e
        text: "Privacy and security: obtaining, using, and protecting data and models appropriately"
      - id: f
        text: "Fairness: considering the impact of the system on different groups of stakeholders"
      - id: g
        text: "Safety: reducing harmful system output and misuse"
