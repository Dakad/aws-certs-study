  - id: aif-ml35
    domain: ai-ml-fundamentals
    question: A consumer electronics company machine-translates its English support articles into Japanese, German, and Portuguese. Product names such as "KiraSound Pro" keep coming back translated literally or inconsistently. The team wants the translation service itself to render each product name the way the company specifies, with the least effort. What should it use?
    answer_type: single
    options:
      - id: a
        text: Amazon Translate with a custom terminology that maps each product name to the form it must take in each target language
      - id: b
        text: Amazon Transcribe with a custom vocabulary of the product names
      - id: c
        text: Amazon Polly with a pronunciation lexicon for the product names
      - id: d
        text: Amazon Comprehend custom entity recognition trained on the product names
      - id: e
        text: A new neural machine translation model trained from scratch in Amazon SageMaker AI
      - id: f
        text: Amazon Textract queries that extract the product names from each article
      - id: g
        text: A terminology file in CSV, TSV, or TMX format, uploaded to Amazon Translate and named in each translation request
      - id: h
        text: Amazon Lex slot types that list every product name
      - id: i
        text: Editors who correct the product names by hand in every translated article
    accepted_correct_option_ids:
      - a
      - g
    author_notes:
      explanation: Amazon Translate custom terminology lets a company upload a terminology file that lists source terms, such as brand and product names, with the translation required in each target language, and then apply it to translation requests. When Translate finds a matching term in the source text, it uses the translation from the terminology file, weighing the surrounding context, so no custom translation model has to be built.
      option_rationales:
        a: Custom terminology is the Amazon Translate feature built for brand names, product names, and other terms that must come out the way the company specifies.
        b: A Transcribe custom vocabulary improves speech recognition of unusual words; it has no effect on text translation.
        c: A Polly lexicon controls how words are pronounced in synthesized speech, not how they are translated.
        d: Custom entity recognition can find product names in text, but Comprehend does not translate anything.
        e: Building a translation model from scratch needs very large parallel datasets and ML expertise, the opposite of least effort when a managed feature already solves this.
        f: Textract extracts text from scanned documents and plays no part in translation.
        g: A custom terminology file pairs each source term with its required translation per language; once uploaded, it is referenced in translation requests so Translate uses those forms.
        h: Lex slot types define the values a chatbot collects in a conversation and do not influence translation output.
        i: Hand-correcting every translated article repeats the work on each run and is far more effort than a reusable terminology file.
  - id: aif-ml36
