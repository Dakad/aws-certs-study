        c: Explainability would mean accounting for individual outputs, which this requirement does not ask for.
        d: Fairness concerns differing impacts across groups, which is a separate assessment.
        e: Veracity and robustness concerns correctness under difficult input, not operator intervention.
        f: Privacy and security concerns the handling of data and models rather than run-time control.
        g: Governance sets the policies and accountability across providers and deployers; the mechanism that enforces them at run time is controllability.
